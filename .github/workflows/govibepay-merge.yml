name: GOVIBEPAY — Fusion app.govibepay.com → govibepay.com

# Fusionne l'application (app.govibepay.com) sur le domaine racine govibepay.com :
#  - WordPress (vitrine actuelle) est SAUVEGARDÉ, jamais supprimé ;
#  - l'app est servie à la racine https://govibepay.com/ ;
#  - app.govibepay.com est vidé (redirection 301 vers la racine) ;
#  - une page d'accueil GoVibePay (landing.html, autonome) remplace la home.
#
# DÉLIBÉRÉMENT manuel (bouton) + mode « inspect » par défaut (aucun changement).
# Ordre recommandé : 1) inspect → lire le rapport  2) merge  3) vérifier le site.
# En cas de problème : mode rollback (restaure WordPress tel quel).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = audit seul (aucun changement) · merge = fusionner (sauvegarde WP + app à la racine + vider app. + landing) · landing = (ré)installer seulement la page d'accueil · rollback = restaurer WordPress"
        type: choice
        options:
          - inspect
          - merge
          - landing
          - rollback
        default: inspect

concurrency:
  group: govibepay-merge
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.mode }} sur le VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # ------------------------------------------------------------------
      # INSPECT — toujours exécuté : photographie la structure réelle du
      # serveur AVANT d'agir. Aucune écriture.
      # ------------------------------------------------------------------
      - name: Inspect (audit, aucun changement)
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          DOM="$HOME/domains/govibepay.com"
          PUB="$DOM/public_html"
          echo "=== Domaines du compte ==="
          ls -d "$HOME"/domains/*/ 2>/dev/null || true
          echo ""
          echo "=== $DOM ==="
          ls -la "$DOM" 2>/dev/null | head -30
          echo ""
          echo "=== $PUB (docroot racine — WordPress ?) ==="
          ls -la "$PUB" 2>/dev/null | head -30
          [ -f "$PUB/wp-config.php" ] && echo ">> WordPress détecté (wp-config.php présent)" || echo ">> wp-config.php ABSENT du docroot racine"
          echo ""
          echo "=== Candidats docroot app.govibepay.com ==="
          for c in "$HOME/domains/app.govibepay.com/public_html" "$PUB/app" "$DOM/app"; do
            if [ -d "$c" ]; then
              echo "--- $c ---"
              ls -la "$c" 2>/dev/null | head -20
              [ -f "$c/artisan" ] && echo ">> artisan à la racine du docroot (app Laravel complète dans le docroot)"
              [ -f "$c/../artisan" ] && echo ">> artisan au-dessus du docroot (docroot = public/ de Laravel)"
              [ -f "$c/index.php" ] && { echo ">> index.php (10 premières lignes) :"; head -10 "$c/index.php"; }
            else
              echo "--- $c : inexistant"
            fi
          done
          echo ""
          echo "=== DocumentRoot déclarés (DirectAdmin) ==="
          grep -rhi "documentroot" /usr/local/directadmin/data/users/*/httpd.conf 2>/dev/null | grep -i govibepay || echo "(non lisible ou introuvable)"
          echo ""
          echo "=== Version PHP CLI ==="
          php -v 2>/dev/null | head -1 || echo "php introuvable dans PATH"
          echo ""
          echo "=== HTTP local (sans DNS/CDN) ==="
          for H in govibepay.com app.govibepay.com; do
            curl -skS -m 12 -o /dev/null -w "  https://$H -> code=%{http_code} time=%{time_total}s\n" -H "Host: $H" "https://127.0.0.1/" || echo "  $H -> curl échec/timeout"
          done
          echo ""
          echo "=== Fusion déjà effectuée ? ==="
          if [ -f "$DOM/.govibepay-merge.meta" ]; then echo "OUI :"; cat "$DOM/.govibepay-merge.meta"; else echo "non (aucun marqueur)"; fi
          echo ""
          echo "=== Sauvegardes WordPress présentes ==="
          ls -d "$DOM"/public_html_wp_* 2>/dev/null || echo "(aucune)"
          EOSSH

      # ------------------------------------------------------------------
      # MERGE — sauvegarde WP, sert l'app à la racine, vide app.*, marqueur.
      # Idempotent (marqueur) et non destructif (tout est renommé, rien effacé).
      # ------------------------------------------------------------------
      - name: Merge (fusion app → racine)
        if: ${{ inputs.mode == 'merge' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          TS=$(date +%Y%m%d-%H%M%S)
          DOM="$HOME/domains/govibepay.com"
          PUB="$DOM/public_html"
          MARK="$DOM/.govibepay-merge.meta"
          [ -d "$DOM" ] || { echo "ERREUR: $DOM introuvable"; exit 1; }

          if [ -f "$MARK" ]; then
            echo "Déjà fusionné — rien à refaire :"
            cat "$MARK"
            exit 0
          fi

          # 1) Localiser le docroot de l'app
          APPDOC=""
          for c in "$HOME/domains/app.govibepay.com/public_html" "$PUB/app" "$DOM/app"; do
            if [ -f "$c/index.php" ] || [ -f "$c/artisan" ] || [ -f "$c/public/index.php" ]; then APPDOC="$c"; break; fi
          done
          [ -n "$APPDOC" ] || { echo "ERREUR: docroot de l'app introuvable — lancer 'inspect' et adapter le workflow."; exit 1; }
          echo "App docroot : $APPDOC"

          # 2) Racine Laravel du script (si c'en est un)
          LROOT=""
          if [ -f "$APPDOC/artisan" ]; then LROOT="$APPDOC"
          elif [ -f "$APPDOC/../artisan" ]; then LROOT="$(cd "$APPDOC/.." && pwd)"
          fi
          [ -n "$LROOT" ] && echo "Racine Laravel : $LROOT" || echo "Script PHP générique (pas d'artisan détecté)"

          # 3) Si l'app vit DANS le docroot WordPress, la sortir d'abord
          #    (sinon la sauvegarde WP l'emporterait avec elle)
          ORIG_APPDOC="$APPDOC"
          STAGED=""
          STAGED_FROM=""
          SRC="${LROOT:-$APPDOC}"
          case "$SRC" in
            "$PUB"|"$PUB"/*)
              DST="$DOM/govibepay-app"
              [ -e "$DST" ] && { echo "ERREUR: $DST existe déjà — abandon (nettoyer d'abord)."; exit 1; }
              mv "$SRC" "$DST"
              echo "→ app déplacée hors du docroot : $SRC → $DST"
              STAGED="$DST"; STAGED_FROM="$SRC"
              if [ -n "$LROOT" ]; then LROOT="$DST"; else APPDOC="$DST"; fi
              ;;
          esac

          # 4) Écarter WordPress (sauvegarde horodatée, jamais supprimé)
          WPBAK="$DOM/public_html_wp_$TS"
          mv "$PUB" "$WPBAK"
          mkdir -p "$PUB"
          echo "→ WordPress sauvegardé : $WPBAK"

          # 5) Installer l'app sur la racine
          if [ -n "$LROOT" ]; then
            # assets publics du script
            if [ -d "$LROOT/public" ]; then cp -a "$LROOT/public/." "$PUB/"; fi
            # front controller généré, pointé en ABSOLU sur la racine du script
            cat > "$PUB/index.php" <<EOPHP
          <?php
          // GOVIBEPAY — front controller genere (fusion app.govibepay.com -> govibepay.com)
          define('LARAVEL_START', microtime(true));
          if (file_exists(\$maintenance = '$LROOT/storage/framework/maintenance.php')) {
              require \$maintenance;
          }
          require '$LROOT/vendor/autoload.php';
          \$app = require_once '$LROOT/bootstrap/app.php';
          \$kernel = \$app->make(Illuminate\Contracts\Http\Kernel::class);
          \$response = \$kernel->handle(\$request = Illuminate\Http\Request::capture());
          \$response->send();
          \$kernel->terminate(\$request, \$response);
          EOPHP
            php -l "$PUB/index.php" || { echo "ERREUR: index.php généré invalide"; exit 1; }
            # lien storage recréé vers la vraie racine
            [ -L "$PUB/storage" ] && rm -f "$PUB/storage"
            [ -d "$LROOT/storage/app/public" ] && ln -s "$LROOT/storage/app/public" "$PUB/storage" || true
            # APP_URL → domaine racine
            ENVF="$LROOT/.env"
            if [ -f "$ENVF" ]; then
              cp "$ENVF" "$ENVF.bak-$TS"
              if grep -q '^APP_URL=' "$ENVF"; then
                sed -i 's#^APP_URL=.*#APP_URL=https://govibepay.com#' "$ENVF"
              else
                echo 'APP_URL=https://govibepay.com' >> "$ENVF"
              fi
              grep -E '^APP_URL=' "$ENVF"
            fi
            ( cd "$LROOT" && php artisan config:clear >/dev/null 2>&1; php artisan cache:clear >/dev/null 2>&1; php artisan view:clear >/dev/null 2>&1 ) || true
          else
            cp -a "$APPDOC/." "$PUB/"
            echo "→ contenu du script copié dans le docroot racine"
          fi

          # 6) Vider app.govibepay.com : redirection 301 vers la racine
          if [ "$ORIG_APPDOC" = "$DOM/public_html/app" ]; then
            VDIR="$PUB/app"   # recréé dans le nouveau docroot (docroot du sous-domaine DirectAdmin)
          else
            VDIR="$ORIG_APPDOC"
          fi
          mkdir -p "$VDIR"
          for f in index.php .htaccess index.html; do
            [ -f "$VDIR/$f" ] && mv "$VDIR/$f" "$VDIR/$f.pre-merge-$TS"
          done
          cat > "$VDIR/index.php" <<'EOPHP'
          <?php
          $uri = isset($_SERVER['REQUEST_URI']) ? $_SERVER['REQUEST_URI'] : '/';
          header('Location: https://govibepay.com' . $uri, true, 301);
          exit;
          EOPHP
          cat > "$VDIR/.htaccess" <<'EOHT'
          RewriteEngine On
          RewriteCond %{HTTP_HOST} ^app\.govibepay\.com$ [NC]
          RewriteRule ^(.*)$ https://govibepay.com/$1 [R=301,L]
          EOHT
          echo "→ app.govibepay.com vidé (redirection 301) : $VDIR"

          # 7) Marqueur (sert à l'idempotence + au rollback)
          {
            echo "ts=$TS"
            echo "orig_appdoc=$ORIG_APPDOC"
            echo "lroot=${LROOT:-}"
            echo "staged=${STAGED:-}"
            echo "staged_from=${STAGED_FROM:-}"
            echo "vacated=$VDIR"
            echo "wp_backup=$WPBAK"
          } > "$MARK"
          echo ""
          echo "=== Fusion OK ==="
          cat "$MARK"
          echo ""
          echo "=== Vérification HTTP locale ==="
          for H in govibepay.com app.govibepay.com; do
            curl -skS -m 12 -o /dev/null -w "  https://$H -> code=%{http_code}\n" -H "Host: $H" "https://127.0.0.1/" || true
          done
          EOSSH

      # ------------------------------------------------------------------
      # LANDING — copie la page d'accueil (autonome) et la sert en priorité.
      # Exécuté après merge, ou seul (mode landing) pour la mettre à jour.
      # ------------------------------------------------------------------
      - name: Upload landing.html
        if: ${{ inputs.mode == 'merge' || inputs.mode == 'landing' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          scp -i ~/.ssh/id_deploy -P "$PORT" -o StrictHostKeyChecking=accept-new \
            Modules/Tagtoa/deploy/govibepay/landing.html \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:.govibepay-landing-upload.html"

      - name: Install landing (page d'accueil)
        if: ${{ inputs.mode == 'merge' || inputs.mode == 'landing' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          TS=$(date +%Y%m%d-%H%M%S)
          DOM="$HOME/domains/govibepay.com"
          PUB="$DOM/public_html"
          UP="$HOME/.govibepay-landing-upload.html"
          [ -f "$UP" ] || { echo "ERREUR: landing non uploadé"; exit 1; }
          [ -f "$DOM/.govibepay-merge.meta" ] || { echo "ERREUR: fusion pas encore faite (marqueur absent) — lancer le mode merge d'abord. On n'écrase pas la home WordPress."; exit 1; }
          # sauvegarder un index.html existant qui ne serait pas le nôtre
          if [ -f "$PUB/index.html" ] && ! grep -q "GOVIBEPAY-LANDING" "$PUB/index.html"; then
            mv "$PUB/index.html" "$PUB/index.html.bak-$TS"
            echo "→ index.html existant sauvegardé"
          fi
          cp "$UP" "$PUB/index.html" && rm -f "$UP"
          # la home statique passe devant index.php ; le reste des URLs va à l'app
          HT="$PUB/.htaccess"
          if [ -f "$HT" ] && grep -qi '^DirectoryIndex' "$HT"; then
            sed -i 's#^[Dd]irectoryIndex.*#DirectoryIndex index.html index.php#' "$HT"
          else
            printf 'DirectoryIndex index.html index.php\n%s\n' "$(cat "$HT" 2>/dev/null)" > "$HT.new" && mv "$HT.new" "$HT"
          fi
          echo "→ landing installé : https://govibepay.com/ sert index.html ; l'app reste sur /login, /register, etc."
          curl -skS -m 12 -o /dev/null -w "  https://govibepay.com/ -> code=%{http_code}\n" -H "Host: govibepay.com" "https://127.0.0.1/" || true
          EOSSH

      # ------------------------------------------------------------------
      # ROLLBACK — restaure WordPress tel qu'il était (et remet l'app
      # à son emplacement d'origine si elle avait été déplacée).
      # ------------------------------------------------------------------
      - name: Rollback (restaurer WordPress)
        if: ${{ inputs.mode == 'rollback' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          TS=$(date +%Y%m%d-%H%M%S)
          DOM="$HOME/domains/govibepay.com"
          PUB="$DOM/public_html"
          MARK="$DOM/.govibepay-merge.meta"
          [ -f "$MARK" ] || { echo "ERREUR: aucun marqueur de fusion — rien à restaurer."; exit 1; }
          echo "=== Marqueur ==="; cat "$MARK"
          WPBAK=$(grep '^wp_backup=' "$MARK" | cut -d= -f2-)
          STAGED=$(grep '^staged=' "$MARK" | cut -d= -f2-)
          STAGED_FROM=$(grep '^staged_from=' "$MARK" | cut -d= -f2-)
          VACATED=$(grep '^vacated=' "$MARK" | cut -d= -f2-)
          LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          [ -n "$WPBAK" ] && [ -d "$WPBAK" ] || { echo "ERREUR: sauvegarde WordPress introuvable ($WPBAK)"; exit 1; }

          # 1) écarter le docroot fusionné (conservé, pas supprimé)
          mv "$PUB" "$DOM/public_html_merged_$TS"
          # 2) restaurer WordPress
          mv "$WPBAK" "$PUB"
          echo "→ WordPress restauré ; état fusionné conservé dans $DOM/public_html_merged_$TS"
          # 3) remettre l'app à son emplacement d'origine si on l'avait déplacée
          if [ -n "$STAGED" ] && [ -d "$STAGED" ] && [ -n "$STAGED_FROM" ] && [ ! -e "$STAGED_FROM" ]; then
            mv "$STAGED" "$STAGED_FROM"
            echo "→ app remise : $STAGED → $STAGED_FROM"
          fi
          # 4) restaurer les fichiers écartés dans le docroot vidé (sous-domaine externe)
          if [ -n "$VACATED" ] && [ -d "$VACATED" ]; then
            for f in index.php .htaccess index.html; do
              B=$(ls -t "$VACATED/$f".pre-merge-* 2>/dev/null | head -1)
              if [ -n "$B" ]; then mv "$B" "$VACATED/$f"; echo "→ restauré : $VACATED/$f"; fi
            done
          fi
          # 5) APP_URL : remettre la sauvegarde .env la plus récente
          if [ -n "$LROOT" ]; then
            B=$(ls -t "$LROOT/.env.bak-"* 2>/dev/null | head -1)
            if [ -n "$B" ]; then cp "$B" "$LROOT/.env"; echo "→ .env restauré depuis $B"; fi
            ( cd "$LROOT" && php artisan config:clear >/dev/null 2>&1 ) || true
          fi
          rm -f "$MARK"
          echo "=== Rollback OK ==="
          for H in govibepay.com app.govibepay.com; do
            curl -skS -m 12 -o /dev/null -w "  https://$H -> code=%{http_code}\n" -H "Host: $H" "https://127.0.0.1/" || true
          done
          EOSSH
