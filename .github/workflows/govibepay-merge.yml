name: GOVIBEPAY — Fusion app.govibepay.com → govibepay.com

# Fusionne l'application (app.govibepay.com — script QRPay « GOVIBEPAY WALLET »)
# sur le domaine racine govibepay.com :
#  - la page d'accueil ACTUELLE de govibepay.com est CONSERVÉE telle quelle et
#    devient la home du script (aucune redesign : c'est le design existant) ;
#  - le contenu actuel du docroot racine n'est jamais déplacé en bloc : les
#    assets de la home et les dossiers existants restent en place ;
#  - app.govibepay.com devient une redirection 301 vers la racine ;
#  - le nom du script est mis à la marque GOVIBEPay (sans jamais toucher aux URLs).
#
# DÉLIBÉRÉMENT manuel (bouton) + mode « inspect » par défaut (aucun changement).
# Ordre : 1) inspect → lire le rapport  2) merge  3) vérifier le site.
# En cas de problème : mode rollback.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = audit seul · diagnose = pourquoi le login ne marche pas · assets = retirer la dépendance au CDN mort · merge = fusionner · landing = réinstaller la home · brand = marque GOVIBEPay · rollback = tout défaire"
        type: choice
        options:
          - inspect
          - diagnose
          - assets
          - session
          - restore-login
          - login-perso
          - login-diff
          - gateways
          - http
          - fix-tap
          - fix-tap-undo
          - user-dash
          - user-ui
          - user-ui-undo
          - user-theme
          - user-theme-undo
          - support-scan
          - logs
          - prep-scan
          - coinpay-scan
          - theme-scan
          - merge
          - landing
          - brand
          - rollback
        default: inspect

concurrency:
  group: govibepay-merge
  cancel-in-progress: false

env:
  # Domaine racine cible et sous-domaine à vider. Centralisés ici.
  ROOT_DOMAIN: govibepay.com
  APP_SUBDOMAIN: app.govibepay.com

jobs:
  run:
    name: ${{ inputs.mode }} sur le VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # ------------------------------------------------------------------
      # INSPECT — toujours exécuté : photographie la structure réelle du
      # serveur AVANT d'agir, et signale les expositions publiques. Aucune écriture.
      # ------------------------------------------------------------------
      - name: Inspect (audit, aucun changement)
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          DOM="$HOME/domains/govibepay.com"
          PUB="$DOM/public_html"
          APPDOM="$HOME/domains/app.govibepay.com"

          echo "=== $PUB (docroot racine) ==="
          ls -la "$PUB" 2>/dev/null | head -30
          echo ""
          echo "=== Page d'accueil actuelle ($PUB/index.php) ==="
          if [ -f "$PUB/index.php" ]; then
            echo "taille : $(wc -c < "$PUB/index.php") octets"
            if grep -q '<?php' "$PUB/index.php"; then echo "type   : contient du PHP"; else echo "type   : HTML pur"; fi
            echo "--- références d'assets (chemins relatifs) ---"
            grep -oE '(src|href)="[^"h][^":]*"' "$PUB/index.php" 2>/dev/null \
              | sed -E 's/.*"([^\/"]+)\/.*/\1\//' | sort -u | head -15
          else
            echo "(pas d'index.php à la racine)"
          fi
          echo ""
          echo "=== Racine du script (app) ==="
          LROOT=""
          for c in "$APPDOM/public_html" "$PUB/app" "$DOM/govibepay-app"; do
            if [ -f "$c/artisan" ]; then LROOT="$c"; break; fi
            if [ -f "$c/../artisan" ]; then LROOT="$(cd "$c/.." && pwd)"; break; fi
          done
          if [ -n "$LROOT" ]; then
            echo "Script : $LROOT"
            [ -d "$LROOT/public" ] && echo "public/ : présent" || echo "public/ : ABSENT (structure inhabituelle)"
            grep -E '^(APP_NAME|APP_URL|MAIL_FROM_NAME)=' "$LROOT/.env" 2>/dev/null || echo "(.env illisible)"
            echo "--- marque visible « AppDevs » (hors URLs) ---"
            grep -rIn --exclude-dir=vendor --exclude-dir=node_modules --exclude-dir=storage \
                 --exclude-dir=.git --exclude-dir='resources[A-Z]*' -e 'AppDevs' \
                 "$LROOT/resources" 2>/dev/null | grep -viE 'appdevs\.(net|cloud)|appdevsx|cdn\.appdevs' | head -10 \
              || echo "(aucune mention hors URL)"
          else
            echo "(racine du script non détectée)"
          fi
          echo ""
          echo "=== ⚠️ EXPOSITIONS PUBLIQUES (à vérifier d'urgence) ==="
          for U in "/.env" "/.envMM" "/.env.example" "/install/" "/app/install/"; do
            for H in govibepay.com app.govibepay.com; do
              C=$(curl -skS -m 10 -o /dev/null -w '%{http_code}' --resolve "$H:443:127.0.0.1" "https://$H$U" 2>/dev/null)
              case "$C" in 200) echo "  🔴 https://$H$U -> $C  ACCESSIBLE PUBLIQUEMENT";; 403|404) echo "  ✅ https://$H$U -> $C";; *) echo "  ?  https://$H$U -> $C";; esac
            done
          done
          echo "--- archives du script téléchargeables dans le docroot ? ---"
          find "$PUB" -maxdepth 3 -name '*.zip' -size +1M 2>/dev/null | head -5 || true
          echo ""
          echo "=== Version PHP CLI ==="
          php -v 2>/dev/null | head -1 || echo "php introuvable"
          echo ""
          echo "=== HTTP local (sans DNS/CDN) ==="
          for H in govibepay.com app.govibepay.com; do
            curl -skS -m 12 -o /dev/null -w "  https://$H -> code=%{http_code} time=%{time_total}s\n" --resolve "$H:443:127.0.0.1" "https://$H/" || echo "  $H -> échec"
          done
          echo ""
          echo "=== Fusion déjà effectuée ? ==="
          if [ -f "$DOM/.govibepay-merge.meta" ]; then echo "OUI :"; cat "$DOM/.govibepay-merge.meta"; else echo "non (aucun marqueur)"; fi
          echo ""
          echo "=== Sauvegardes de fusion présentes ==="
          ls -d "$DOM"/govibepay-merge-backup-* 2>/dev/null || echo "(aucune)"
          EOSSH

      # ------------------------------------------------------------------
      # DIAGNOSE — pourquoi https://app.govibepay.com/admin/login ne marche pas.
      # Lecture seule, SAUF un vidage de cache et une remise en ordre des
      # permissions storage/ + bootstrap/cache (causes n°1 des 419/500 au login).
      # Aucune donnée sensible n'est affichée (pas de mot de passe, pas d'APP_KEY).
      # ------------------------------------------------------------------
      - name: Diagnose (login admin)
        if: ${{ inputs.mode == 'diagnose' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          DOM="$HOME/domains/govibepay.com"
          APPDOM="$HOME/domains/app.govibepay.com"
          LROOT=""
          for c in "$APPDOM/public_html" "$DOM/public_html/app" "$DOM/govibepay-app"; do
            [ -f "$c/artisan" ] && { LROOT="$c"; break; }
          done
          [ -n "$LROOT" ] || { echo "ERREUR: script introuvable."; exit 1; }
          echo "Script : $LROOT"
          echo ""

          echo "=== 1. Réponse HTTP par chemin (hôte app.govibepay.com) ==="
          for U in "/" "/login" "/register" "/user/login" "/merchant/login" "/agent/login" "/admin" "/admin/login"; do
            CODE=$(curl -skS -m 15 -o /dev/null -w '%{http_code}' --resolve "app.govibepay.com:443:127.0.0.1" "https://app.govibepay.com$U" 2>/dev/null)
            SIZE=$(curl -skS -m 15 -o /dev/null -w '%{size_download}' --resolve "app.govibepay.com:443:127.0.0.1" "https://app.govibepay.com$U" 2>/dev/null)
            printf '  %-22s code=%s taille=%s\n' "$U" "$CODE" "$SIZE"
          done
          echo "  (une taille ~355 = page d'erreur Apache : la requête n'atteint PAS Laravel)"
          echo ""

          echo "=== 1b. Réécriture Apache (pourquoi une requête n'atteint pas Laravel) ==="
          echo "--- .htaccess à la racine du script ---"
          [ -f "$LROOT/.htaccess" ] && cat "$LROOT/.htaccess" || echo "  (ABSENT)"
          echo "--- public/index.php présent ? ---"
          [ -f "$LROOT/public/index.php" ] && echo "  oui" || echo "  🔴 NON"
          echo "--- public/.htaccess ---"
          [ -f "$LROOT/public/.htaccess" ] && head -25 "$LROOT/public/.htaccess" || echo "  (ABSENT)"
          echo ""

          echo "=== 1c. Le chemin du login admin existe-t-il dans le script ? ==="
          grep -rIn --include='*.php' -iE "prefix\(?['\"]?admin|'admin/login'|admin\.login" "$LROOT/routes" 2>/dev/null | head -10 || echo "  (rien trouvé dans routes/)"
          echo "--- fichiers de routes présents ---"
          ls "$LROOT/routes" 2>/dev/null
          echo ""
          echo "--- le formulaire contient-il un jeton CSRF ? ---"
          BODY=$(curl -skS -m 15 --resolve "app.govibepay.com:443:127.0.0.1" "https://app.govibepay.com/admin/login" 2>/dev/null)
          echo "$BODY" | grep -qi 'csrf-token\|_token' && echo "  ✅ jeton CSRF présent dans la page" || echo "  ⚠️ AUCUN jeton CSRF trouvé (page d'erreur ? page vide ?)"
          echo "  titre de la page : $(echo "$BODY" | grep -oiE '<title>[^<]*' | head -1)"
          echo "  cookie de session émis : $(curl -skS -m 15 -D - -o /dev/null --resolve "app.govibepay.com:443:127.0.0.1" "https://app.govibepay.com/admin/login" 2>/dev/null | grep -ci '^set-cookie') en-tête(s)"
          echo ""

          echo "=== 2. Configuration (clés non sensibles) ==="
          grep -E '^(APP_ENV|APP_DEBUG|APP_URL|SESSION_DRIVER|SESSION_DOMAIN|SESSION_SECURE_COOKIE|CACHE_DRIVER|CACHE_STORE|QUEUE_CONNECTION|DB_CONNECTION|DB_HOST|DB_DATABASE)=' "$LROOT/.env" 2>/dev/null || echo "(.env illisible)"
          echo ""

          echo "=== 3. Permissions (cause n°1 des 500/419) ==="
          for d in storage storage/framework storage/framework/sessions storage/framework/views storage/framework/cache storage/logs bootstrap/cache; do
            if [ -d "$LROOT/$d" ]; then
              W=$([ -w "$LROOT/$d" ] && echo "inscriptible" || echo "🔴 NON INSCRIPTIBLE")
              printf '  %-34s %s  %s\n' "$d" "$(stat -c '%a %U' "$LROOT/$d" 2>/dev/null)" "$W"
            else
              echo "  🔴 $d ABSENT"
            fi
          done
          echo ""

          echo "=== 4. Journal Laravel — erreurs DISTINCTES (pas 40 fois la même) ==="
          LOG="$LROOT/storage/logs/laravel.log"
          if [ -f "$LOG" ]; then
            echo "  (fichier : $(du -h "$LOG" | cut -f1), modifié $(date -r "$LOG" '+%Y-%m-%d %H:%M'))"
            echo "  --- types d'erreur les plus fréquents ---"
            grep -aoE '(ERROR|CRITICAL|EMERGENCY): [^{]{0,90}' "$LOG" 2>/dev/null \
              | sed -E 's/[0-9]{4}-[0-9]{2}-[0-9]{2}//g' | sort | uniq -c | sort -rn | head -12
            echo "  --- 10 dernières erreurs (horodatées) ---"
            grep -aE 'ERROR|CRITICAL|EMERGENCY' "$LOG" 2>/dev/null | tail -10 | cut -c1-180
          else
            echo "  (aucun laravel.log)"
          fi
          echo ""

          echo "=== 5. Table de routes RÉELLEMENT enregistrée ==="
          # route:list plante sur ce script (constructeur de contrôleur qui échoue) :
          # on amorce Laravel sans instancier aucun contrôleur.
          cat > "$LROOT/.govibepay-routes.php" <<'EOPHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require_once __DIR__.'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $routes = app('router')->getRoutes();
          echo "TOTAL ROUTES: ".count($routes)."\n";
          // Routes d'administration : c'est la réponse à « quelle est l'URL du login ».
          $adm = [];
          foreach ($routes as $r) {
              $n = (string) $r->getName();
              if (str_starts_with($n, 'admin.')) { $adm[] = implode('|', $r->methods()).' /'.$r->uri().'  ['.$n.']'; }
          }
          echo "ROUTES ADMIN ENREGISTREES: ".count($adm)."\n";
          foreach ($adm as $h) {
              if (preg_match('#login|auth|^GET\|HEAD /admin  #i', $h)) { echo "  $h\n"; }
          }
          if (! $adm) { echo "  🔴 AUCUNE route admin : routes/admin.php n'est PAS chargé\n"; }
          // Routes web de connexion (hors API)
          $web = [];
          foreach ($routes as $r) {
              $u = $r->uri();
              if (preg_match('#login#i', $u) && ! str_starts_with($u, 'api') && ! str_contains($u, '-api/')) {
                  $web[] = implode('|', $r->methods()).' /'.$u.'  ['.($r->getName() ?: '-').']';
              }
          }
          echo "ROUTES WEB CONTENANT « login » (".count($web)."):\n";
          foreach (array_slice($web, 0, 20) as $h) { echo "  $h\n"; }
          EOPHP
          ( cd "$LROOT" && php .govibepay-routes.php 2>&1 | head -35 ) || echo "  🔴 l'amorçage de Laravel ÉCHOUE (voir l'erreur ci-dessus) — c'est la cause du 404 partout"
          rm -f "$LROOT/.govibepay-routes.php"
          echo ""
          echo "--- comment les fichiers de routes sont chargés ---"
          sed -n '1,80p' "$LROOT/app/Providers/RouteServiceProvider.php" 2>/dev/null | grep -nE 'loadRoutesFrom|prefix|group|middleware|function boot|routes/' | head -20
          echo "--- préfixe admin configurable ? ---"
          grep -rIn --include='*.php' -iE "admin_prefix|ADMIN_PREFIX|'prefix'\s*=>\s*'?admin" "$LROOT/config" "$LROOT/app/Providers" 2>/dev/null | head -8 || echo "  (aucun préfixe configurable trouvé)"
          echo ""

          echo "=== 5b. Page de connexion admin : pourquoi le champ ne réagit pas ? ==="
          # Le préfixe admin vient de la base. On le lit pour ATTEINDRE la page,
          # mais on ne l'affiche JAMAIS (dépôt public) — seuls les constats sortent.
          # On interroge la base VIA LARAVEL (sa propre config) : analyser le .env
          # à la main échouait silencieusement. Le préfixe n'est jamais affiché.
          cat > "$LROOT/.govibepay-prefix.php" <<'EOPHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require_once __DIR__.'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          try {
              $row = Illuminate\Support\Facades\DB::table('basic_settings')->first();
              foreach (['admin_prefix', 'admin_panel_prefix', 'prefix'] as $col) {
                  if ($row && isset($row->$col) && $row->$col !== '') { echo $row->$col; exit; }
              }
              fwrite(STDERR, "colonnes de basic_settings contenant 'prefix' : ");
              fwrite(STDERR, implode(',', array_values(array_filter(array_keys((array) $row), fn ($k) => str_contains($k, 'prefix')))) ?: '(aucune)');
          } catch (Throwable $e) {
              fwrite(STDERR, 'base inaccessible : '.get_class($e).' — '.substr($e->getMessage(), 0, 80));
          }
          EOPHP
          PFX=$( cd "$LROOT" && php .govibepay-prefix.php 2>>/tmp/gvp-prefix.err )
          rm -f "$LROOT/.govibepay-prefix.php"
          [ -s /tmp/gvp-prefix.err ] && { echo "  (info base : $(cat /tmp/gvp-prefix.err))"; rm -f /tmp/gvp-prefix.err; }
          if [ -z "$PFX" ]; then
            echo "  ⚠️ préfixe admin illisible en base — on teste /admin par défaut"
            echo "  --- colonnes contenant « prefix » (noms seuls, aucune valeur) ---"
            L="$LROOT" php -r '
              $e=@file(getenv("L")."/.env"); $c=[];
              foreach((array)$e as $l){ if(preg_match("/^\s*([A-Z_]+)\s*=\s*\"?([^\"\r\n]*)\"?/",$l,$m)) $c[$m[1]]=$m[2]; }
              try{
                $db=$c["DB_DATABASE"]??"";
                $p=new PDO("mysql:host=".($c["DB_HOST"]??"127.0.0.1").";dbname=".$db,$c["DB_USERNAME"]??"",$c["DB_PASSWORD"]??"");
                $q=$p->prepare("SELECT TABLE_NAME,COLUMN_NAME FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=? AND COLUMN_NAME LIKE ?");
                $q->execute([$db,"%prefix%"]);
                foreach($q->fetchAll(PDO::FETCH_NUM) as $r){ echo "    ".$r[0].".".$r[1]."\n"; }
              }catch(Throwable $t){ echo "    (connexion base impossible : ".get_class($t).")\n"; }
            ' 2>/dev/null
            PFX="admin"
          else
            echo "  ✅ préfixe admin lu en base (valeur masquée : ${#PFX} caractères)"
          fi
          PAGE=$(curl -skS -m 20 --resolve "app.govibepay.com:443:127.0.0.1" "https://app.govibepay.com/$PFX/login" 2>/dev/null)
          CODE=$(curl -skS -m 20 -o /dev/null -w '%{http_code}' --resolve "app.govibepay.com:443:127.0.0.1" "https://app.govibepay.com/$PFX/login" 2>/dev/null)
          echo "  page de connexion : code=$CODE taille=$(printf '%s' "$PAGE" | wc -c) octets"
          echo "  jeton CSRF        : $(printf '%s' "$PAGE" | grep -c 'csrf-token\|_token') occurrence(s)"
          echo ""
          echo "  --- champs de saisie bloqués côté HTML ? ---"
          for ATTR in readonly disabled 'pointer-events' 'user-select'; do
            N=$(printf '%s' "$PAGE" | grep -ci "$ATTR")
            [ "$N" != "0" ] && echo "  ⚠️ « $ATTR » présent $N fois dans la page" || echo "  ✅ pas de « $ATTR »"
          done
          echo ""
          echo "  --- superpositions qui peuvent intercepter le toucher ---"
          for W in preloader loader overlay modal-backdrop 'position:fixed' 'z-index'; do
            N=$(printf '%s' "$PAGE" | grep -ci "$W")
            [ "$N" != "0" ] && echo "  • « $W » : $N occurrence(s)" || true
          done
          echo ""
          echo "  --- viewport mobile déclaré ? ---"
          printf '%s' "$PAGE" | grep -qi 'name="viewport"' && echo "  ✅ balise viewport présente" || echo "  🔴 AUCUNE balise viewport : sur mobile la page est rendue en taille bureau"
          echo ""
          echo "  --- assets EXTERNES dont dépend la page (SPOF si injoignables) ---"
          printf '%s' "$PAGE" | grep -oE '(src|href)="https?://[^"]+"' | sed -E 's/.*"https?:\/\/([^\/"]+).*/\1/' | sort | uniq -c | sort -rn | head -10
          echo "  --- ces hôtes répondent-ils DEPUIS LE SERVEUR ? ---"
          for H in appdevs.cloud cdn.appdevs.net; do
            RC=$(curl -skS -m 10 -o /dev/null -w '%{http_code}' "https://$H/" 2>/dev/null)
            case "$RC" in 000) echo "  🔴 $H INJOIGNABLE (timeout) — le CSS/JS qu'il sert ne charge pas";; *) echo "  ✅ $H -> $RC";; esac
          done
          echo ""
          echo "  --- assets LOCAUX référencés qui manquent sur le disque ---"
          MISS=0
          for P in $(printf '%s' "$PAGE" | grep -oE '(src|href)="/[^"]+\.(css|js)"' | sed -E 's/.*"(\/[^"]+)"/\1/' | sort -u | head -25); do
            [ -f "$LROOT/public$P" ] || { echo "  🔴 manquant : $P"; MISS=$((MISS+1)); }
          done
          [ "$MISS" = "0" ] && echo "  ✅ tous les assets locaux référencés existent"
          echo ""

          echo "=== 5c. Pourquoi les champs ne prennent pas le focus ==="
          cat > "$LROOT/.govibepay-focus.php" <<'EOPHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require_once __DIR__.'/bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Http\Kernel::class);
          $res = $kernel->handle(Illuminate\Http\Request::create('https://govibepay.com/admin/login', 'GET'));
          $body = (string) $res->getContent();

          echo "  --- contexte de « pointer-events » ---\n";
          if (preg_match_all('#.{160}pointer-events\s*:\s*none.{60}#is', $body, $m)) {
              foreach ($m[0] as $frag) {
                  echo '   …', preg_replace('/\s+/', ' ', $frag), "…\n";
              }
          } else {
              echo "   (aucune occurrence)\n";
          }

          echo "  --- reCAPTCHA ---\n";
          echo '   script Google présent dans la page : ',
              (str_contains($body, 'recaptcha/api.js') ? 'OUI' : 'non'), "\n";
          try {
              $row = Illuminate\Support\Facades\DB::table('basic_settings')->first();
              foreach ((array) $row as $k => $v) {
                  if (stripos($k, 'captcha') !== false || stripos($k, 'recaptcha') !== false) {
                      $shown = is_scalar($v) ? (strlen((string) $v) > 20 ? '(valeur longue)' : (string) $v) : '(objet)';
                      echo '   réglage ', $k, ' = ', $shown, "\n";
                  }
              }
          } catch (Throwable $e) {
              echo '   (base inaccessible : ', substr($e->getMessage(), 0, 80), ")\n";
          }

          echo "  --- éléments pouvant recouvrir le formulaire ---\n";
          foreach (['preloader', 'loader', 'overlay', 'modal-backdrop', 'position:fixed'] as $w) {
              $n = substr_count(strtolower($body), strtolower($w));
              if ($n) { echo '   « ', $w, " » ×", $n, "\n"; }
          }

          // Assez deviné : on lit le balisage réel.
          echo "  --- balise viewport telle qu'elle est envoyée ---\n";
          if (preg_match('#<meta[^>]+name="viewport"[^>]*>#i', $body, $mv)) {
              echo '   ', trim($mv[0]), "\n";
          }
          echo "  --- le formulaire de connexion, tel qu'il est envoyé ---\n";
          if (preg_match('#<form[^>]*>.*?</form>#is', $body, $mf)) {
              $form = preg_replace('#\s+#', ' ', $mf[0]);
              foreach (str_split(substr($form, 0, 2400), 200) as $chunk) {
                  echo '   ', $chunk, "\n";
              }
              echo '   [longueur totale du formulaire : ', strlen($mf[0]), " octets]\n";
          } else {
              echo "   🔴 AUCUNE balise <form> dans la page — c'est la cause : rien à remplir.\n";
          }

          // Le formulaire utilise des classes gvpa-* : page personnalisée, pas le
          // gabarit d'origine. Sans son CSS, le lien « afficher le mot de passe »
          // n'est plus positionné et peut recouvrir les champs — un toucher tombe
          // alors sur un javascript:void(0) et il ne se passe rien.
          echo "  --- le CSS des classes gvpa-* est-il livré ? ---\n";
          $inline = preg_match_all('#<style[^>]*>(.*?)</style>#is', $body, $st) ? implode("\n", $st[1]) : '';
          echo '   défini dans un <style> de la page : ',
              (str_contains($inline, 'gvpa-input') || str_contains($inline, '.gvpa-') ? 'OUI' : 'non'), "\n";
          preg_match_all('#(?:src|href)="https://govibepay\.com/([^"?]+\.css)#', $body, $cssm);
          $found = false;
          foreach (array_unique($cssm[1] ?? []) as $rel) {
              $file = ($argv[1] ?? '').'/'.$rel;
              if (is_file($file) && str_contains((string) file_get_contents($file), '.gvpa-')) {
                  echo '   défini dans la feuille de style : ', $rel, "\n";
                  $found = true;
              }
          }
          if (! $found && ! str_contains($inline, '.gvpa-')) {
              echo "   🔴 INTROUVABLE — aucune feuille chargée ne définit .gvpa-* :\n";
              echo "      le formulaire s'affiche sans mise en page, et le lien\n";
              echo "      « afficher le mot de passe » se retrouve par-dessus les champs.\n";
          }
          EOPHP
          ( cd "$LROOT" && php .govibepay-focus.php "$DOM/public_html" ) || echo "  (échec du rendu)"
          rm -f "$LROOT/.govibepay-focus.php"
          echo ""

          echo "=== 6. Réparation sûre : vidage des caches ==="
          ( cd "$LROOT" && for c in config:clear cache:clear route:clear view:clear; do
              printf '  artisan %-14s ' "$c"; php artisan $c >/dev/null 2>&1 && echo "ok" || echo "échec (ignoré)"
            done ) || true
          echo "--- permissions remises en ordre ---"
          chmod -R u+rwX "$LROOT/storage" "$LROOT/bootstrap/cache" 2>/dev/null && echo "  storage/ + bootstrap/cache : ok" || echo "  (chmod partiel)"
          echo ""

          echo "=== 7. Nouvelle réponse après réparation ==="
          for H in app.govibepay.com; do
            curl -skS -m 15 -o /dev/null -w "  https://$H/admin/login -> code=%{http_code}\n" --resolve "$H:443:127.0.0.1" "https://$H/admin/login" || true
          done
          echo ""
          echo "NOTE: si le code est 200 et qu'un jeton CSRF est présent, la page marche —"
          echo "le problème est alors le mot de passe. Dites-le moi : je peux ajouter un mode"
          echo "de réinitialisation du mot de passe administrateur."
          EOSSH

      # ------------------------------------------------------------------
      # MERGE — DÉPLACE le script dans l'arborescence de govibepay.com.
      #
      # Une première tentative gardait le script dans domains/app.govibepay.com
      # et le bootait depuis un front controller placé sous govibepay.com : le
      # site est tombé. PHP est presque certainement soumis à open_basedir par
      # domaine (le journal du script en contient des erreurs), donc lire le
      # vendor/ d'un AUTRE domaine est refusé. Le script est donc déplacé sous
      # domains/govibepay.com/govibepay-app/ : tout reste dans la même
      # arborescence et la restriction ne s'applique plus.
      #
      # La home actuelle est conservée telle quelle et servie par une route '/'.
      # Idempotent (marqueur) ; l'étape de vérification qui suit annule tout
      # automatiquement si l'application ne répond pas.
      # ------------------------------------------------------------------
      - name: Merge (déplacer le script sous govibepay.com)
        if: ${{ inputs.mode == 'merge' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          TS=$(date +%Y%m%d-%H%M%S)
          DOM="$HOME/domains/govibepay.com"
          PUB="$DOM/public_html"
          APPDOM="$HOME/domains/app.govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          BK="$DOM/govibepay-merge-backup-$TS"
          NEWROOT="$DOM/govibepay-app"
          [ -d "$PUB" ] || { echo "ERREUR: $PUB introuvable"; exit 1; }

          if [ -f "$MARK" ]; then
            echo "Déjà fusionné — rien à refaire :"; cat "$MARK"; exit 0
          fi

          # 1) Localiser le script et vérifier qu'il est complet AVANT de bouger quoi que ce soit
          SRC=""
          for c in "$APPDOM/public_html" "$PUB/app" "$NEWROOT"; do
            [ -f "$c/artisan" ] && { SRC="$c"; break; }
          done
          [ -n "$SRC" ] || { echo "ERREUR: script introuvable — lancer 'inspect'."; exit 1; }
          for need in public/index.php vendor/autoload.php bootstrap/app.php routes/web.php .env; do
            [ -e "$SRC/$need" ] || { echo "ERREUR: $need absent dans $SRC — abandon avant toute modification."; exit 1; }
          done
          echo "Script trouvé : $SRC"
          [ -e "$NEWROOT" ] && { echo "ERREUR: $NEWROOT existe déjà — nettoyer d'abord."; exit 1; }
          mkdir -p "$BK"

          # 2) DÉPLACEMENT (renommage atomique : même système de fichiers)
          mv "$SRC" "$NEWROOT" || { echo "ERREUR: déplacement impossible."; exit 1; }
          echo "→ script déplacé : $SRC → $NEWROOT"
          MOVED_FROM="$SRC"
          mkdir -p "$MOVED_FROM"

          # 3) Purger les caches compilés : ils contiennent les ANCIENS chemins absolus
          rm -f "$NEWROOT"/bootstrap/cache/*.php 2>/dev/null || true
          rm -f "$NEWROOT"/storage/framework/views/*.php 2>/dev/null || true
          echo "→ caches compilés purgés (ils référençaient l'ancien chemin)"

          # 4) La home actuelle du domaine est conservée, dans le docroot
          HOMEFILE=""
          for f in index.php index.html; do
            if [ -f "$PUB/$f" ]; then
              cp -a "$PUB/$f" "$BK/$f"
              mv "$PUB/$f" "$PUB/govibepay-home.php"
              HOMEFILE="$PUB/govibepay-home.php"
              echo "→ home conservée : $HOMEFILE ($(wc -c < "$HOMEFILE") octets)"
              break
            fi
          done
          [ -n "$HOMEFILE" ] || echo "→ aucune home existante (le script servira la sienne)"

          # 5) Assets publics du script, sans écraser l'existant
          [ -f "$PUB/.htaccess" ] && cp -a "$PUB/.htaccess" "$BK/.htaccess"
          cp -an "$NEWROOT/public/." "$PUB/" 2>/dev/null || true

          # 6) Front controller — chemins RELATIFS : tout est dans la même arborescence
          cat > "$PUB/index.php" <<'EOPHP'
          <?php
          // GOVIBEPAY — front controller genere (script servi a la racine du domaine).
          // Chemins relatifs : l'application vit dans ../govibepay-app, sous le meme
          // domaine, ce qui evite toute restriction open_basedir inter-domaines.
          define('LARAVEL_START', microtime(true));
          $root = __DIR__.'/../govibepay-app';
          if (file_exists($maintenance = $root.'/storage/framework/maintenance.php')) {
              require $maintenance;
          }
          require $root.'/vendor/autoload.php';
          $app = require_once $root.'/bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Http\Kernel::class);
          $response = $kernel->handle($request = Illuminate\Http\Request::capture());
          $response->send();
          $kernel->terminate($request, $response);
          EOPHP
          php -l "$PUB/index.php" || { echo "ERREUR: front controller invalide"; exit 1; }

          # 7) storage public + APP_URL
          [ -L "$PUB/storage" ] && rm -f "$PUB/storage"
          [ -d "$NEWROOT/storage/app/public" ] && ln -s "$NEWROOT/storage/app/public" "$PUB/storage" 2>/dev/null || true
          ENVF="$NEWROOT/.env"
          cp -a "$ENVF" "$BK/.env"
          if grep -q '^APP_URL=' "$ENVF"; then
            sed -i 's#^APP_URL=.*#APP_URL=https://govibepay.com#' "$ENVF"
          else
            echo 'APP_URL=https://govibepay.com' >> "$ENVF"
          fi
          grep -E '^APP_URL=' "$ENVF"

          # 8) Sous-domaine vidé → redirection 301
          cat > "$MOVED_FROM/index.php" <<'EOPHP'
          <?php
          $uri = isset($_SERVER['REQUEST_URI']) ? $_SERVER['REQUEST_URI'] : '/';
          header('Location: https://govibepay.com'.$uri, true, 301);
          exit;
          EOPHP
          php -l "$MOVED_FROM/index.php" >/dev/null || true
          cat > "$MOVED_FROM/.htaccess" <<'EOHT'
          # GOVIBEPAY-REDIRECT — app.govibepay.com est fusionné dans govibepay.com.
          RewriteEngine On
          RewriteCond %{HTTP_HOST} ^app\.govibepay\.com$ [NC]
          RewriteRule ^(.*)$ https://govibepay.com/$1 [R=301,L]
          EOHT
          echo "→ $MOVED_FROM : redirection 301 installée"

          # 9) Marqueur
          {
            echo "ts=$TS"
            echo "lroot=$NEWROOT"
            echo "moved_from=$MOVED_FROM"
            echo "pub=$PUB"
            echo "homefile=${HOMEFILE:-}"
            echo "vacated=$MOVED_FROM"
            echo "backup=$BK"
          } > "$MARK"
          ( cd "$NEWROOT" && php artisan config:clear >/dev/null 2>&1; php artisan cache:clear >/dev/null 2>&1 ) || true
          echo ""; echo "=== Déplacement OK (vérification à suivre) ==="; cat "$MARK"
          EOSSH

      # ------------------------------------------------------------------
      # LANDING — installe la route '/' dans le script pour servir la home
      # conservée. Aucune réécriture de design : c'est le fichier existant.
      # ------------------------------------------------------------------
      - name: Install home route (page d'accueil dans le script)
        if: ${{ inputs.mode == 'merge' || inputs.mode == 'landing' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          [ -f "$MARK" ] || { echo "ERREUR: fusion pas encore faite — lancer le mode merge d'abord."; exit 1; }
          LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          HOMEFILE=$(grep '^homefile=' "$MARK" | cut -d= -f2-)
          [ -n "$LROOT" ] && [ -f "$LROOT/routes/web.php" ] || { echo "ERREUR: routes/web.php introuvable"; exit 1; }
          if [ -z "$HOMEFILE" ] || [ ! -f "$HOMEFILE" ]; then
            echo "Aucune home conservée à servir — le script garde sa page d'accueil. Rien à faire."; exit 0
          fi

          WEB="$LROOT/routes/web.php"
          [ -f "$WEB.bak-govibepay" ] || cp -a "$WEB" "$WEB.bak-govibepay"
          if grep -q 'GOVIBEPAY-LANDING-ROUTE' "$WEB"; then
            echo "Route déjà présente — mise à jour du chemin."
            sed -i "s#^// GOVIBEPAY-HOME-FILE=.*#// GOVIBEPAY-HOME-FILE=$HOMEFILE#" "$WEB"
          else
            cat >> "$WEB" <<EOPHP

          // GOVIBEPAY-LANDING-ROUTE — home publique de govibepay.com.
          // Sert la page d'accueil existante du domaine (design conservé tel quel).
          // Enregistrée en dernier : elle prend le pas sur la home d'origine du script.
          // GOVIBEPAY-HOME-FILE=$HOMEFILE
          Route::get('/', function () {
              \$f = '$HOMEFILE';
              if (! is_file(\$f)) {
                  abort(404);
              }
              ob_start();
              include \$f;

              return response(ob_get_clean());
          });
          EOPHP
          fi

          if ! php -l "$WEB" >/dev/null 2>&1; then
            echo "ERREUR: routes/web.php invalide — restauration immédiate"
            cp -a "$WEB.bak-govibepay" "$WEB"
            php -l "$WEB" && echo "(restauré)"
            exit 1
          fi
          ( cd "$LROOT" && php artisan route:clear >/dev/null 2>&1; php artisan view:clear >/dev/null 2>&1; php artisan config:clear >/dev/null 2>&1 ) || true
          echo "→ route '/' installée dans le script, servant : $HOMEFILE"
          curl -skS -m 12 -o /dev/null -w "  https://govibepay.com/ -> code=%{http_code}\n" --resolve "govibepay.com:443:127.0.0.1" "https://govibepay.com/" || true
          EOSSH

      # ------------------------------------------------------------------
      # BRAND — met le script à la marque GOVIBEPay.
      # ⚠️ Ne touche JAMAIS aux URLs (appdevs.net / appdevs.cloud / appdevsx /
      # qrpay.appdevs.net) : les réécrire casserait le chargement des assets.
      # Seules les mentions de marque VISIBLES sont remplacées.
      # ------------------------------------------------------------------
      - name: Brand (marque GOVIBEPay)
        if: ${{ inputs.mode == 'merge' || inputs.mode == 'brand' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          TS=$(date +%Y%m%d-%H%M%S)
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          BRAND="GOVIBEPay"

          LROOT=""
          [ -f "$MARK" ] && LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          if [ -z "$LROOT" ] || [ ! -d "$LROOT" ]; then
            for c in "$HOME/domains/app.govibepay.com/public_html" "$DOM/public_html/app" "$DOM/govibepay-app"; do
              if [ -f "$c/artisan" ]; then LROOT="$c"; break; fi
            done
          fi
          [ -n "$LROOT" ] && [ -d "$LROOT" ] || { echo "ERREUR: script introuvable."; exit 1; }
          echo "Script : $LROOT"

          # 1) .env — nom applicatif
          ENVF="$LROOT/.env"
          if [ -f "$ENVF" ]; then
            CUR=$(grep -E '^APP_NAME=' "$ENVF" | head -1)
            echo "APP_NAME actuel : ${CUR:-(absent)}"
            if echo "$CUR" | grep -qiE 'appdev'; then
              cp -a "$ENVF" "$ENVF.bak-brand-$TS"
              sed -i "s#^APP_NAME=.*#APP_NAME=\"$BRAND\"#" "$ENVF"
              echo "→ APP_NAME mis à $BRAND"
            else
              echo "→ APP_NAME ne contient pas « appdev » : laissé tel quel (pas de casse inutile)."
            fi
          fi

          # 2) Mentions VISIBLES de la marque éditeur, hors URLs et hors dossiers
          #    de sauvegarde (resourcesBBBB, resources.bak…).
          BK="$DOM/brand-backup-$TS"
          COUNT=0
          for zone in resources/views lang resources/lang; do
            Z="$LROOT/$zone"
            [ -d "$Z" ] || continue
            while IFS= read -r f; do
              case "$f" in *"/resources"[A-Z]*|*".bak/"*|*"/vendor/"*|*"/node_modules/"*) continue;; esac
              # lignes contenant une URL du fournisseur : on les saute entièrement
              grep -qiE 'appdevs\.(net|cloud)|appdevsx|cdn\.appdevs' "$f" && HASURL=1 || HASURL=0
              rel="${f#$LROOT/}"
              mkdir -p "$BK/$(dirname "$rel")"
              cp -a "$f" "$BK/$rel"
              if [ "$HASURL" = "1" ]; then
                # remplacement ligne par ligne en épargnant les lignes à URL
                awk -v b="$BRAND" '
                  /appdevs\.(net|cloud)|appdevsx|cdn\.appdevs/ { print; next }
                  { gsub(/AppDevs\.?/, b); gsub(/Appdevs/, b); gsub(/appdev/, b); print }
                ' "$f" > "$f.brandtmp" && mv "$f.brandtmp" "$f"
              else
                sed -i -e "s/AppDevs\./$BRAND/g" -e "s/AppDevs/$BRAND/g" -e "s/Appdevs/$BRAND/g" -e "s/appdev/$BRAND/g" "$f"
              fi
              case "$f" in
                *.php)
                  if ! php -l "$f" >/dev/null 2>&1; then
                    echo "!! $rel cassé — restauré"; cp -a "$BK/$rel" "$f"
                  fi
                  ;;
              esac
              COUNT=$((COUNT+1))
            done < <(grep -rIli --exclude-dir=node_modules --exclude-dir=vendor -e 'appdev' "$Z" 2>/dev/null)
          done
          echo "→ $COUNT fichier(s) modifié(s) ; sauvegarde : $BK"
          echo "   (les URLs appdevs.net / appdevs.cloud sont volontairement INTACTES :"
          echo "    les réécrire casserait le CSS/JS du script.)"

          ( cd "$LROOT" && php artisan view:clear >/dev/null 2>&1; php artisan config:clear >/dev/null 2>&1 ) || true
          echo ""
          echo "NOTE: le nom affiché du site vient souvent des Réglages en BASE DE DONNÉES"
          echo "(panneau admin → Settings / Site Name). S'il reste « appdev » quelque part,"
          echo "c'est là qu'il faut le changer."
          EOSSH

      # ------------------------------------------------------------------
      # VERIFY — après une fusion, rend réellement les pages via le kernel HTTP
      # de Laravel. C'est la seule vérification fiable dont on dispose : les
      # sondes curl vers 127.0.0.1 n'atteignent pas le vhost de l'application.
      # Si la page d'accueil ne répond pas, TOUT est annulé automatiquement —
      # le site ne doit jamais rester cassé.
      # ------------------------------------------------------------------
      - name: Verify (rendu réel, annulation auto si échec)
        if: ${{ inputs.mode == 'merge' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          [ -f "$MARK" ] || { echo "ERREUR: pas de marqueur — fusion non effectuée."; exit 1; }
          LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          PUB=$(grep '^pub=' "$MARK" | cut -d= -f2-)
          MOVED_FROM=$(grep '^moved_from=' "$MARK" | cut -d= -f2-)
          HOMEFILE=$(grep '^homefile=' "$MARK" | cut -d= -f2-)
          BK=$(grep '^backup=' "$MARK" | cut -d= -f2-)

          cat > "$LROOT/.govibepay-verify.php" <<'EOPHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require_once __DIR__.'/bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Http\Kernel::class);
          $ok = true;
          foreach (['/', '/admin/login'] as $uri) {
              try {
                  $req = Illuminate\Http\Request::create('https://govibepay.com'.$uri, 'GET');
                  $res = $kernel->handle($req);
                  $code = $res->getStatusCode();
                  $body = (string) $res->getContent();
                  printf("  %-14s status=%d taille=%d csrf=%s cdn_mort=%s\n", $uri, $code, strlen($body),
                      (str_contains($body, 'csrf-token') || str_contains($body, '_token')) ? 'oui' : 'non',
                      str_contains($body, 'cdn.appdevs.net') ? 'OUI' : 'non');
                  if ($uri === '/' && $code >= 500) { $ok = false; }
              } catch (Throwable $e) {
                  printf("  %-14s EXCEPTION %s : %s\n", $uri, get_class($e), substr($e->getMessage(), 0, 140));
                  if ($uri === '/') { $ok = false; }
              }
          }
          exit($ok ? 0 : 1);
          EOPHP

          echo "=== Rendu réel des pages (kernel Laravel, sans passer par Apache) ==="
          if ( cd "$LROOT" && php .govibepay-verify.php ); then
            VERIF=0
          else
            VERIF=1
          fi
          rm -f "$LROOT/.govibepay-verify.php"

          if [ "$VERIF" = "0" ]; then
            echo ""; echo "✅ L'application répond depuis son nouvel emplacement. Fusion conservée."
            exit 0
          fi

          echo ""
          echo "🔴 La page d'accueil ne répond pas — ANNULATION AUTOMATIQUE de la fusion."
          # remettre le script à son emplacement d'origine
          if [ -n "$MOVED_FROM" ] && [ -d "$LROOT" ]; then
            rm -f "$MOVED_FROM/index.php" "$MOVED_FROM/.htaccess" 2>/dev/null || true
            rmdir "$MOVED_FROM" 2>/dev/null || true
            mv "$LROOT" "$MOVED_FROM" && echo "→ script remis : $LROOT → $MOVED_FROM"
            rm -f "$MOVED_FROM"/bootstrap/cache/*.php 2>/dev/null || true
            [ -f "$BK/.env" ] && cp -a "$BK/.env" "$MOVED_FROM/.env" && echo "→ .env restauré"
            [ -f "$MOVED_FROM/routes/web.php.bak-govibepay" ] && cp -a "$MOVED_FROM/routes/web.php.bak-govibepay" "$MOVED_FROM/routes/web.php"
          fi
          # remettre la home du domaine
          rm -f "$PUB/index.php"
          [ -n "$HOMEFILE" ] && [ -f "$HOMEFILE" ] && rm -f "$HOMEFILE"
          if   [ -f "$BK/index.php" ];  then cp -a "$BK/index.php"  "$PUB/index.php";  echo "→ home restaurée"
          elif [ -f "$BK/index.html" ]; then cp -a "$BK/index.html" "$PUB/index.html"; echo "→ home restaurée"
          fi
          [ -f "$BK/.htaccess" ] && cp -a "$BK/.htaccess" "$PUB/.htaccess"
          [ -L "$PUB/storage" ] && rm -f "$PUB/storage"
          rm -f "$MARK"
          echo "=== Annulation terminée — le site est revenu à son état d'avant ==="
          exit 1
          EOSSH

      # ------------------------------------------------------------------
      # ASSETS — supprime la dépendance externe du script à cdn.appdevs.net,
      # qui NE RÉPOND PLUS (timeout) alors que les pages d'authentification
      # y chargent leur CSS et leurs modules JS : le formulaire de connexion
      # reste donc inerte. Les fichiers sont téléchargés en local quand c'est
      # possible, sinon repointés vers appdevs.cloud (l'hôte encore vivant).
      # Sauvegarde par fichier + php -l ; annulable par rollback.
      # ------------------------------------------------------------------
      - name: Assets (retirer la dépendance au CDN mort)
        if: ${{ inputs.mode == 'assets' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          TS=$(date +%Y%m%d-%H%M%S)
          DOM="$HOME/domains/govibepay.com"
          LROOT=""
          for c in "$HOME/domains/app.govibepay.com/public_html" "$DOM/public_html/app" "$DOM/govibepay-app"; do
            [ -f "$c/artisan" ] && { LROOT="$c"; break; }
          done
          [ -n "$LROOT" ] || { echo "ERREUR: script introuvable."; exit 1; }
          # NB: on n'utilise PAS /vendor/ dans l'URL — beaucoup d'hébergeurs
          # bloquent ce chemin pour protéger le dossier Composer (constaté ici :
          # les fichiers existaient mais répondaient 404).
          # Sur disque les fichiers vivent dans public/ du script ; côté URL le
          # script sert ses assets sous /public/... (cf. asset('public/...')),
          # chemin dont on sait qu'il fonctionne — contrairement à une racine
          # /gvp-assets/ inventée, qui ne répond pas.
          DISKDIR="gvp-assets/fileholder/v1.0"
          WEBDIR="public/$DISKDIR"
          VDIR="$LROOT/public/$DISKDIR"
          BK="$DOM/assets-backup-$TS"
          mkdir -p "$VDIR/css" "$VDIR/js" "$BK"

          echo "=== Fichiers servis par le CDN mort, référencés par le script ==="
          FILES="css/fileholder-style.css js/fileholder-script.js js/fileholder-settings.js"
          OKDL=1
          for F in $FILES; do
            # appdevs.cloud (vivant) sert les mêmes chemins sous /cdn/
            if curl -fsS -m 25 -o "$VDIR/$F" "https://appdevs.cloud/cdn/fileholder/v1.0/$F" 2>/dev/null; then
              echo "  ✅ $F téléchargé ($(wc -c < "$VDIR/$F") octets)"
            else
              echo "  🔴 $F : téléchargement impossible"
              OKDL=0
            fi
          done
          echo ""

          chmod -R a+rX "$LROOT/public/gvp-assets" 2>/dev/null || true
          if [ "$OKDL" = "1" ]; then
            MODE="local"; echo "→ les assets seront servis LOCALEMENT (/$WEBDIR/...)"
          else
            MODE="cloud"; echo "→ téléchargement partiel : on repointe simplement vers appdevs.cloud"
          fi
          echo ""

          echo "=== Réécriture des références (sauvegarde par fichier) ==="
          COUNT=0
          while IFS= read -r f; do
            case "$f" in *"/resources"[A-Z]*|*".bak/"*|*"/vendor/"*|*"/node_modules/"*) continue;; esac
            rel="${f#$LROOT/}"
            mkdir -p "$BK/$(dirname "$rel")"
            cp -a "$f" "$BK/$rel"
            if [ "$MODE" = "local" ]; then
              # /vendor/... = chemin d'un passage précédent, bloqué par l'hébergeur : on le corrige aussi
              sed -i -e "s#https://cdn\.appdevs\.net/fileholder/v1\.0/#/$WEBDIR/#g" \
                     -e "s#https://appdevs\.cloud/cdn/fileholder/v1\.0/#/$WEBDIR/#g" \
                     -e "s#/vendor/fileholder/v1\.0/#/$WEBDIR/#g" "$f"
            else
              sed -i -e 's#https://cdn\.appdevs\.net/fileholder/v1\.0/#https://appdevs.cloud/cdn/fileholder/v1.0/#g' \
                     -e 's#/vendor/fileholder/v1\.0/#https://appdevs.cloud/cdn/fileholder/v1.0/#g' "$f"
            fi
            case "$f" in
              *.php) php -l "$f" >/dev/null 2>&1 || { echo "  !! $rel cassé — restauré"; cp -a "$BK/$rel" "$f"; continue; };;
            esac
            echo "  • $rel"
            COUNT=$((COUNT+1))
          done < <(grep -rIl --exclude-dir=vendor --exclude-dir=node_modules -e 'cdn\.appdevs\.net\|appdevs\.cloud\|/vendor/fileholder/' "$LROOT/resources" 2>/dev/null)
          echo "→ $COUNT fichier(s) modifié(s) ; sauvegarde : $BK"
          echo "  (marqueur pour rollback)"
          echo "assets_backup=$BK" >> "$DOM/.govibepay-assets.meta"

          ( cd "$LROOT" && php artisan view:clear >/dev/null 2>&1; php artisan config:clear >/dev/null 2>&1 ) || true
          echo ""
          # ----------------------------------------------------------------
          # Après la fusion, le docroot du domaine doit contenir TOUT ce que
          # contient public/ du script, sinon le CSS, le JS et les images ne
          # sont pas servis. Or un formulaire dont le JavaScript ne tourne pas
          # n'envoie pas ses champs cachés : c'est ce qui produit les erreurs
          # « The register type field is required » / « The credentials field
          # is required » à l'inscription, et un champ qui ne réagit pas au
          # toucher sur la page de connexion.
          # ----------------------------------------------------------------
          MARKF="$DOM/.govibepay-merge.meta"
          if [ -f "$MARKF" ]; then
            PUB=$(grep '^pub=' "$MARKF" | cut -d= -f2-)
            echo ""
            echo "=== Synchronisation public/ du script → docroot du domaine ==="
            MISSING=0
            for entry in "$LROOT/public"/* "$LROOT/public"/.[!.]*; do
              [ -e "$entry" ] || continue
              b=$(basename "$entry")
              # on ne touche jamais à ce qui appartient au domaine, ni au front controller
              case "$b" in app|my|index.php|govibepay-home.php|.htaccess|storage) continue;; esac
              if [ ! -e "$PUB/$b" ]; then
                cp -a "$entry" "$PUB/$b" && echo "  + $b (manquait — copié)"
                MISSING=$((MISSING+1))
              fi
            done
            [ "$MISSING" = "0" ] && echo "  ✅ rien ne manquait dans le docroot"

            # Le script génère ses URLs d'assets AVEC le segment « public/ »
            # (asset('public/frontend/...')) : il était conçu pour être servi
            # depuis la racine Laravel, où public/ est un vrai dossier.
            #
            # Un lien symbolique semblait suffire, mais il ne prouve rien :
            # PHP le suit toujours, Apache seulement si FollowSymLinks est
            # autorisé — ce que beaucoup d'hébergeurs refusent. Les fichiers
            # existent alors sur le disque tout en répondant 404 sur le web,
            # et le CSS comme le JavaScript ne se chargent pas. C'est
            # exactement ce qui distingue l'ancien domaine du nouveau. On
            # installe donc un VRAI dossier, qui ne dépend d'aucune option
            # de serveur.
            if [ -L "$PUB/public" ]; then
              echo "  ⚠️  public/ était un lien symbolique — remplacement par un vrai dossier"
              rm -f "$PUB/public"
            fi
            if [ ! -d "$PUB/public" ]; then
              SZ=$(du -sm "$LROOT/public" 2>/dev/null | cut -f1)
              cp -a "$LROOT/public" "$PUB/public" \
                && echo "  + dossier public/ copié (${SZ:-?} Mo) — plus aucune dépendance à FollowSymLinks" \
                || echo "  🔴 copie impossible"
            else
              echo "  ✅ public/ est déjà un vrai dossier"
            fi
            echo "  --- options du .htaccess du docroot (FollowSymLinks ?) ---"
            grep -inE '^\s*Options' "$PUB/.htaccess" 2>/dev/null | sed 's/^/     /' || echo "     (aucune directive Options)"
            chmod -R a+rX "$PUB" 2>/dev/null || true
            echo ""
            echo "=== Les assets référencés par les pages publiques existent-ils ? ==="
            cat > "$LROOT/.govibepay-assets-check.php" <<'EOPHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require_once __DIR__.'/bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Http\Kernel::class);
          $pub = $argv[1] ?? '';
          foreach (['/register', '/admin/login'] as $uri) {
              try {
                  $res = $kernel->handle(Illuminate\Http\Request::create('https://govibepay.com'.$uri, 'GET'));
                  $body = (string) $res->getContent();
                  preg_match_all('#(?:src|href)="https://govibepay\.com/([^"?]+\.(?:js|css))#', $body, $m);
                  $refs = array_unique($m[1] ?? []);
                  $miss = [];
                  foreach ($refs as $r) { if (! is_file($pub.'/'.$r)) { $miss[] = $r; } }
                  printf("  %-14s status=%d  assets=%d  manquants=%d %s\n", $uri, $res->getStatusCode(),
                      count($refs), count($miss), $miss ? '→ '.implode(' ', array_slice($miss, 0, 4)) : '');
                  if ($uri === '/register') {
                      foreach (['register_type', 'credentials'] as $f) {
                          echo '    champ « ', $f, ' » présent dans le formulaire : ',
                              (str_contains($body, $f) ? 'oui' : 'NON'), "\n";
                      }
                  }
                  // Pourquoi un champ n'accepterait-il pas le focus sur mobile ?
                  echo "    viewport=", (preg_match('#name="viewport"#i', $body) ? 'oui' : 'NON (page rendue en taille bureau)'), "\n";
                  preg_match_all('#<input[^>]*type="(?:text|email|password|tel)"[^>]*>#i', $body, $ins);
                  foreach (array_slice($ins[0], 0, 6) as $tag) {
                      $flags = [];
                      foreach (['readonly', 'disabled', 'inputmode', 'autocomplete'] as $a) {
                          if (stripos($tag, $a) !== false) { $flags[] = $a; }
                      }
                      preg_match('#name="([^"]*)"#i', $tag, $nm);
                      echo '    input name=', $nm[1] ?? '?', ' ', $flags ? '⚠️ '.implode(',', $flags) : 'aucun attribut bloquant', "\n";
                  }
                  foreach (['preloader', 'loader-wrapper', 'overlay', 'pointer-events:none', 'user-select:none'] as $w) {
                      $n = substr_count(strtolower($body), strtolower($w));
                      if ($n) { echo '    « ', $w, " » ×", $n, "\n"; }
                  }
                  preg_match_all('#<script[^>]+src="([^"]+)"#i', $body, $sc);
                  $ext = array_values(array_filter($sc[1] ?? [], fn ($u) => str_starts_with($u, 'http') && ! str_contains($u, 'govibepay.com')));
                  echo '    scripts EXTERNES (bloquants si injoignables) : ', $ext ? implode(' ', array_unique($ext)) : 'aucun', "\n";
              } catch (Throwable $e) {
                  printf("  %-14s EXCEPTION %s\n", $uri, substr($e->getMessage(), 0, 120));
              }
          }
          EOPHP
            ( cd "$LROOT" && php .govibepay-assets-check.php "$PUB" ) || echo "  (échec du rendu)"
            rm -f "$LROOT/.govibepay-assets-check.php"
          fi
          echo ""
          echo "=== Vérification : références externes restantes dans resources/ ==="
          grep -rIo --exclude-dir=vendor --exclude-dir=node_modules -e 'cdn\.appdevs\.net' "$LROOT/resources" 2>/dev/null | wc -l | sed 's/^/  cdn.appdevs.net (mort) : /'
          # Vérification SUR DISQUE : les sondes curl locales n'atteignent pas le
          # vhost et renvoient 404 sur des fichiers qui existent — s'y fier avait
          # fait repointer inutilement vers l'hôte externe.
          echo "=== Les assets locaux sont-ils en place sur le disque ? ==="
          ALLOK=1
          for F in $FILES; do
            if [ -s "$VDIR/$F" ]; then
              echo "  ✅ $VDIR/$F ($(wc -c < "$VDIR/$F") octets)"
            else
              echo "  🔴 $VDIR/$F absent ou vide"; ALLOK=0
            fi
          done
          if [ "$ALLOK" = "1" ]; then
            echo "  ✅ les assets sont servis correctement — la page de connexion a ce qu'il lui faut"
          else
            echo "  🔴 les assets ne sont pas servis : on REVIENT aux URLs externes (appdevs.cloud, vivant)"
            while IFS= read -r f; do
              case "$f" in *"/vendor/"*|*"/node_modules/"*) continue;; esac
              sed -i "s#/$WEBDIR/#https://appdevs.cloud/cdn/fileholder/v1.0/#g" "$f"
            done < <(grep -rIl --exclude-dir=vendor --exclude-dir=node_modules -e "/$WEBDIR/" "$LROOT/resources" 2>/dev/null)
            ( cd "$LROOT" && php artisan view:clear >/dev/null 2>&1 ) || true
            echo "  → références repointées vers appdevs.cloud (hôte joignable)"
          fi
          EOSSH

      # ------------------------------------------------------------------
      # SESSION — corrige le 419 « Page Expired » sur les pages de connexion.
      #
      # Symptôme : /admin/login renvoie 419 dans le navigateur alors que le
      # rendu par le kernel (sans cookie) renvoie 200. Le journal contient des
      # milliers de DecryptException « The payload is invalid » : les cookies
      # de session détenus par les navigateurs ne sont plus déchiffrables, donc
      # la session est jetée et le jeton CSRF ne correspond jamais.
      #
      # Plutôt que de demander à chaque utilisateur de vider ses cookies, on
      # CHANGE LE NOM du cookie de session : les anciens deviennent sans objet
      # et chacun repart sur une session propre au premier chargement.
      # ------------------------------------------------------------------
      - name: Session (corriger le 419 « Page Expired »)
        if: ${{ inputs.mode == 'session' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          TS=$(date +%Y%m%d-%H%M%S)
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          LROOT=""
          [ -f "$MARK" ] && LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          if [ -z "$LROOT" ] || [ ! -f "$LROOT/artisan" ]; then
            for c in "$DOM/govibepay-app" "$HOME/domains/app.govibepay.com/public_html" "$DOM/public_html/app"; do
              [ -f "$c/artisan" ] && { LROOT="$c"; break; }
            done
          fi
          [ -n "$LROOT" ] || { echo "ERREUR: script introuvable."; exit 1; }
          echo "Script : $LROOT"
          ENVF="$LROOT/.env"
          [ -f "$ENVF" ] || { echo "ERREUR: .env introuvable."; exit 1; }
          cp -a "$ENVF" "$ENVF.bak-session-$TS"
          echo "→ .env sauvegardé : .env.bak-session-$TS"
          echo ""

          echo "=== Réglages de session AVANT ==="
          grep -E '^(APP_URL|SESSION_DRIVER|SESSION_LIFETIME|SESSION_DOMAIN|SESSION_COOKIE|SESSION_SECURE_COOKIE|SESSION_SAME_SITE)=' "$ENVF" || echo "(aucun réglage explicite)"
          echo ""

          # 1) Nouveau nom de cookie → les anciens cookies illisibles sont ignorés
          NEWCOOKIE="govibepay_session_$(date +%s)"
          if grep -q '^SESSION_COOKIE=' "$ENVF"; then
            sed -i "s#^SESSION_COOKIE=.*#SESSION_COOKIE=$NEWCOOKIE#" "$ENVF"
          else
            printf '\nSESSION_COOKIE=%s\n' "$NEWCOOKIE" >> "$ENVF"
          fi
          echo "→ nom du cookie de session renouvelé"

          # 2) Le domaine a changé (app.govibepay.com → govibepay.com) : un
          #    SESSION_DOMAIN figé sur l'ancien hôte empêcherait l'envoi du cookie.
          if grep -qE '^SESSION_DOMAIN=.*app\.govibepay\.com' "$ENVF"; then
            sed -i 's#^SESSION_DOMAIN=.*#SESSION_DOMAIN=.govibepay.com#' "$ENVF"
            echo "→ SESSION_DOMAIN recalé sur .govibepay.com (il pointait sur l'ancien sous-domaine)"
          else
            echo "→ SESSION_DOMAIN : rien à corriger"
          fi

          # 3) Purger les sessions serveur devenues inutilisables
          if [ -d "$LROOT/storage/framework/sessions" ]; then
            N=$(find "$LROOT/storage/framework/sessions" -type f ! -name '.gitignore' 2>/dev/null | wc -l)
            find "$LROOT/storage/framework/sessions" -type f ! -name '.gitignore' -delete 2>/dev/null || true
            echo "→ $N fichier(s) de session purgé(s)"
          fi

          ( cd "$LROOT" && php artisan config:clear >/dev/null 2>&1; php artisan cache:clear >/dev/null 2>&1; php artisan view:clear >/dev/null 2>&1 ) || true
          echo ""
          echo "=== Réglages de session APRÈS ==="
          grep -E '^(APP_URL|SESSION_DRIVER|SESSION_DOMAIN|SESSION_COOKIE|SESSION_SECURE_COOKIE|SESSION_SAME_SITE)=' "$ENVF"
          echo ""

          # 4) Vérification : la page de connexion doit poser un cookie ET un jeton
          cat > "$LROOT/.govibepay-session-check.php" <<'EOPHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require_once __DIR__.'/bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Http\Kernel::class);
          $req = Illuminate\Http\Request::create('https://govibepay.com/admin/login', 'GET');
          $res = $kernel->handle($req);
          $body = (string) $res->getContent();
          echo '  status=', $res->getStatusCode(), "\n";
          echo '  jeton CSRF=', (str_contains($body, 'csrf-token') || str_contains($body, '_token')) ? 'oui' : 'non', "\n";
          $names = [];
          foreach ($res->headers->getCookies() as $c) { $names[] = $c->getName(); }
          echo '  cookies posés=', $names ? implode(', ', $names) : '(aucun)', "\n";
          EOPHP
          echo "=== Rendu de /admin/login après correction ==="
          ( cd "$LROOT" && php .govibepay-session-check.php ) || echo "  (échec du rendu)"
          rm -f "$LROOT/.govibepay-session-check.php"
          echo ""
          echo "→ Le cookie ayant changé de nom, les anciens cookies illisibles sont ignorés."
          echo "  Rechargez la page : plus besoin de vider les cookies à la main."
          EOSSH

      # ------------------------------------------------------------------
      # RESTORE-LOGIN — remet les vues d'authentification d'ORIGINE du script.
      #
      # La page de connexion actuelle n'est pas celle du script : ses classes
      # sont gvpa-* (GoVibePay Admin), donc quelqu'un l'a réécrite. Côté serveur
      # tout est correct — page en 200, jeton CSRF, viewport, CSS livré, aucun
      # champ bloqué, aucun calque — et pourtant les champs ne prennent pas le
      # focus sur mobile. Le dossier resourcesBBBB, laissé sur le serveur,
      # contient les vues d'origine : on y revient.
      #
      # Les versions personnalisées sont conservées pour pouvoir les reprendre.
      # ------------------------------------------------------------------
      - name: Restore login (revenir aux vues d'origine du script)
        if: ${{ inputs.mode == 'restore-login' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          TS=$(date +%Y%m%d-%H%M%S)
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          LROOT=""
          [ -f "$MARK" ] && LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          if [ -z "$LROOT" ] || [ ! -f "$LROOT/artisan" ]; then
            for c in "$DOM/govibepay-app" "$HOME/domains/app.govibepay.com/public_html"; do
              [ -f "$c/artisan" ] && { LROOT="$c"; break; }
            done
          fi
          [ -n "$LROOT" ] || { echo "ERREUR: script introuvable."; exit 1; }
          ORIG="$LROOT/resourcesBBBB"
          [ -d "$ORIG/views" ] || { echo "ERREUR: $ORIG/views introuvable — pas de vues d'origine à restaurer."; exit 1; }
          BK="$DOM/login-perso-backup-$TS"
          mkdir -p "$BK"
          echo "Script  : $LROOT"
          echo "Origine : $ORIG"
          echo ""

          # Les vues réécrites se reconnaissent à leurs classes gvpa-*.
          echo "=== Vues personnalisées (classes gvpa-*) et leur équivalent d'origine ==="
          COUNT=0
          while IFS= read -r f; do
            rel="${f#$LROOT/resources/}"
            src="$ORIG/$rel"
            if [ ! -f "$src" ]; then
              echo "  ⚠️  $rel — aucune version d'origine, laissée telle quelle"
              continue
            fi
            mkdir -p "$BK/$(dirname "$rel")"
            cp -a "$f" "$BK/$rel"
            cp -a "$src" "$f"
            if ! php -l "$f" >/dev/null 2>&1; then
              echo "  !! $rel — version d'origine invalide, on remet la personnalisée"
              cp -a "$BK/$rel" "$f"
              continue
            fi
            echo "  ↩️  $rel restaurée (perso sauvegardée)"
            COUNT=$((COUNT+1))
          done < <(grep -rIl --exclude-dir=node_modules --exclude-dir=vendor -e 'gvpa-' "$LROOT/resources/views" 2>/dev/null)
          echo "→ $COUNT vue(s) restaurée(s) ; versions personnalisées dans : $BK"
          [ "$COUNT" = "0" ] && { echo "Rien à restaurer — on s'arrête ici."; exit 0; }

          ( cd "$LROOT" && php artisan view:clear >/dev/null 2>&1; php artisan config:clear >/dev/null 2>&1 ) || true
          echo ""

          # Vérification par rendu réel, avec retour arrière si la page ne répond plus.
          cat > "$LROOT/.govibepay-login-verify.php" <<'EOPHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require_once __DIR__.'/bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Http\Kernel::class);
          $ok = true;
          foreach (['/admin/login', '/register'] as $uri) {
              try {
                  $res = $kernel->handle(Illuminate\Http\Request::create('https://govibepay.com'.$uri, 'GET'));
                  $body = (string) $res->getContent();
                  $code = $res->getStatusCode();
                  printf("  %-14s status=%d taille=%d csrf=%s form=%s gvpa=%s\n", $uri, $code, strlen($body),
                      (str_contains($body, '_token') ? 'oui' : 'non'),
                      (str_contains($body, '<form') ? 'oui' : 'NON'),
                      (str_contains($body, 'gvpa-') ? 'encore' : 'parti'));
                  if ($uri === '/admin/login' && ($code >= 500 || ! str_contains($body, '<form'))) { $ok = false; }
              } catch (Throwable $e) {
                  printf("  %-14s EXCEPTION %s\n", $uri, substr($e->getMessage(), 0, 120));
                  if ($uri === '/admin/login') { $ok = false; }
              }
          }
          exit($ok ? 0 : 1);
          EOPHP
          echo "=== Rendu après restauration ==="
          if ( cd "$LROOT" && php .govibepay-login-verify.php ); then
            rm -f "$LROOT/.govibepay-login-verify.php"
            echo ""
            echo "✅ Page de connexion d'origine en place."
            echo "   Les versions personnalisées sont conservées dans $BK"
            echo "   pour être reprises proprement ensuite."
          else
            rm -f "$LROOT/.govibepay-login-verify.php"
            echo ""
            echo "🔴 La page ne répond plus — RETOUR AUX VERSIONS PERSONNALISÉES."
            cp -a "$BK/." "$LROOT/resources/"
            ( cd "$LROOT" && php artisan view:clear >/dev/null 2>&1 ) || true
            echo "→ versions personnalisées remises en place."
            exit 1
          fi
          EOSSH

      # ------------------------------------------------------------------
      # LOGIN-PERSO — remet les vues d'authentification PERSONNALISÉES,
      # celles que restore-login avait mises de côté. Permet de basculer
      # entre les deux versions autant de fois qu'il le faut pour comparer.
      # ------------------------------------------------------------------
      - name: Login perso (remettre les vues personnalisées)
        if: ${{ inputs.mode == 'login-perso' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          TS=$(date +%Y%m%d-%H%M%S)
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          LROOT=""
          [ -f "$MARK" ] && LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          if [ -z "$LROOT" ] || [ ! -f "$LROOT/artisan" ]; then
            for c in "$DOM/govibepay-app" "$HOME/domains/app.govibepay.com/public_html"; do
              [ -f "$c/artisan" ] && { LROOT="$c"; break; }
            done
          fi
          [ -n "$LROOT" ] || { echo "ERREUR: script introuvable."; exit 1; }

          BK=$(ls -dt "$DOM"/login-perso-backup-* 2>/dev/null | head -1)
          [ -n "$BK" ] && [ -d "$BK" ] || { echo "ERREUR: aucune sauvegarde de vues personnalisées."; exit 1; }
          echo "Script : $LROOT"
          echo "Source : $BK"
          echo ""

          # On sauvegarde d'abord ce qui est en place (les vues d'origine),
          # pour pouvoir refaire l'aller-retour sans rien perdre.
          ORIGBK="$DOM/login-origine-backup-$TS"
          echo "=== Vues remises en place ==="
          COUNT=0
          while IFS= read -r src; do
            rel="${src#$BK/}"
            dst="$LROOT/resources/$rel"
            [ -f "$dst" ] || { echo "  ⚠️  $rel — pas de fichier cible, ignoré"; continue; }
            mkdir -p "$ORIGBK/$(dirname "$rel")"
            cp -a "$dst" "$ORIGBK/$rel"
            cp -a "$src" "$dst"
            if ! php -l "$dst" >/dev/null 2>&1; then
              echo "  !! $rel invalide — on remet la version d'origine"
              cp -a "$ORIGBK/$rel" "$dst"; continue
            fi
            echo "  ↪️  $rel"
            COUNT=$((COUNT+1))
          done < <(find "$BK" -type f -name '*.blade.php')
          echo "→ $COUNT vue(s) personnalisée(s) remise(s) ; versions d'origine dans : $ORIGBK"

          ( cd "$LROOT" && php artisan view:clear >/dev/null 2>&1; php artisan config:clear >/dev/null 2>&1 ) || true
          echo ""
          cat > "$LROOT/.govibepay-login-verify.php" <<'EOPHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require_once __DIR__.'/bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Http\Kernel::class);
          $res = $kernel->handle(Illuminate\Http\Request::create('https://govibepay.com/admin/login', 'GET'));
          $body = (string) $res->getContent();
          printf("  /admin/login status=%d taille=%d csrf=%s form=%s gvpa=%s\n",
              $res->getStatusCode(), strlen($body),
              str_contains($body, '_token') ? 'oui' : 'non',
              str_contains($body, '<form') ? 'oui' : 'NON',
              str_contains($body, 'gvpa-') ? 'oui' : 'non');
          EOPHP
          echo "=== Rendu après bascule ==="
          ( cd "$LROOT" && php .govibepay-login-verify.php ) || echo "  (échec du rendu)"
          rm -f "$LROOT/.govibepay-login-verify.php"
          echo ""
          echo "→ Pour revenir aux vues d'origine : relancer le mode restore-login."
          EOSSH

      # ------------------------------------------------------------------
      # LOGIN-DIFF — répond par des empreintes, pas par une affirmation :
      # les vues d'authentification en place sont-elles identiques à celles
      # d'avant nos interventions, ou ont-elles été modifiées en chemin ?
      # Lecture seule.
      # ------------------------------------------------------------------
      - name: Login diff (les vues ont-elles été modifiées ?)
        if: ${{ inputs.mode == 'login-diff' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          LROOT=""
          [ -f "$MARK" ] && LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          if [ -z "$LROOT" ] || [ ! -f "$LROOT/artisan" ]; then
            for c in "$DOM/govibepay-app" "$HOME/domains/app.govibepay.com/public_html"; do
              [ -f "$c/artisan" ] && { LROOT="$c"; break; }
            done
          fi
          [ -n "$LROOT" ] || { echo "ERREUR: script introuvable."; exit 1; }

          REL=""
          for cand in $(find "$LROOT/resources/views" -path '*/auth/login.blade.php' 2>/dev/null); do
            grep -q 'gvpa-' "$cand" && REL="${cand#$LROOT/resources/}" && break
          done
          [ -n "$REL" ] || REL=$(find "$LROOT/resources/views" -path '*/auth/login.blade.php' 2>/dev/null | head -1 | sed "s#$LROOT/resources/##")
          [ -n "$REL" ] || { echo "ERREUR: page de connexion introuvable."; exit 1; }
          CUR="$LROOT/resources/$REL"
          echo "Fichier examiné : resources/$REL"
          echo "  en place    : $(md5sum "$CUR" | cut -c1-32)  $(wc -c < "$CUR") octets"
          echo ""

          echo "=== Comparaison avec chaque sauvegarde, de la plus ancienne à la plus récente ==="
          FOUND=0
          for BK in $(ls -dtr "$DOM"/brand-backup-* "$DOM"/assets-backup-* "$DOM"/login-perso-backup-* "$DOM"/login-origine-backup-* 2>/dev/null); do
            SRC="$BK/$REL"
            [ -f "$SRC" ] || continue
            FOUND=1
            if cmp -s "$CUR" "$SRC"; then
              echo "  ✅ IDENTIQUE à $(basename "$BK")"
            else
              echo "  ✏️  DIFFÈRE de $(basename "$BK") ($(wc -c < "$SRC") octets)"
              echo "     lignes qui changent :"
              diff "$SRC" "$CUR" 2>/dev/null | head -12 | sed 's/^/       /'
            fi
          done
          [ "$FOUND" = "0" ] && echo "  (aucune sauvegarde ne contient ce fichier — il n'a jamais été touché par nos modes)"
          echo ""
          echo "=== Le fichier a-t-il été modifié depuis son installation d'origine ? ==="
          ORIG="$LROOT/resourcesBBBB/$REL"
          if [ -f "$ORIG" ]; then
            cmp -s "$CUR" "$ORIG" \
              && echo "  la version en place est celle d'origine du script" \
              || echo "  la version en place est la version personnalisée (elle diffère de l'origine, c'est attendu)"
          else
            echo "  (pas de version d'origine pour ce fichier)"
          fi
          echo ""
          echo "=== Dates de modification des vues d'authentification ==="
          # `head` ferme le tube et fait échouer le pipeline sous pipefail (SIGPIPE,
          # code 141) : on neutralise, l'étape ne doit pas échouer pour si peu.
          find "$LROOT/resources/views" -path '*/auth/*' -name '*.blade.php' -printf '  %TY-%Tm-%Td %TH:%TM  %s octets  %P\n' 2>/dev/null | sort | head -12 || true
          EOSSH

      # ------------------------------------------------------------------
      # GATEWAYS — inventaire des passerelles de paiement du script.
      #
      # LECTURE SEULE : aucune route, aucune URL, aucun fichier n'est modifié.
      # Avant d'ajouter quoi que ce soit (CoinPayments pour les dépôts USDT/USDC,
      # retraits automatiques PayPal, crypto, MonCash), il faut savoir ce que le
      # script sait déjà faire — QRPay embarque un système de passerelles, et
      # plusieurs de ces intégrations existent probablement déjà, en attente de
      # leurs seules clés d'API.
      # ------------------------------------------------------------------
      - name: Gateways (inventaire, lecture seule)
        if: ${{ inputs.mode == 'gateways' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          LROOT=""
          [ -f "$MARK" ] && LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          if [ -z "$LROOT" ] || [ ! -f "$LROOT/artisan" ]; then
            for c in "$DOM/govibepay-app" "$HOME/domains/app.govibepay.com/public_html"; do
              [ -f "$c/artisan" ] && { LROOT="$c"; break; }
            done
          fi
          [ -n "$LROOT" ] || { echo "ERREUR: script introuvable."; exit 1; }
          echo "Script : $LROOT"
          echo ""

          echo "=== Pilotes de passerelle présents dans le code ==="
          for g in Coinpayments CoinPayments Paypal PayPal Moncash MonCash Flutterwave Stripe Razorpay Perfectmoney Tatum Binance; do
            HITS=$(find "$LROOT/app" -iname "*${g}*" -type f 2>/dev/null | head -4)
            [ -n "$HITS" ] && { echo "  ✅ $g :"; echo "$HITS" | sed "s#$LROOT/#     #"; }
          done
          echo ""
          echo "--- répertoires dédiés aux passerelles ---"
          find "$LROOT/app" -type d \( -iname '*gateway*' -o -iname '*payment*' \) 2>/dev/null | sed "s#$LROOT/#  #" | head -12
          echo ""

          echo "=== Ce que la BASE déclare (aucune écriture) ==="
          cat > "$LROOT/.govibepay-gw.php" <<'EOPHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require_once __DIR__.'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          use Illuminate\Support\Facades\DB;
          use Illuminate\Support\Facades\Schema;

          foreach (['payment_gateways', 'payment_gateway_currencies'] as $t) {
              if (! Schema::hasTable($t)) { echo "  (table $t absente)\n"; continue; }
              echo "  --- $t ---\n";
              foreach (DB::table($t)->get() as $r) {
                  $a = (array) $r;
                  $name  = $a['name'] ?? $a['title'] ?? $a['alias'] ?? '?';
                  $alias = $a['alias'] ?? '';
                  $type  = isset($a['type']) ? (is_numeric($a['type']) ? ($a['type'] == 1 ? 'AUTOMATIQUE' : 'manuel') : $a['type']) : '?';
                  $on    = isset($a['status']) ? ($a['status'] ? 'activé' : 'désactivé') : '?';
                  $cur   = $a['currency_code'] ?? $a['currency'] ?? '';
                  printf("    %-26s %-12s %-11s %s\n", substr((string) $name, 0, 26).($alias ? " ($alias)" : ''), $type, $on, $cur);
              }
          }
          echo "\n  --- une passerelle a-t-elle déjà des identifiants renseignés ? ---\n";
          if (Schema::hasTable('payment_gateway_currencies')) {
              foreach (DB::table('payment_gateway_currencies')->get() as $r) {
                  $a = (array) $r;
                  $cred = $a['gateway_parameter'] ?? $a['credentials'] ?? null;
                  if ($cred) {
                      $d = json_decode((string) $cred, true);
                      $keys = is_array($d) ? implode(', ', array_keys($d)) : '(format non JSON)';
                      $filled = 0; $total = 0;
                      if (is_array($d)) {
                          foreach ($d as $v) { $total++; if (is_array($v) ? ! empty($v['value']) : ! empty($v)) { $filled++; } }
                      }
                      printf("    %-22s champs: %-58s renseignés %d/%d\n",
                          substr((string) ($a['name'] ?? $a['alias'] ?? '?'), 0, 22), substr($keys, 0, 58), $filled, $total);
                  }
              }
          }
          EOPHP
          ( cd "$LROOT" && php .govibepay-gw.php 2>&1 | head -60 ) || echo "  (lecture base impossible)"
          rm -f "$LROOT/.govibepay-gw.php"
          echo ""

          echo "=== Routes de dépôt et de retrait (INCHANGÉES — simple relevé) ==="
          cat > "$LROOT/.govibepay-rt.php" <<'EOPHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require_once __DIR__.'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $out = [];
          foreach (app('router')->getRoutes() as $r) {
              $u = $r->uri();
              if (preg_match('#add-money|money-out|withdraw|deposit|crypto#i', $u)) {
                  $out[] = sprintf('    %-9s /%-46s [%s]', implode('|', $r->methods()), $u, $r->getName() ?: '-');
              }
          }
          echo '  ', count($out), " routes concernées\n";
          foreach (array_slice($out, 0, 30) as $l) { echo $l, "\n"; }
          EOPHP
          ( cd "$LROOT" && php .govibepay-rt.php 2>&1 | head -40 ) || echo "  (lecture routes impossible)"
          rm -f "$LROOT/.govibepay-rt.php"
          echo ""
          echo "NOTE : rien n'a été modifié. Cet inventaire sert à décider quoi ajouter"
          echo "       et quelles clés d'API seront nécessaires."
          EOSSH

      # ------------------------------------------------------------------
      # USER-DASH — relever le tableau de bord utilisateur AVANT d'y toucher.
      #
      # Objectif : connaître les noms de routes exacts, les variables que le
      # contrôleur passe à la vue, et le balisage actuel. Sans ça, refaire
      # l'interface casserait forcément quelque chose. Lecture seule.
      # ------------------------------------------------------------------
      - name: User dash (relevé du tableau de bord, lecture seule)
        if: ${{ inputs.mode == 'user-dash' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          LROOT=""
          [ -f "$MARK" ] && LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          if [ -z "$LROOT" ] || [ ! -f "$LROOT/artisan" ]; then
            for c in "$DOM/govibepay-app" "$HOME/domains/app.govibepay.com/public_html"; do
              [ -f "$c/artisan" ] && { LROOT="$c"; break; }
            done
          fi
          [ -n "$LROOT" ] || { echo "ERREUR: script introuvable."; exit 1; }
          echo "Script : $LROOT"
          echo ""

          echo "=== ROUTES UTILISATEUR CONCERNÉES (ne jamais les modifier) ==="
          cat > "$LROOT/.gvp-ud.php" <<'EOPHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require_once __DIR__.'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $groups = [
              'TABLEAU DE BORD' => '#^user/?(home|dashboard)?$#i',
              'CARTE VIRTUELLE' => '#card#i',
              'RECHARGE MOBILE' => '#(mobile|topup|recharge|airtime)#i',
              'PAYLINK'         => '#(paylink|payment-link|pay-link)#i',
          ];
          foreach ($groups as $title => $re) {
              echo "  --- $title ---\n";
              $n = 0;
              foreach (app('router')->getRoutes() as $r) {
                  $u = $r->uri();
                  $name = $r->getName() ?: '-';
                  if (strpos($u, 'user') !== 0 && strpos($name, 'user.') !== 0) { continue; }
                  if (! preg_match($re, $u) && ! preg_match($re, $name)) { continue; }
                  $m = implode('|', array_diff($r->methods(), ['HEAD']));
                  printf("    %-9s /%-42s %s\n", $m, $u, $name);
                  if (++$n >= 26) { break; }
              }
              if ($n === 0) { echo "    (aucune)\n"; }
          }
          EOPHP
          ( cd "$LROOT" && php .gvp-ud.php 2>&1 | head -70 ) || echo "  (lecture routes impossible)"
          rm -f "$LROOT/.gvp-ud.php"
          echo ""

          echo "=== VUE DU TABLEAU DE BORD ==="
          DASH=$(find "$LROOT/resources/views" -path '*user*' \( -name 'dashboard.blade.php' -o -name 'home.blade.php' \) 2>/dev/null | head -3)
          if [ -z "$DASH" ]; then
            echo "  introuvable — vues 'user' présentes :"
            find "$LROOT/resources/views" -path '*user*' -name '*.blade.php' 2>/dev/null | sed "s#$LROOT/#  #" | head -20
          else
            for D in $DASH; do
              echo "  ${D#$LROOT/} ($(stat -c%s "$D") octets, $(wc -l < "$D") lignes)"
            done
          fi
          echo ""
          echo "  --- squelette Blade (extends / sections / stacks) ---"
          for D in $DASH; do
            grep -nE '@(extends|section|endsection|push|endpush|stack|include|yield)' "$D" \
              | cut -c1-130 | sed 's/^/    /' | head -40
            echo ""
            echo "    --- variables citées ---"
            grep -ohE '\$[a-zA-Z_][a-zA-Z0-9_]*' "$D" | sort -u | tr '\n' ' ' | fold -w 110 -s | sed 's/^/      /'
            echo ""
            echo "    --- routes citées (guillemets simples ET doubles) ---"
            grep -ohE "route\(['\"][^'\"]+['\"]" "$D" | sed -E "s/route\(['\"]//" | sort -u | sed 's/^/      /' | head -40
            echo ""
            echo "    --- 90 premières lignes ---"
            head -40 "$D" | cat -n | cut -c1-140 | sed 's/^/    /'
          done
          echo ""

          echo "=== CONTRÔLEUR DU TABLEAU DE BORD (intégral) ==="
          CTRL="$LROOT/app/Http/Controllers/User/DashboardController.php"
          if [ -f "$CTRL" ]; then
            echo "  ${CTRL#$LROOT/} ($(wc -l < "$CTRL") lignes)"
            awk '/function index\(/{f=1} f{print}  f&&/return view\(/{print; exit}' "$CTRL" | tail -4 | cut -c1-170 | sed 's/^/  /'
          else
            echo "  introuvable"
          fi
          echo ""

          echo "=== HELPER userActiveCardData() : QUE RETOURNE-T-IL ? ==="
          HF=$(grep -rl 'function userActiveCardData' "$LROOT/app" 2>/dev/null | head -1)
          if [ -n "$HF" ]; then
            echo "  ${HF#$LROOT/}"
            awk '/function userActiveCardData/{f=1} f{print "    "$0; if(/^}/) exit}' "$HF" | cut -c1-150 | head -40
          else
            echo "  introuvable"
          fi
          echo ""

          echo "=== QUEL FOURNISSEUR DE CARTE EST ACTIF ? ==="
          grep -rhoE "'(stripe|sudo|strowallet|cardyfie|flutterwave)'" "$LROOT/app/Constants" 2>/dev/null | sort | uniq -c | sed 's/^/  /' | head -10
          echo "  --- routes d'index par fournisseur réellement définies ---"
          grep -rhoE "name\(['\"]user\.[a-z]*\.?virtual\.card\.(index|create\.page|fund\.page)['\"]" "$LROOT/routes" 2>/dev/null \
            | sed -E "s/name\(['\"]//; s/['\"]$//" | sort -u | sed 's/^/    /' | head -20
          echo ""

          echo "=== GABARIT MAÎTRE : POINTS D'INSERTION ==="
          MST="$LROOT/resources/views/user/layouts/master.blade.php"
          if [ -f "$MST" ]; then
            echo "  ${MST#$LROOT/} ($(wc -l < "$MST") lignes)"
            grep -nE '@(yield|stack|include|section)' "$MST" | cut -c1-130 | sed 's/^/    /' | head -30
          else
            echo "  introuvable"
          fi

          echo "=== FICHIERS DE VUE LIÉS AUX SERVICES À CONSERVER ==="
          for K in card topup paylink; do
            echo "  --- $K ---"
            find "$LROOT/resources/views" -path '*user*' -iname "*${K}*" 2>/dev/null \
              | sed "s#$LROOT/#    #" | head -8 || echo "    (aucun)"
          done
          echo ""
          echo "NOTE : rien n'a été modifié. Ce relevé sert à refaire l'interface"
          echo "       sans toucher aux routes ni aux URL."
          EOSSH

      # ------------------------------------------------------------------
      # THEME-SCAN — inventaire complet pour un thème qui couvre TOUTES les
      # pages. Le premier relevé ne donnait que les 40 classes les plus
      # fréquentes ; il manquait donc les classes propres à chaque écran
      # (taux de change, frais, soldes), d'où un thème incomplet.
      # Lecture seule.
      # ------------------------------------------------------------------
      - name: Theme scan (inventaire complet, lecture seule)
        if: ${{ inputs.mode == 'theme-scan' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          LROOT=""
          [ -f "$MARK" ] && LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          if [ -z "$LROOT" ] || [ ! -f "$LROOT/artisan" ]; then
            for c in "$DOM/govibepay-app" "$HOME/domains/app.govibepay.com/public_html"; do
              [ -f "$c/artisan" ] && { LROOT="$c"; break; }
            done
          fi
          [ -n "$LROOT" ] || { echo "ERREUR: script introuvable."; exit 1; }
          V="$LROOT/resources/views/user"
          CSSF="$DOM/public_html/public/backend/css/style.css"
          echo "Script : $LROOT"
          echo ""

          echo "=== 1. CLASSES DE LA PAGE « ADD MONEY » ==="
          find "$V" -path '*add-money*' -name '*.blade.php' 2>/dev/null | head -4 | while read -r f; do
            echo "  ▸ ${f#$LROOT/}"
            grep -ohE 'class="[^"]+"' "$f" | sed 's/class="//; s/"$//' | tr ' ' '\n' \
              | grep -E '^[a-z][a-z0-9_-]{3,}$' | sort -u | tr '\n' ' ' \
              | fold -w 108 -s | sed 's/^/      /'
            echo ""
          done
          echo ""

          echo "=== 2. INVENTAIRE COMPLET DES CLASSES (100 premières) ==="
          grep -rhoE 'class="[^"]+"' "$V" 2>/dev/null \
            | sed 's/class="//; s/"$//' | tr ' ' '\n' \
            | grep -E '^[a-z][a-z0-9_-]{2,}$' \
            | grep -vE '^(col|row|mt|mb|ms|me|mx|my|pt|pb|ps|pe|px|py|text|w|h|fa|las|la|far|fas|d)-' \
            | sort | uniq -c | sort -rn | head -100 \
            | awk '{printf "  %-4s %s\n", $1, $2}'
          echo ""

          echo "=== 3. D'OÙ VIENNENT LE ROSE ET LA LAVANDE ==="
          if [ -f "$CSSF" ]; then
            echo "  --- règles contenant une teinte rose/magenta ---"
            grep -nB6 -iE '#(e83e8c|ff69b4|d63384|e91e63|f06|ec4899)' "$CSSF" 2>/dev/null \
              | grep -E '^\s*[0-9]+[-:][.#a-zA-Z]' | cut -c1-120 | sed 's/^/    /' | head -12
            echo "  --- règles contenant une teinte lavande/bleu clair ---"
            grep -nB6 -iE '#(dbe4f0|e7ecf5|dee2e6|e9ecef|eef2f7|dae1ec)' "$CSSF" 2>/dev/null \
              | grep -E '^\s*[0-9]+[-:][.#a-zA-Z]' | cut -c1-120 | sed 's/^/    /' | head -12
          fi
          echo ""
          echo "  --- ces teintes dans les vues (styles en ligne) ---"
          grep -rhoE 'style="[^"]*(color|background)[^"]*"' "$V" 2>/dev/null \
            | grep -iE '#[0-9a-f]{6}' | sort -u | cut -c1-120 | sed 's/^/    /' | head -14
          echo ""

          echo "=== 4. POLICES DÉCLARÉES ==="
          if [ -f "$CSSF" ]; then
            grep -nE 'font-family' "$CSSF" | cut -c1-135 | sed 's/^/    /' | head -16
          fi
          echo "  --- monospace dans les vues ---"
          grep -rlniE 'monospace|courier|font-mono' "$V" 2>/dev/null | sed "s#$LROOT/#    #" | head -8
          echo ""

          echo "=== 5. CLASSES DE MONTANT / TAUX / FRAIS ==="
          grep -rhoE 'class="[^"]*(exchange|rate|charge|fee|amount|balance|limit)[^"]*"' "$V" 2>/dev/null \
            | sed 's/class="//; s/"$//' | tr ' ' '\n' \
            | grep -iE 'exchange|rate|charge|fee|amount|balance|limit' \
            | sort | uniq -c | sort -rn | head -26 | awk '{printf "  %-4s %s\n", $1, $2}'
          echo ""
          echo "NOTE : rien n'a été modifié."
          EOSSH

      # ------------------------------------------------------------------
      # COINPAY-SCAN — lire l'implémentation CoinGate comme modèle avant
      # d'écrire le pilote CoinPayments. Lecture seule.
      #
      # CoinGate est la passerelle crypto déjà intégrée : même schéma de
      # rappel succès/annulation, même place dans l'architecture. On relève
      # sa structure exacte plutôt que de deviner celle du script.
      # ------------------------------------------------------------------
      - name: Coinpay scan (modèle CoinGate, lecture seule)
        if: ${{ inputs.mode == 'coinpay-scan' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          LROOT=""
          [ -f "$MARK" ] && LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          if [ -z "$LROOT" ] || [ ! -f "$LROOT/artisan" ]; then
            for c in "$DOM/govibepay-app" "$HOME/domains/app.govibepay.com/public_html"; do
              [ -f "$c/artisan" ] && { LROOT="$c"; break; }
            done
          fi
          [ -n "$LROOT" ] || { echo "ERREUR: script introuvable."; exit 1; }
          echo "Script : $LROOT"
          echo ""

          echo "=== 1. FICHIERS DE LA PASSERELLE COINGATE ==="
          find "$LROOT/app" -iname '*coingate*' 2>/dev/null | while read -r f; do
            echo "  $(wc -l < "$f") lignes  ${f#$LROOT/}"
          done
          echo ""

          echo "=== 2. SQUELETTE DU PILOTE COINGATE (signatures) ==="
          CG=$(find "$LROOT/app" -iname '*coingate*' -name '*.php' 2>/dev/null | head -1)
          if [ -n "$CG" ]; then
            echo "  ${CG#$LROOT/}"
            grep -nE '^\s*(public|private|protected|use|namespace|class|trait)\s' "$CG" \
              | cut -c1-150 | sed 's/^/    /' | head -40
          else
            echo "  (aucun fichier CoinGate)"
          fi
          echo ""

          echo "=== 3. CRÉATION DE TRANSACTION ET VÉRIFICATION DU RAPPEL ==="
          if [ -n "$CG" ]; then
            echo "  --- méthode de création (init/charge) ---"
            awk '/function .*(Init|init|create|Charge|charge)/{f=1;n=0} f{print "    "$0; n++; if(n>45) exit}' "$CG" \
              | cut -c1-165 | head -46
            echo ""
            echo "  --- vérification / rappel (success|callback|verify|ipn) ---"
            awk '/function .*(uccess|allback|erify|pn|Response)/{f=1;n=0} f{print "    "$0; n++; if(n>40) exit}' "$CG" \
              | cut -c1-165 | head -41
          fi
          echo ""

          echo "=== 4. COMMENT LE PARAMÈTRE {gateway} EST RÉSOLU ==="
          grep -rn 'global.success\|globalSuccess\|payment.global' "$LROOT/app/Http/Controllers" 2>/dev/null \
            | cut -c1-160 | sed "s#$LROOT/#  #" | head -8
          echo ""
          echo "  --- constantes de passerelle ---"
          CONST=$(find "$LROOT/app/Constants" -iname '*PaymentGateway*' 2>/dev/null | head -1)
          if [ -n "$CONST" ]; then
            echo "  ${CONST#$LROOT/}"
            grep -nE 'const [A-Z_]+' "$CONST" | grep -iE 'coingate|crypto|alias|manual|automatic|type' \
              | cut -c1-140 | sed 's/^/    /' | head -22
          fi
          echo ""

          echo "=== 5. CE QUE LA BASE DÉCLARE POUR LES PASSERELLES CRYPTO ==="
          cat > "$LROOT/.gvp-pg.php" <<'EOPHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require_once __DIR__.'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          try {
              $rows = \Illuminate\Support\Facades\DB::table('payment_gateways')->get();
              echo "  ", $rows->count(), " passerelle(s) en base\n";
              foreach ($rows as $r) {
                  printf("    #%-3s %-18s alias=%-14s type=%-10s statut=%s\n",
                      $r->id ?? '?', substr($r->name ?? '?', 0, 18),
                      $r->alias ?? '-', $r->type ?? '-', $r->status ?? '-');
              }
          } catch (\Throwable $e) {
              echo "  (table payment_gateways illisible : ", substr($e->getMessage(), 0, 100), ")\n";
          }
          EOPHP
          ( cd "$LROOT" && php .gvp-pg.php 2>&1 | head -30 ) || echo "  (lecture impossible)"
          rm -f "$LROOT/.gvp-pg.php"
          echo ""
          echo "NOTE : rien n'a été modifié."
          EOSSH

      # ------------------------------------------------------------------
      # USER-THEME — thème de l'espace utilisateur, sur TOUTES les pages.
      #
      # Une seule balise link est ajoutée au gabarit maître, après la pile de
      # styles, pour que le thème gagne la cascade. Le CSS lui-même est un
      # fichier statique servi par Apache : il n'est jamais compilé par Blade.
      # Aucune route, aucune URL, aucun balisage modifié.
      # ------------------------------------------------------------------
      - name: User theme (thème de l'espace utilisateur)
        if: ${{ inputs.mode == 'user-theme' || inputs.mode == 'user-theme-undo' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          SSH="ssh -i $HOME/.ssh/id_deploy -p $PORT -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          if [ "${{ inputs.mode }}" = "user-theme" ]; then
            python3 govibepay/ui/validate.py --theme-only || {
              echo "Validation échouée — rien n'a été transféré."; exit 1; }
            $SSH "cat > /tmp/.gvp-theme.css" < govibepay/ui/theme.css
            echo "Thème transféré."
          fi
          $SSH "MODE='${{ inputs.mode }}' bash -s" <<'EOSSH'
          set -uo pipefail
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          LROOT=""
          [ -f "$MARK" ] && LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          if [ -z "$LROOT" ] || [ ! -f "$LROOT/artisan" ]; then
            for c in "$DOM/govibepay-app" "$HOME/domains/app.govibepay.com/public_html"; do
              [ -f "$c/artisan" ] && { LROOT="$c"; break; }
            done
          fi
          [ -n "$LROOT" ] || { echo "ERREUR: script introuvable."; exit 1; }
          MST="$LROOT/resources/views/user/layouts/master.blade.php"
          [ -f "$MST" ] || { echo "ERREUR: gabarit maître introuvable."; exit 1; }
          echo "Gabarit : ${MST#$LROOT/}"

          if [ "${MODE:-}" = "user-theme-undo" ]; then
            if [ -f "$MST.bak-theme" ]; then
              cp -f "$MST.bak-theme" "$MST"
              ( cd "$LROOT" && php artisan view:clear >/dev/null 2>&1 ) || true
              echo "↩️  Gabarit d'origine restauré, cache vidé."
            else
              echo "Aucune sauvegarde — rien à annuler."
            fi
            exit 0
          fi

          [ -s /tmp/.gvp-theme.css ] || { echo "ERREUR: thème non reçu."; exit 1; }

          CSSDIR="$DOM/public_html/public/backend/css"
          mkdir -p "$CSSDIR"
          cp -f /tmp/.gvp-theme.css "$CSSDIR/gvp-theme.css"
          chmod 644 "$CSSDIR/gvp-theme.css"
          echo "✅ thème statique déployé ($(stat -c%s "$CSSDIR/gvp-theme.css") octets)"

          if [ -f "$MST.bak-theme" ]; then
            cp -f "$MST.bak-theme" "$MST"; echo "↺ reparti de la sauvegarde"
          else
            cp -f "$MST" "$MST.bak-theme"; echo "✅ sauvegarde créée"
          fi

          cat > "$LROOT/.gvp-th.php" <<'EOPHP'
          <?php
          $mst = $argv[1];
          $src = file_get_contents($mst);
          $css = file_get_contents('/tmp/.gvp-theme.css');
          $tag = "\n    <link rel=\"stylesheet\" href=\"{{ asset('public/backend/css/gvp-theme.css') }}?v="
               . substr(md5($css), 0, 8) . "\">\n";

          // Après la pile de styles : le thème doit gagner la cascade.
          if (! preg_match('/@stack\(\s*[\'"]css[\'"]\s*\)/', $src, $m, PREG_OFFSET_CAPTURE)) {
              fwrite(STDERR, "ERREUR: pile de styles introuvable dans le gabarit.\n");
              exit(2);
          }
          $at  = $m[0][1] + strlen($m[0][0]);
          $out = substr($src, 0, $at) . $tag . substr($src, $at);
          file_put_contents($mst, $out);
          echo "  balise link insérée après la pile de styles\n";
          EOPHP
          php "$LROOT/.gvp-th.php" "$MST" || {
            echo "Injection échouée — restauration."; cp -f "$MST.bak-theme" "$MST"
            rm -f "$LROOT/.gvp-th.php"; exit 1; }
          rm -f "$LROOT/.gvp-th.php"

          echo ""
          echo "=== VÉRIFICATION ==="
          cat > "$LROOT/.gvp-thc.php" <<'EOPHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require_once __DIR__.'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $php = Illuminate\Support\Facades\Blade::compileString(file_get_contents($argv[1]));
          $tmp = sys_get_temp_dir().'/.gvp-th-compiled.php';
          file_put_contents($tmp, $php);
          echo $tmp, "\n";
          EOPHP
          C=$( cd "$LROOT" && php .gvp-thc.php "$MST" 2>&1 | tail -1 )
          rm -f "$LROOT/.gvp-thc.php"
          if [ -f "$C" ] && php -l "$C" >/dev/null 2>&1; then
            echo "  ✅ le gabarit compile et le PHP produit est valide"; rm -f "$C"
          else
            echo "  ❌ compilation invalide — restauration."
            cp -f "$MST.bak-theme" "$MST"; rm -f "$C"
            ( cd "$LROOT" && php artisan view:clear >/dev/null 2>&1 ) || true
            exit 1
          fi

          ( cd "$LROOT" && php artisan view:clear >/dev/null 2>&1 ) || true
          rm -f /tmp/.gvp-theme.css

          IP=$(curl -s --max-time 8 https://api.ipify.org 2>/dev/null | tr -d '[:space:]')
          case "$IP" in *[!0-9.]*|"") IP="";; esac
          if [ -n "$IP" ]; then
            R=$(curl -sS -k --max-time 20 --resolve govibepay.com:443:"$IP" \
                  -o /dev/null -w '%{http_code} %{content_type}' \
                  "https://govibepay.com/public/backend/css/gvp-theme.css" 2>/dev/null)
            echo "  gvp-theme.css → $R"
            case "$R" in
              2*css*) echo "  ✅ servi avec le bon type MIME" ;;
              *) echo "  ❌ non servi — restauration."
                 cp -f "$MST.bak-theme" "$MST"
                 ( cd "$LROOT" && php artisan view:clear >/dev/null 2>&1 ) || true
                 exit 1 ;;
            esac
          fi
          echo ""
          echo "Pour annuler : relancer en mode « user-theme-undo »."
          EOSSH

      # ------------------------------------------------------------------
      # PREP-SCAN — préparation, lecture seule. Trois questions ouvertes :
      #   1. quelles classes et quel CSS l'espace utilisateur emploie-t-il
      #      réellement (pour écrire un thème qui atteint sa cible) ;
      #   2. 3CX autorise-t-il l'affichage en iframe (option « appel ») ;
      #   3. MonCash est-il déjà intégré, et existe-t-il une route de rappel
      #      générique réutilisable pour l'IPN CoinPayments.
      # ------------------------------------------------------------------
      - name: Prep scan (thème, 3CX, passerelles — lecture seule)
        if: ${{ inputs.mode == 'prep-scan' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          LROOT=""
          [ -f "$MARK" ] && LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          if [ -z "$LROOT" ] || [ ! -f "$LROOT/artisan" ]; then
            for c in "$DOM/govibepay-app" "$HOME/domains/app.govibepay.com/public_html"; do
              [ -f "$c/artisan" ] && { LROOT="$c"; break; }
            done
          fi
          [ -n "$LROOT" ] || { echo "ERREUR: script introuvable."; exit 1; }
          V="$LROOT/resources/views/user"
          echo "Script : $LROOT"
          echo ""

          echo "=== 1a. FEUILLES DE STYLE CHARGÉES CÔTÉ UTILISATEUR ==="
          HA="$V/partials/header-assets.blade.php"
          [ -f "$HA" ] && grep -ohE "[A-Za-z0-9_/.-]+\.css" "$HA" | sort -u | sed 's/^/  /' | head -18
          echo ""

          echo "=== 1b. CLASSES LES PLUS UTILISÉES DANS LES VUES UTILISATEUR ==="
          grep -rhoE 'class="[^"]+"' "$V" 2>/dev/null \
            | sed 's/class="//; s/"$//' | tr ' ' '\n' \
            | grep -E '^[a-z][a-z0-9_-]*$' \
            | grep -vE '^(col|row|d|mt|mb|mx|my|pt|pb|px|py|text|w|h|fa|las|la|far|fas)$' \
            | sort | uniq -c | sort -rn | head -40 | sed 's/^/  /'
          echo ""

          echo "=== 1c. COULEUR PRIMAIRE ACTUELLE DU THÈME ==="
          CSSF="$DOM/public_html/public/backend/css/style.css"
          if [ -f "$CSSF" ]; then
            echo "  --- variables CSS déclarées ---"
            grep -ohE '\-\-[a-z-]+:[^;]+;' "$CSSF" 2>/dev/null | sort -u | head -18 | sed 's/^/    /'
            echo "  --- couleurs les plus fréquentes ---"
            grep -ohE '#[0-9a-fA-F]{6}' "$CSSF" | tr 'A-F' 'a-f' | sort | uniq -c | sort -rn | head -10 | sed 's/^/    /'
            echo "  --- règle .btn--base ---"
            awk '/^\.btn--base[ ,{]/,/^\}/' "$CSSF" | head -16 | sed 's/^/    /'
          else
            echo "  (style.css introuvable)"
          fi
          echo ""

          echo "=== 2. 3CX AUTORISE-T-IL L'IFRAME ? ==="
          H=$(curl -sS -I --max-time 15 "https://1207.3cx.cloud/supporttechnical" 2>&1 || echo "ECHEC")
          echo "$H" | grep -iE '^(HTTP/|x-frame-options|content-security-policy)' | cut -c1-190 | sed 's/^/  /'
          if echo "$H" | grep -qiE 'x-frame-options|frame-ancestors'; then
            echo "  ⚠️  une politique d'affichage est déclarée — voir ci-dessus"
          else
            echo "  ✅ aucun X-Frame-Options ni frame-ancestors : l'iframe devrait passer"
          fi
          echo ""

          echo "=== 3a. MONCASH EST-IL DÉJÀ INTÉGRÉ ? ==="
          find "$LROOT/app" -iname '*moncash*' 2>/dev/null | sed "s#$LROOT/#  #" | head -8
          echo "=== 3b. COINPAYMENTS EST-IL PRÉSENT ? ==="
          find "$LROOT/app" -iname '*coinpayment*' 2>/dev/null | sed "s#$LROOT/#  #" | head -6
          echo "  (aucune ligne ci-dessus = absent, à écrire)"
          echo ""

          echo "=== 3c. ROUTE DE RAPPEL GÉNÉRIQUE RÉUTILISABLE POUR L'IPN ? ==="
          cat > "$LROOT/.gvp-cb.php" <<'EOPHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require_once __DIR__.'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $n = 0;
          foreach (app('router')->getRoutes() as $r) {
              $u = $r->uri();
              $name = $r->getName() ?: '-';
              if (! preg_match('#(callback|ipn|webhook|notify|success|response)#i', $u . ' ' . $name)) { continue; }
              $m = implode('|', array_diff($r->methods(), ['HEAD']));
              printf("  %-9s /%-50s %s\n", $m, $u, $name);
              if (++$n >= 18) { break; }
          }
          if ($n === 0) { echo "  (aucune — une route IPN dédiée sera nécessaire)\n"; }
          EOPHP
          ( cd "$LROOT" && php .gvp-cb.php 2>&1 | head -22 ) || echo "  (lecture impossible)"
          rm -f "$LROOT/.gvp-cb.php"
          echo ""
          echo "NOTE : rien n'a été modifié."
          EOSSH

      # ------------------------------------------------------------------
      # LOGS — dernières erreurs du journal Laravel, avec pile d'appels.
      # Lecture seule. Sert à voir la cause exacte d'un 500 au lieu de la deviner.
      # ------------------------------------------------------------------
      - name: Logs (dernières erreurs Laravel)
        if: ${{ inputs.mode == 'logs' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          LROOT=""
          [ -f "$MARK" ] && LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          if [ -z "$LROOT" ] || [ ! -f "$LROOT/artisan" ]; then
            for c in "$DOM/govibepay-app" "$HOME/domains/app.govibepay.com/public_html"; do
              [ -f "$c/artisan" ] && { LROOT="$c"; break; }
            done
          fi
          [ -n "$LROOT" ] || { echo "ERREUR: script introuvable."; exit 1; }
          LOG="$LROOT/storage/logs/laravel.log"
          [ -f "$LOG" ] || { echo "Journal introuvable : ${LOG#$HOME/}"; exit 0; }
          echo "Journal : ${LOG#$HOME/} ($(du -h "$LOG" | cut -f1))"
          echo ""

          echo "=== DERNIÈRE ERREUR COMPLÈTE ==="
          # Chaque entrée commence par [date]. On isole la dernière qui porte ERROR.
          tail -c 900000 "$LOG" \
            | awk '/^\[[0-9]{4}-/{buf=""} {buf=buf $0 "\n"} /ERROR|Exception|Error:/{last=buf} END{print last}' \
            | head -34 | cut -c1-190 | sed 's/^/  /'
          echo ""

          echo "=== LES 8 DERNIÈRES LIGNES D'ERREUR (résumé) ==="
          grep -a 'ERROR' "$LOG" 2>/dev/null | tail -8 | cut -c1-215 | sed 's/^/  /'
          echo ""

          echo "=== MENTIONS DU TABLEAU DE BORD OU DU BLOC SERVICES ==="
          grep -a -iE 'dashboard|gvps|gvpCard|userActiveCardData' "$LOG" 2>/dev/null \
            | tail -6 | cut -c1-215 | sed 's/^/  /' || echo "  (aucune)"
          echo ""

          echo "=== ÉTAT DE LA VUE DU TABLEAU DE BORD ==="
          D="$LROOT/resources/views/user/dashboard.blade.php"
          if [ -f "$D" ]; then
            echo "  taille actuelle : $(stat -c%s "$D") octets"
            if grep -q 'GVPA-SERVICES' "$D"; then
              echo "  ⚠️  le bloc « Mes services » est TOUJOURS en place"
            else
              echo "  ✅ le bloc « Mes services » n'est plus présent (vue d'origine)"
            fi
            [ -f "$D.bak-ui" ] && echo "  sauvegarde : $(stat -c%s "$D.bak-ui") octets"
          fi
          echo ""
          echo "NOTE : rien n'a été modifié."
          EOSSH

      # ------------------------------------------------------------------
      # SUPPORT-SCAN — où est le bouton « Support Center » et où mène-t-il ?
      # Lecture seule. Préalable avant de le transformer en panneau intégré.
      # ------------------------------------------------------------------
      - name: Support scan (relevé du bouton support, lecture seule)
        if: ${{ inputs.mode == 'support-scan' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          LROOT=""
          [ -f "$MARK" ] && LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          if [ -z "$LROOT" ] || [ ! -f "$LROOT/artisan" ]; then
            for c in "$DOM/govibepay-app" "$HOME/domains/app.govibepay.com/public_html"; do
              [ -f "$c/artisan" ] && { LROOT="$c"; break; }
            done
          fi
          [ -n "$LROOT" ] || { echo "ERREUR: script introuvable."; exit 1; }
          V="$LROOT/resources/views"
          echo "Script : $LROOT"
          echo ""

          echo "=== OÙ APPARAÎT « SUPPORT » DANS LES VUES UTILISATEUR ? ==="
          grep -rlin 'support' "$V/user" 2>/dev/null | sed "s#$LROOT/#  #" | head -14
          echo ""
          echo "  --- lignes exactes (partials de navigation) ---"
          for F in "$V/user/partials/side-nav.blade.php" "$V/user/partials/top-nav.blade.php" "$V/user/layouts/master.blade.php"; do
            [ -f "$F" ] || continue
            HITS=$(grep -in 'support\|ticket\|chat\|live-chat\|tawk\|crisp\|whatsapp' "$F" 2>/dev/null | cut -c1-165 | head -12)
            if [ -n "$HITS" ]; then
              echo "  ▸ ${F#$LROOT/}"
              echo "$HITS" | sed 's/^/      /'
            fi
          done
          echo ""

          echo "=== LE BOUTON MÈNE-T-IL HORS DU SITE ? ==="
          grep -rhoE 'href="[^"]*(support|ticket|chat|tawk|crisp|whatsapp|wa\.me|t\.me)[^"]*"' "$V/user" 2>/dev/null \
            | sort -u | cut -c1-150 | sed 's/^/  /' | head -18 || echo "  (aucun href correspondant)"
          echo ""
          echo "  --- scripts de chat tiers déjà chargés ---"
          grep -rhoE 'src="https?://[^"]*(tawk|crisp|intercom|zendesk|drift|smartsupp)[^"]*"' "$V" 2>/dev/null \
            | sort -u | sed 's/^/  /' | head -8 || echo "  (aucun)"
          echo ""

          echo "=== ROUTES SUPPORT / TICKET / CONTACT DISPONIBLES ==="
          cat > "$LROOT/.gvp-sup.php" <<'EOPHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require_once __DIR__.'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $n = 0;
          foreach (app('router')->getRoutes() as $r) {
              $u = $r->uri();
              $name = $r->getName() ?: '-';
              if (! preg_match('#(support|ticket|contact|chat|message)#i', $u . ' ' . $name)) { continue; }
              $m = implode('|', array_diff($r->methods(), ['HEAD']));
              printf("  %-9s /%-46s %s\n", $m, $u, $name);
              if (++$n >= 24) { break; }
          }
          if ($n === 0) { echo "  (aucune)\n"; }
          EOPHP
          ( cd "$LROOT" && php .gvp-sup.php 2>&1 | head -30 ) || echo "  (lecture routes impossible)"
          rm -f "$LROOT/.gvp-sup.php"
          echo ""

          echo "=== COORDONNÉES CONFIGURÉES (téléphone / WhatsApp) ==="
          cat > "$LROOT/.gvp-cnt.php" <<'EOPHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require_once __DIR__.'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          try {
              $s = \App\Models\Admin\BasicSettings::first();
              if (! $s) { echo "  (aucun enregistrement de réglages)\n"; exit; }
              foreach ($s->getAttributes() as $k => $v) {
                  if (! preg_match('#(phone|whatsapp|contact|email|address|support)#i', $k)) { continue; }
                  if (is_string($v) && strlen($v) > 120) { $v = substr($v, 0, 120) . '…'; }
                  printf("  %-28s = %s\n", $k, is_scalar($v) ? $v : gettype($v));
              }
          } catch (\Throwable $e) {
              echo "  (réglages illisibles : ", substr($e->getMessage(), 0, 90), ")\n";
          }
          EOPHP
          ( cd "$LROOT" && php .gvp-cnt.php 2>&1 | head -22 ) || echo "  (lecture réglages impossible)"
          rm -f "$LROOT/.gvp-cnt.php"
          echo ""
          echo "NOTE : rien n'a été modifié."
          EOSSH

      # ------------------------------------------------------------------
      # USER-UI — refonte de l'interface du tableau de bord utilisateur.
      #
      # Injecte le bloc « Mes services » (cartes virtuelles + recharge carte,
      # création de carte, recharge mobile, PayLink) juste après
      # @section('content'), et sa feuille de style en @push('css').
      #
      # GARANTIES : aucune route définie ni modifiée, aucune URL réécrite —
      # seules des routes existantes sont appelées, chacune protégée par
      # Route::has(). La vue est recompilée par le moteur Blade avant d'être
      # validée ; au moindre échec, la sauvegarde est restaurée.
      # ------------------------------------------------------------------
      - name: User UI (refonte du tableau de bord)
        if: ${{ inputs.mode == 'user-ui' || inputs.mode == 'user-ui-undo' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          SSH="ssh -i $HOME/.ssh/id_deploy -p $PORT -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          if [ "${{ inputs.mode }}" = "user-ui" ]; then
            # Garde-fou : la validation doit passer AVANT que quoi que ce soit
            # ne parte sur le serveur. Elle refuse notamment tout nom de
            # directive Blade cité dans un commentaire — la faute exacte qui a
            # provoqué un 500 sur le tableau de bord (« Undefined variable
            # $gvpCards ») alors que la compilation, elle, passait.
            python3 govibepay/ui/validate.py || {
              echo "Validation échouée — rien n'a été transféré ni modifié."
              exit 1
            }
            $SSH "cat > /tmp/.gvp-services.blade" < govibepay/ui/dashboard-services.blade.php
            $SSH "cat > /tmp/.gvp-services.css"   < govibepay/ui/dashboard-services.css
            echo "Fichiers d'interface transférés."
          fi
          $SSH "MODE='${{ inputs.mode }}' bash -s" <<'EOSSH'
          set -uo pipefail
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          LROOT=""
          [ -f "$MARK" ] && LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          if [ -z "$LROOT" ] || [ ! -f "$LROOT/artisan" ]; then
            for c in "$DOM/govibepay-app" "$HOME/domains/app.govibepay.com/public_html"; do
              [ -f "$c/artisan" ] && { LROOT="$c"; break; }
            done
          fi
          [ -n "$LROOT" ] || { echo "ERREUR: script introuvable."; exit 1; }
          DASH="$LROOT/resources/views/user/dashboard.blade.php"
          [ -f "$DASH" ] || { echo "ERREUR: $DASH introuvable."; exit 1; }
          echo "Vue : ${DASH#$LROOT/}"

          # --- ANNULATION ----------------------------------------------------
          if [ "${MODE:-}" = "user-ui-undo" ]; then
            if [ -f "$DASH.bak-ui" ]; then
              cp -f "$DASH.bak-ui" "$DASH"
              ( cd "$LROOT" && php artisan view:clear >/dev/null 2>&1 ) || true
              echo "↩️  Vue d'origine restaurée, cache de vues vidé."
            else
              echo "Aucune sauvegarde — rien à annuler."
            fi
            exit 0
          fi

          [ -s /tmp/.gvp-services.blade ] || { echo "ERREUR: bloc d'interface non reçu."; exit 1; }
          [ -s /tmp/.gvp-services.css ]   || { echo "ERREUR: feuille de style non reçue."; exit 1; }

          # Déployer le CSS en fichier statique, hors de portée de Blade.
          CSSDIR="$DOM/public_html/public/backend/css"
          mkdir -p "$CSSDIR"
          cp -f /tmp/.gvp-services.css "$CSSDIR/gvps.css"
          chmod 644 "$CSSDIR/gvps.css"
          echo "✅ CSS statique déployé : public/backend/css/gvps.css ($(stat -c%s "$CSSDIR/gvps.css") octets)"

          # Repartir de l'original : le mode reste ré-appliquable sans cumuler.
          if [ -f "$DASH.bak-ui" ]; then
            cp -f "$DASH.bak-ui" "$DASH"
            echo "↺ reparti de la sauvegarde d'origine"
          else
            cp -f "$DASH" "$DASH.bak-ui"
            echo "✅ sauvegarde créée : $(basename "$DASH").bak-ui"
          fi

          # --- Injection ------------------------------------------------------
          cat > "$LROOT/.gvp-ui.php" <<'EOPHP'
          <?php
          $dash  = $argv[1];
          $src   = file_get_contents($dash);
          $block = file_get_contents('/tmp/.gvp-services.blade');
          $css   = file_get_contents('/tmp/.gvp-services.css');

          if (! preg_match('/@section\(\s*[\'"]content[\'"]\s*\)/', $src, $m, PREG_OFFSET_CAPTURE)) {
              fwrite(STDERR, "ERREUR: @section('content') introuvable — aucune modification.\n");
              exit(2);
          }
          $at  = $m[0][1] + strlen($m[0][0]);
          $out = substr($src, 0, $at)
               . "\n\n{{-- GVPA-SERVICES:début --}}\n" . $block . "\n{{-- GVPA-SERVICES:fin --}}\n"
               . substr($src, $at);

          // Le CSS n'est PAS intégré dans la vue : il est servi comme fichier
          // statique et seulement référencé ici. Un CSS intégré est compilé par
          // Blade, et un nom de directive qui s'y trouve — même en commentaire —
          // est exécuté pour de vrai. C'est ce qui a corrompu la pile de styles
          // et déversé le CSS en texte dans la page.
          $out .= "\n\n@push('css')\n"
                . "<link rel=\"stylesheet\" href=\"{{ asset('public/backend/css/gvps.css') }}?v=" . substr(md5($css), 0, 8) . "\">\n"
                . "@endpush\n";

          file_put_contents($dash, $out);
          echo "  bloc inséré après la section content (+" . (strlen($out) - strlen($src)) . " octets)\n";
          echo "  CSS référencé en fichier statique, non intégré à la vue\n";
          EOPHP
          php "$LROOT/.gvp-ui.php" "$DASH" || {
            echo "Injection échouée — restauration."
            cp -f "$DASH.bak-ui" "$DASH"
            rm -f "$LROOT/.gvp-ui.php"
            exit 1
          }
          rm -f "$LROOT/.gvp-ui.php"

          # --- Vérification : la vue compile-t-elle vraiment ? -----------------
          echo ""
          echo "=== VÉRIFICATION PAR LE MOTEUR BLADE ==="
          cat > "$LROOT/.gvp-check.php" <<'EOPHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require_once __DIR__.'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $file = $argv[1];
          $php  = Illuminate\Support\Facades\Blade::compileString(file_get_contents($file));
          $tmp  = sys_get_temp_dir().'/.gvp-compiled.php';
          file_put_contents($tmp, $php);
          // Compiler sans erreur ne suffit pas : la première version produisait
          // du PHP valide où les déclarations de variables avaient été avalées
          // par une directive citée dans un commentaire. On exige donc que les
          // variables du bloc soient réellement ASSIGNÉES dans le code compilé.
          foreach (['gvpCards', 'gvpCardCount', 'gvpCardBalance'] as $var) {
              if (! preg_match('/\$' . $var . '\s*=/', $php)) {
                  fwrite(STDERR, "ASSIGNATION MANQUANTE: \$$var\n");
                  echo "MISSING\n";
                  exit(0);
              }
          }
          echo $tmp, "\n";
          EOPHP
          COMPILED=$( cd "$LROOT" && php .gvp-check.php "$DASH" 2>&1 | tail -1 )
          rm -f "$LROOT/.gvp-check.php"
          if [ -f "$COMPILED" ] && php -l "$COMPILED" >/dev/null 2>&1; then
            echo "  ✅ la vue compile, le PHP produit est valide,"
            echo "     et les variables du bloc y sont bien assignées"
            rm -f "$COMPILED"
          else
            echo "  ❌ compilation invalide :"
            [ -f "$COMPILED" ] && php -l "$COMPILED" 2>&1 | head -5 | sed 's/^/     /'
            echo "$COMPILED" | head -3 | sed 's/^/     /'
            echo "  → restauration de la vue d'origine."
            cp -f "$DASH.bak-ui" "$DASH"
            rm -f "$COMPILED"
            ( cd "$LROOT" && php artisan view:clear >/dev/null 2>&1 ) || true
            exit 1
          fi

          ( cd "$LROOT" && php artisan view:clear >/dev/null 2>&1 ) || true
          rm -f /tmp/.gvp-services.blade /tmp/.gvp-services.css

          # Le CSS statique est-il réellement servi par Apache ?
          echo ""
          echo "=== LE CSS STATIQUE EST-IL SERVI ? ==="
          IP=$(curl -s --max-time 8 https://api.ipify.org 2>/dev/null | tr -d '[:space:]')
          case "$IP" in *[!0-9.]*|"") IP="";; esac
          if [ -n "$IP" ]; then
            R=$(curl -sS -k --max-time 20 --resolve govibepay.com:443:"$IP" \
                  -o /dev/null -w '%{http_code} %{content_type}' \
                  "https://govibepay.com/public/backend/css/gvps.css" 2>/dev/null)
            echo "  gvps.css → $R"
            case "$R" in
              2*css*) echo "  ✅ servi avec le bon type MIME" ;;
              2*)     echo "  ⚠️  servi, mais le type MIME n'est pas CSS" ;;
              *)      echo "  ❌ non servi — le bloc s'affichera sans style"
                      echo "     restauration de la vue d'origine."
                      cp -f "$DASH.bak-ui" "$DASH"
                      ( cd "$LROOT" && php artisan view:clear >/dev/null 2>&1 ) || true
                      exit 1 ;;
            esac
          else
            echo "  (IP publique indisponible — vérification sautée)"
          fi
          echo ""
          echo "  routes utilisées (existantes, jamais redéfinies) :"
          echo "    user.virtual.card.index · user.virtual.card.create.page"
          echo "    user.virtual.card.fund.page · user.mobile.topup.index"
          echo "    user.payment-link.index"
          echo ""
          echo "Pour annuler : relancer ce workflow en mode « user-ui-undo »."
          EOSSH

      # ------------------------------------------------------------------
      # HTTP — ce qu'Apache SERT VRAIMENT au navigateur. Lecture seule.
      #
      # Toutes les sondes précédentes visaient 127.0.0.1 et n'atteignaient
      # jamais le vhost de l'application (404 trompeurs). En résolvant le vrai
      # nom de domaine vers l'IP publique du serveur, la requête passe par le
      # même chemin qu'un navigateur : bon vhost, bon SSL, bon open_basedir.
      # ------------------------------------------------------------------
      - name: HTTP (ce qu'Apache sert réellement)
        if: ${{ inputs.mode == 'http' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          DOM_NAME="govibepay.com"

          # --- 1. IP publique du serveur -------------------------------------
          IP=""
          for SVC in "https://api.ipify.org" "https://ifconfig.me/ip" "https://icanhazip.com"; do
            IP=$(curl -s --max-time 8 "$SVC" 2>/dev/null | tr -d '[:space:]')
            case "$IP" in *[!0-9.]*|"") IP="";; *) break;; esac
          done
          if [ -z "$IP" ]; then
            IP=$(ip -4 -o addr show scope global 2>/dev/null | awk '{print $4}' | cut -d/ -f1 | grep -v '^10\.' | grep -v '^192\.168\.' | head -1)
          fi
          [ -n "$IP" ] || { echo "ERREUR : IP publique introuvable."; exit 1; }
          echo "IP publique du serveur : $IP"
          DNS_IP=$(getent hosts "$DOM_NAME" 2>/dev/null | awk '{print $1}' | head -1)
          echo "DNS $DOM_NAME       : ${DNS_IP:-inconnu}"
          [ -n "$DNS_IP" ] && [ "$DNS_IP" != "$IP" ] && echo "  ⚠️  le DNS pointe ailleurs que cette machine (CDN/proxy ?)"
          echo ""

          RES="--resolve ${DOM_NAME}:443:${IP} --resolve ${DOM_NAME}:80:${IP}"
          CURL="curl -sS -k --max-time 25 $RES"

          probe() { # $1=url  → "code taille type"
            $CURL -o /tmp/.gvp.body -w '%{http_code} %{size_download} %{content_type}' "$1" 2>/dev/null || echo "000 0 -"
          }

          # --- 2. Les pages ---------------------------------------------------
          echo "=== PAGES (vues comme par un navigateur) ==="
          for U in "/" "/admin/login" "/user/login" "/register"; do
            R=$(probe "https://${DOM_NAME}${U}")
            printf '  %-14s → %s\n' "$U" "$R"
          done
          echo ""

          # --- 3. Les assets référencés par /admin/login ----------------------
          echo "=== ASSETS de /admin/login ==="
          $CURL -o /tmp/.gvp.login "https://${DOM_NAME}/admin/login" >/dev/null 2>&1 || true
          if [ ! -s /tmp/.gvp.login ]; then
            echo "  (page vide — impossible d'extraire les assets)"
          else
            grep -oE '(src|href)="[^"]+\.(css|js)(\?[^"]*)?"' /tmp/.gvp.login 2>/dev/null \
              | sed -E 's/^(src|href)="//; s/"$//' | sort -u > /tmp/.gvp.assets || true
            TOTAL=$(wc -l < /tmp/.gvp.assets 2>/dev/null || echo 0)
            echo "  $TOTAL fichier(s) css/js référencé(s)"
            BAD=0; EXT=0
            while IFS= read -r A; do
              [ -n "$A" ] || continue
              case "$A" in
                //*)  A="https:$A" ;;
                http*) : ;;
                /*)   A="https://${DOM_NAME}${A}" ;;
                *)    A="https://${DOM_NAME}/${A}" ;;
              esac
              case "$A" in
                "https://${DOM_NAME}/"*) SCOPE="local" ;;
                *) SCOPE="EXTERNE"; EXT=$((EXT+1)) ;;
              esac
              R=$(probe "$A")
              CODE=${R%% *}
              case "$CODE" in
                2*) STATUS="ok" ;;
                *)  STATUS="❌"; BAD=$((BAD+1)) ;;
              esac
              printf '  %-3s %-7s %-4s %s\n' "$STATUS" "$SCOPE" "$CODE" "${A#https://${DOM_NAME}}"
            done < /tmp/.gvp.assets
            echo ""
            echo "  → $BAD asset(s) en échec, $EXT dépendance(s) externe(s)"
          fi
          echo ""

          # --- 4. Scripts externes bloquants (recaptcha & co) ------------------
          echo "=== DÉPENDANCES EXTERNES de /admin/login ==="
          if [ -s /tmp/.gvp.login ]; then
            grep -oE 'src="https?://[^"]+"' /tmp/.gvp.login 2>/dev/null \
              | sed -E 's/^src="//; s/"$//' \
              | grep -v "$DOM_NAME" | sort -u | sed 's/^/  /' || echo "  (aucune)"
          fi
          echo ""

          # --- 5. Champs du formulaire (readonly/disabled ?) -------------------
          echo "=== CHAMPS DU FORMULAIRE ==="
          if [ -s /tmp/.gvp.login ]; then
            grep -oE '<input[^>]*>' /tmp/.gvp.login 2>/dev/null \
              | grep -iE 'type="(email|text|password)"' | sed 's/^/  /' | head -8 || echo "  (aucun champ trouvé)"
          fi
          echo ""

          # --- 6. Structure réelle : le CSS peut-il seulement atteindre le champ ?
          echo "=== CHAÎNE D'ANCÊTRES : <body> → <form> ==="
          if [ -s /tmp/.gvp.login ]; then
            # toutes les balises ouvrantes de section entre <body> et <form>
            awk '/<body/,/<form/' /tmp/.gvp.login \
              | grep -oiE '<(body|div|section|main|form)[^>]*>' \
              | grep -viE '^</' | cut -c1-150 | sed 's/^/  /' | head -25 || true
            echo ""
            for C in page-wrapper account-area account-wrapper account-form form-group; do
              if grep -q "$C" /tmp/.gvp.login 2>/dev/null; then
                echo "  ✅ .$C présent dans la page"
              else
                echo "  ❌ .$C ABSENT — tout sélecteur CSS qui le préfixe est inerte"
              fi
            done
          fi
          echo ""

          echo "=== LE CORRECTIF EST-IL SERVI, ET COMPLET ? ==="
          if [ -s /tmp/.gvp.login ]; then
            if grep -q 'GVPA-TAP-FIX' /tmp/.gvp.login; then
              echo "  ✅ marqueur présent ($(grep -c 'GVPA-TAP-FIX' /tmp/.gvp.login) occurrence(s))"
              echo "  --- règles telles que servies ---"
              awk '/GVPA-TAP-FIX/,/\/GVPA-TAP-FIX/' /tmp/.gvp.login | cut -c1-160 | sed 's/^/  /' | head -55 || true
            else
              echo "  ❌ marqueur ABSENT de la page servie"
            fi
          fi
          echo ""

          echo "=== RESPONSIVE ET RECOUVREMENT ==="
          if [ -s /tmp/.gvp.login ]; then
            echo "  --- <meta viewport> ---"
            grep -oiE '<meta[^>]*viewport[^>]*>' /tmp/.gvp.login | sed 's/^/  /' || echo "  ⚠️  AUCUN viewport"
            echo "  --- balise <body> ---"
            grep -oE '<body[^>]*>' /tmp/.gvp.login | sed 's/^/  /' || true
            echo "  --- @media dans le style en ligne ---"
            sed -n '/<style/,/<\/style>/p' /tmp/.gvp.login | grep -n '@media' | sed 's/^/  /' | head -10 || echo "  (aucune)"
            echo "  --- overlays / preloaders ---"
            grep -oiE '<(div|section|span)[^>]*class="[^"]*(preloader|loader|overlay|backdrop|modal|spinner)[^"]*"[^>]*>' /tmp/.gvp.login \
              | cut -c1-140 | sed 's/^/  /' | head -8 || echo "  (aucun)"
          fi
          echo ""

          echo "=== CE QUE style.css IMPOSE AU LABEL FLOTTANT ==="
          CSSF=""
          for C in "$HOME/domains/govibepay.com/public_html/public/backend/css/style.css"; do
            [ -f "$C" ] && CSSF="$C"
          done
          if [ -n "$CSSF" ]; then
            grep -nE '\.account-form|\.form-group' "$CSSF" | cut -c1-140 | sed 's/^/  /' | head -30 || echo "  (aucune règle)"
          else
            echo "  (style.css introuvable)"
          fi
          echo ""

          # --- 7. Le HTML du formulaire, tel que reçu -------------------------
          echo "=== HTML DU FORMULAIRE (tel que reçu par le navigateur) ==="
          if [ -s /tmp/.gvp.login ]; then
            awk '/<form/,/<\/form>/' /tmp/.gvp.login | cut -c1-240 | sed 's/^/  /' | head -60 || true
          fi
          echo ""

          # --- 8. Pourquoi un asset renvoie 500 -------------------------------
          echo "=== ASSET EN ÉCHEC : smoothscroll.js ==="
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          LROOT=""
          [ -f "$MARK" ] && LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          [ -n "$LROOT" ] || LROOT="$DOM/govibepay-app"
          for P in "$DOM/public_html/public/backend/js/smoothscroll.js" "$LROOT/public/backend/js/smoothscroll.js"; do
            if [ -f "$P" ]; then
              echo "  ✅ présent : ${P#$HOME/} ($(stat -c%s "$P") octets)"
            else
              echo "  ❌ absent  : ${P#$HOME/}"
            fi
          done
          echo "  --- 5 dernières erreurs du journal Laravel ---"
          LOG="$LROOT/storage/logs/laravel.log"
          [ -f "$LOG" ] && tail -c 200000 "$LOG" | grep -aoE '\] (production|local|GOVIBEPAY)\.ERROR: [^{]{0,180}' | tail -5 | sed 's/^/  /' || echo "  (journal illisible)"

          echo ""

          # --- 9. Le label flottant intercepte-t-il le toucher ? ---------------
          # Le champ est suivi d'un <label> SANS for=. Si le thème le place en
          # absolu par-dessus l'input sans « pointer-events: none », chaque tap
          # mobile atterrit sur le label et n'ouvre jamais le clavier.
          # Le label porte DÉJÀ pointer-events:none dans le thème — il n'intercepte
          # rien, l'hypothèse du label était fausse. Suspect restant : le fond de
          # bulles animées du gabarit, qui couvre toute la page et n'a jamais reçu
          # pointer-events:none. Il est dans le gabarit, pas dans la vue — ce qui
          # expliquerait que les DEUX versions de la page échouent pareil.
          echo "=== FOND DE BULLES ANIMÉES (suspect principal) ==="
          CSS=""
          for C in "$DOM/public_html/public/backend/css/style.css" "$LROOT/public/backend/css/style.css"; do
            [ -f "$C" ] && { CSS="$C"; break; }
          done
          if [ -s /tmp/.gvp.login ]; then
            echo "  --- présence dans la page servie ---"
            grep -oiE '<(ul|div)[^>]*class="[^"]*bubble[^"]*"[^>]*>' /tmp/.gvp.login | cut -c1-120 | sed 's/^/  /' | head -4 \
              || echo "  (aucun élément de bulles dans la page)"
          fi
          if [ -n "$CSS" ]; then
            echo "  --- règles .bg-bubbles dans style.css ---"
            awk '/\.bg-bubbles/{f=1} f{print; if(/}/){c++; if(c>3) exit}}' "$CSS" | cut -c1-120 | sed 's/^/  /' | head -30 || true
            echo ""
            echo "  --- ce que le thème impose au conteneur et au champ ---"
            awk '/^\.account-form \.form-group \{/,/^}/' "$CSS" | sed 's/^/  /' | head -12 || true
            awk '/^\.account-form \.form-group input \{/,/^}/' "$CSS" | sed 's/^/  /' | head -14 || true
            echo ""
            echo "  --- z-index autour de la zone de connexion ---"
            grep -nE 'account-area|account-wrapper|bg-bubbles' "$CSS" | cut -c1-110 | sed 's/^/  /' | head -12 || true
          else
            echo "  (style.css introuvable sur disque)"
          fi

          rm -f /tmp/.gvp.body /tmp/.gvp.login /tmp/.gvp.assets
          echo ""
          echo "NOTE : rien n'a été modifié. Un code 2xx ici = Apache sert bien le fichier."
          EOSSH

      # ------------------------------------------------------------------
      # FIX-TAP — rendre les champs de login utilisables au toucher.
      #
      # Constat du mode `http` : le bloc <style> servi stylise .gvpa-input /
      # .gvpa-label, mais le HTML servi est celui d'origine du thème
      # (div.form-group > input class="" + <label> sans for=). Les deux
      # couches ne correspondent plus : le champ n'a aucun style et le label
      # flottant du thème le recouvre. Sur mobile chaque tap atterrit sur le
      # label, qui sans for= ne donne pas le focus → le clavier ne monte pas.
      #
      # Correctif : un pont CSS ajouté À LA FIN du bloc <style> existant.
      # Aucune route, aucune URL, aucun HTML modifié. Idempotent (marqueur),
      # sauvegarde .bak-tap, réversible par le mode `fix-tap-undo`.
      # ------------------------------------------------------------------
      - name: Fix tap (champs de login utilisables au toucher)
        if: ${{ inputs.mode == 'fix-tap' || inputs.mode == 'fix-tap-undo' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          MODE="${{ inputs.mode }}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "MODE='$MODE' bash -s" <<'EOSSH'
          set -uo pipefail
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          LROOT=""
          [ -f "$MARK" ] && LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          if [ -z "$LROOT" ] || [ ! -f "$LROOT/artisan" ]; then
            for c in "$DOM/govibepay-app" "$HOME/domains/app.govibepay.com/public_html"; do
              [ -f "$c/artisan" ] && { LROOT="$c"; break; }
            done
          fi
          [ -n "$LROOT" ] || { echo "ERREUR: script introuvable."; exit 1; }
          echo "Script : $LROOT"

          # --- Localiser le(s) fichier(s) portant le bloc <style> personnalisé
          FILES=$(grep -rl 'gvpa-input' "$LROOT/resources/views" 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "ERREUR : aucun fichier de vue ne contient 'gvpa-input'."
            echo "         Le bloc <style> personnalisé est introuvable — arrêt sans rien changer."
            exit 1
          fi
          echo "Fichiers concernés :"
          echo "$FILES" | sed "s#$LROOT/#  #"
          echo ""

          # --- ANNULATION ----------------------------------------------------
          if [ "${MODE:-}" = "fix-tap-undo" ]; then
            N=0
            for F in $FILES; do
              if [ -f "$F.bak-tap" ]; then
                cp -f "$F.bak-tap" "$F" && { echo "  ↩️  restauré : ${F#$LROOT/}"; N=$((N+1)); }
              else
                echo "  (pas de sauvegarde pour ${F#$LROOT/})"
              fi
            done
            ( cd "$LROOT" && php artisan view:clear >/dev/null 2>&1 ) || true
            echo ""
            echo "$N fichier(s) restauré(s). Cache de vues vidé."
            exit 0
          fi

          # --- APPLICATION ---------------------------------------------------
          cat > /tmp/.gvp-tap.css <<'EOCSS'

          /* ── GVPA-TAP-FIX ────────────────────────────────────────────────
             Le champ ne prenait pas le focus au toucher. Le label n'y est
             pour rien : le thème lui met déjà pointer-events:none. Le vrai
             obstacle est le fond de bulles animées du gabarit, qui traverse
             toute la page sans jamais recevoir pointer-events:none, alors que
             .account-area n'était relevé qu'à z-index 1. Sur ordinateur
             autofocus plaçait le curseur seul, ce qui masquait le problème.
             Purement additif : ne change ni le design du thème ni le label
             flottant. */

          /* 1. Les bulles sont décoratives — elles ne doivent jamais capter
                le toucher ni le clic. */
          .bg-bubbles,
          .bg-bubbles li {
            pointer-events: none !important;
          }

          /* 2. La zone de connexion passe au-dessus de toute couche décorative. */
          .page-wrapper .account-area {
            position: relative !important;
            z-index: 10 !important;
          }
          .page-wrapper .account-wrapper {
            position: relative !important;
            z-index: 11 !important;
          }

          /* 3. Champs : pleine largeur et cible tactile confortable sur mobile,
                inchangés à l'œil sur ordinateur. 16px empêche le zoom
                automatique d'iOS à la mise au point. */
          .account-form .form-group input,
          .account-form .form-group select,
          .account-form .form-group textarea {
            position: relative !important;
            z-index: 12 !important;
            width: 100% !important;
            display: block !important;
            min-height: 48px !important;
            font-size: 16px !important;
            -webkit-appearance: none !important;
            appearance: none !important;
            touch-action: manipulation !important;
          }
          .account-form .form-group .show-pass {
            z-index: 13 !important;
          }
          /* ── /GVPA-TAP-FIX ───────────────────────────────────────────── */
          EOCSS
          sed -i 's/^          //' /tmp/.gvp-tap.css

          cat > "$LROOT/.gvp-tap.php" <<'EOPHP'
          <?php
          $files = array_filter(explode("\n", trim($argv[1] ?? '')));
          $css   = file_get_contents('/tmp/.gvp-tap.css');
          foreach ($files as $f) {
              $f = trim($f);
              if ($f === '' || ! is_file($f)) { continue; }
              // Toujours repartir de l'original : sinon un correctif antérieur
              // resterait en place et se cumulerait avec le nouveau.
              if (is_file($f.'.bak-tap')) {
                  copy($f.'.bak-tap', $f);
                  echo "  ↺ reparti de la sauvegarde : $f\n";
              }
              $src = file_get_contents($f);
              $anchor = strpos($src, 'gvpa-input');
              if ($anchor === false) { echo "  ! ancre absente : $f\n"; continue; }
              $close = strpos($src, '</style>', $anchor);
              if ($close === false) { echo "  ! </style> introuvable : $f\n"; continue; }
              if (! file_exists($f.'.bak-tap')) { copy($f, $f.'.bak-tap'); }
              $out = substr($src, 0, $close).$css.substr($src, $close);
              file_put_contents($f, $out);
              echo "  ✅ appliqué : $f (+".strlen($css)." octets)\n";
          }
          EOPHP
          php "$LROOT/.gvp-tap.php" "$FILES"
          rm -f "$LROOT/.gvp-tap.php" /tmp/.gvp-tap.css
          ( cd "$LROOT" && php artisan view:clear >/dev/null 2>&1 ) || true
          echo ""

          # --- Asset manquant qui renvoie 500 sur chaque page admin -----------
          echo "=== smoothscroll.js (500 sur chaque chargement) ==="
          TARGET="$DOM/public_html/public/backend/js/smoothscroll.js"
          if [ -f "$TARGET" ]; then
            echo "  = déjà présent"
          else
            SRC=$(find "$LROOT" "$DOM/public_html" -name 'smoothscroll*.js' -type f 2>/dev/null | head -1)
            mkdir -p "$(dirname "$TARGET")"
            if [ -n "$SRC" ]; then
              cp -f "$SRC" "$TARGET" && echo "  ✅ copié depuis ${SRC#$HOME/}"
            else
              printf '/* smoothscroll.js — absent du paquet dorigine.\n   Fichier vide volontaire : evite un 500 a chaque chargement.\n   Le navigateur gere scroll-behavior nativement. */\n' > "$TARGET"
              echo "  ✅ créé (vide) — supprime le 500, aucun effet visuel"
            fi
            chmod 644 "$TARGET" 2>/dev/null || true
          fi
          echo ""

          # --- Vérification par HTTP réel ------------------------------------
          echo "=== VÉRIFICATION (HTTP réel) ==="
          IP=$(curl -s --max-time 8 https://api.ipify.org 2>/dev/null | tr -d '[:space:]')
          case "$IP" in *[!0-9.]*|"") IP="";; esac
          if [ -n "$IP" ]; then
            CURL="curl -sS -k --max-time 25 --resolve govibepay.com:443:$IP"
            $CURL -o /tmp/.gvp.v "https://govibepay.com/admin/login" >/dev/null 2>&1 || true
            CODE=$($CURL -o /dev/null -w '%{http_code}' "https://govibepay.com/admin/login" 2>/dev/null)
            echo "  /admin/login → $CODE"
            if grep -q 'GVPA-TAP-FIX' /tmp/.gvp.v 2>/dev/null; then
              echo "  ✅ le correctif CSS est bien servi"
            else
              echo "  ⚠️  le correctif n'apparaît pas dans la page servie"
            fi
            SC=$($CURL -o /dev/null -w '%{http_code}' "https://govibepay.com/public/backend/js/smoothscroll.js" 2>/dev/null)
            echo "  smoothscroll.js → $SC"
            rm -f /tmp/.gvp.v
          else
            echo "  (IP publique indisponible — vérification sautée)"
          fi
          echo ""
          echo "Pour annuler : relancer ce workflow en mode « fix-tap-undo »."
          EOSSH

      # ------------------------------------------------------------------
      # ROLLBACK — remet tout dans l'état d'avant la fusion.
      # ------------------------------------------------------------------
      - name: Rollback
        if: ${{ inputs.mode == 'rollback' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          [ -f "$MARK" ] || { echo "ERREUR: aucun marqueur de fusion — rien à restaurer."; exit 1; }
          echo "=== Marqueur ==="; cat "$MARK"
          LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          PUB=$(grep '^pub=' "$MARK" | cut -d= -f2-)
          HOMEFILE=$(grep '^homefile=' "$MARK" | cut -d= -f2-)
          VDIR=$(grep '^vacated=' "$MARK" | cut -d= -f2-)
          BK=$(grep '^backup=' "$MARK" | cut -d= -f2-)
          MOVED_FROM=$(grep '^moved_from=' "$MARK" | cut -d= -f2-)

          # 0) si le script avait été DÉPLACÉ, le remettre à sa place d'origine
          if [ -n "$MOVED_FROM" ] && [ -d "$LROOT" ] && [ "$LROOT" != "$MOVED_FROM" ]; then
            rm -f "$MOVED_FROM/index.php" "$MOVED_FROM/.htaccess" 2>/dev/null || true
            rmdir "$MOVED_FROM" 2>/dev/null || true
            if mv "$LROOT" "$MOVED_FROM"; then
              echo "→ script remis à son emplacement d'origine : $MOVED_FROM"
              rm -f "$MOVED_FROM"/bootstrap/cache/*.php 2>/dev/null || true
              LROOT="$MOVED_FROM"
            else
              echo "!! déplacement inverse impossible — intervention manuelle nécessaire"
            fi
          fi

          # 1) home d'origine remise en index.php
          if [ -n "$BK" ] && [ -f "$BK/index.php" ]; then
            [ -n "$HOMEFILE" ] && [ -f "$HOMEFILE" ] && rm -f "$HOMEFILE"
            cp -a "$BK/index.php" "$PUB/index.php"
            echo "→ page d'accueil d'origine restaurée"
          elif [ -n "$BK" ] && [ -f "$BK/index.html" ]; then
            [ -n "$HOMEFILE" ] && [ -f "$HOMEFILE" ] && rm -f "$HOMEFILE"
            cp -a "$BK/index.html" "$PUB/index.html"
            rm -f "$PUB/index.php"
            echo "→ page d'accueil d'origine restaurée (index.html)"
          fi
          # 2) .htaccess racine
          if [ -n "$BK" ] && [ -f "$BK/.htaccess" ]; then cp -a "$BK/.htaccess" "$PUB/.htaccess"; echo "→ .htaccess racine restauré"; fi
          # 3) sous-domaine
          if [ -n "$VDIR" ] && [ -d "$VDIR" ]; then
            if [ -n "$BK" ] && [ -f "$BK/subdomain.htaccess" ]; then
              cp -a "$BK/subdomain.htaccess" "$VDIR/.htaccess"; echo "→ .htaccess du sous-domaine restauré"
            else
              rm -f "$VDIR/.htaccess"; echo "→ redirection du sous-domaine retirée"
            fi
          fi
          # 3b) assets vendorisés (mode assets) : restaurer les vues d'origine
          AB=$(ls -dt "$DOM"/assets-backup-* 2>/dev/null | head -1)
          if [ -n "$AB" ] && [ -d "$AB" ] && [ -n "$LROOT" ]; then
            cp -a "$AB/." "$LROOT/"; rm -f "$DOM/.govibepay-assets.meta"
            echo "→ références d'assets restaurées depuis $AB"
          fi
          # 4) route '/' + marque dans le script
          if [ -n "$LROOT" ] && [ -d "$LROOT" ]; then
            if [ -f "$LROOT/routes/web.php.bak-govibepay" ]; then
              cp -a "$LROOT/routes/web.php.bak-govibepay" "$LROOT/routes/web.php"; echo "→ routes/web.php restauré"
            fi
            B=$(ls -dt "$DOM"/brand-backup-* 2>/dev/null | head -1)
            if [ -n "$B" ] && [ -d "$B" ]; then cp -a "$B/." "$LROOT/"; echo "→ marque restaurée depuis $B"; fi
            if [ -n "$BK" ] && [ -f "$BK/.env" ]; then cp -a "$BK/.env" "$LROOT/.env"; echo "→ .env restauré"; fi
            ( cd "$LROOT" && php artisan config:clear >/dev/null 2>&1; php artisan route:clear >/dev/null 2>&1; php artisan view:clear >/dev/null 2>&1 ) || true
          fi
          rm -f "$MARK"
          echo "=== Rollback OK ==="
          for H in govibepay.com app.govibepay.com; do
            curl -skS -m 12 -o /dev/null -w "  https://$H -> code=%{http_code}\n" --resolve "$H:443:127.0.0.1" "https://$H/" || true
          done
          EOSSH
