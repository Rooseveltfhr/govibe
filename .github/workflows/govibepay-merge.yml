name: GOVIBEPAY — Fusion app.govibepay.com → govibepay.com

# Fusionne l'application (app.govibepay.com — script QRPay « GOVIBEPAY WALLET »)
# sur le domaine racine govibepay.com :
#  - la page d'accueil ACTUELLE de govibepay.com est CONSERVÉE telle quelle et
#    devient la home du script (aucune redesign : c'est le design existant) ;
#  - le contenu actuel du docroot racine n'est jamais déplacé en bloc : les
#    assets de la home et les dossiers existants restent en place ;
#  - app.govibepay.com devient une redirection 301 vers la racine ;
#  - le nom du script est mis à la marque GOVIBEPay (sans jamais toucher aux URLs).
#
# DÉLIBÉRÉMENT manuel (bouton) + mode « inspect » par défaut (aucun changement).
# Ordre : 1) inspect → lire le rapport  2) merge  3) vérifier le site.
# En cas de problème : mode rollback.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = audit seul (aucun changement) · merge = fusionner · landing = réinstaller la home · brand = marque GOVIBEPay seulement · rollback = tout défaire"
        type: choice
        options:
          - inspect
          - merge
          - landing
          - brand
          - rollback
        default: inspect

concurrency:
  group: govibepay-merge
  cancel-in-progress: false

env:
  # Domaine racine cible et sous-domaine à vider. Centralisés ici.
  ROOT_DOMAIN: govibepay.com
  APP_SUBDOMAIN: app.govibepay.com

jobs:
  run:
    name: ${{ inputs.mode }} sur le VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # ------------------------------------------------------------------
      # INSPECT — toujours exécuté : photographie la structure réelle du
      # serveur AVANT d'agir, et signale les expositions publiques. Aucune écriture.
      # ------------------------------------------------------------------
      - name: Inspect (audit, aucun changement)
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          DOM="$HOME/domains/govibepay.com"
          PUB="$DOM/public_html"
          APPDOM="$HOME/domains/app.govibepay.com"

          echo "=== $PUB (docroot racine) ==="
          ls -la "$PUB" 2>/dev/null | head -30
          echo ""
          echo "=== Page d'accueil actuelle ($PUB/index.php) ==="
          if [ -f "$PUB/index.php" ]; then
            echo "taille : $(wc -c < "$PUB/index.php") octets"
            if grep -q '<?php' "$PUB/index.php"; then echo "type   : contient du PHP"; else echo "type   : HTML pur"; fi
            echo "--- références d'assets (chemins relatifs) ---"
            grep -oE '(src|href)="[^"h][^":]*"' "$PUB/index.php" 2>/dev/null \
              | sed -E 's/.*"([^\/"]+)\/.*/\1\//' | sort -u | head -15
          else
            echo "(pas d'index.php à la racine)"
          fi
          echo ""
          echo "=== Racine du script (app) ==="
          LROOT=""
          for c in "$APPDOM/public_html" "$PUB/app" "$DOM/govibepay-app"; do
            if [ -f "$c/artisan" ]; then LROOT="$c"; break; fi
            if [ -f "$c/../artisan" ]; then LROOT="$(cd "$c/.." && pwd)"; break; fi
          done
          if [ -n "$LROOT" ]; then
            echo "Script : $LROOT"
            [ -d "$LROOT/public" ] && echo "public/ : présent" || echo "public/ : ABSENT (structure inhabituelle)"
            grep -E '^(APP_NAME|APP_URL|MAIL_FROM_NAME)=' "$LROOT/.env" 2>/dev/null || echo "(.env illisible)"
            echo "--- marque visible « AppDevs » (hors URLs) ---"
            grep -rIn --exclude-dir=vendor --exclude-dir=node_modules --exclude-dir=storage \
                 --exclude-dir=.git --exclude-dir='resources[A-Z]*' -e 'AppDevs' \
                 "$LROOT/resources" 2>/dev/null | grep -viE 'appdevs\.(net|cloud)|appdevsx|cdn\.appdevs' | head -10 \
              || echo "(aucune mention hors URL)"
          else
            echo "(racine du script non détectée)"
          fi
          echo ""
          echo "=== ⚠️ EXPOSITIONS PUBLIQUES (à vérifier d'urgence) ==="
          for U in "/.env" "/.envMM" "/.env.example" "/install/" "/app/install/"; do
            for H in govibepay.com app.govibepay.com; do
              C=$(curl -skS -m 10 -o /dev/null -w '%{http_code}' -H "Host: $H" "https://127.0.0.1$U" 2>/dev/null)
              case "$C" in 200) echo "  🔴 https://$H$U -> $C  ACCESSIBLE PUBLIQUEMENT";; 403|404) echo "  ✅ https://$H$U -> $C";; *) echo "  ?  https://$H$U -> $C";; esac
            done
          done
          echo "--- archives du script téléchargeables dans le docroot ? ---"
          find "$PUB" -maxdepth 3 -name '*.zip' -size +1M 2>/dev/null | head -5 || true
          echo ""
          echo "=== Version PHP CLI ==="
          php -v 2>/dev/null | head -1 || echo "php introuvable"
          echo ""
          echo "=== HTTP local (sans DNS/CDN) ==="
          for H in govibepay.com app.govibepay.com; do
            curl -skS -m 12 -o /dev/null -w "  https://$H -> code=%{http_code} time=%{time_total}s\n" -H "Host: $H" "https://127.0.0.1/" || echo "  $H -> échec"
          done
          echo ""
          echo "=== Fusion déjà effectuée ? ==="
          if [ -f "$DOM/.govibepay-merge.meta" ]; then echo "OUI :"; cat "$DOM/.govibepay-merge.meta"; else echo "non (aucun marqueur)"; fi
          echo ""
          echo "=== Sauvegardes de fusion présentes ==="
          ls -d "$DOM"/govibepay-merge-backup-* 2>/dev/null || echo "(aucune)"
          EOSSH

      # ------------------------------------------------------------------
      # MERGE — sert le script à la racine SANS déplacer le docroot existant.
      # La home actuelle est conservée (avec ses assets) et devient la home
      # du script via une route '/'. Idempotent (marqueur), non destructif.
      # ------------------------------------------------------------------
      - name: Merge (fusion app → racine)
        if: ${{ inputs.mode == 'merge' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          TS=$(date +%Y%m%d-%H%M%S)
          DOM="$HOME/domains/govibepay.com"
          PUB="$DOM/public_html"
          APPDOM="$HOME/domains/app.govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          BK="$DOM/govibepay-merge-backup-$TS"
          [ -d "$PUB" ] || { echo "ERREUR: $PUB introuvable"; exit 1; }

          if [ -f "$MARK" ]; then
            echo "Déjà fusionné — rien à refaire :"; cat "$MARK"; exit 0
          fi

          # 1) Racine du script (Laravel attendu)
          LROOT=""
          for c in "$APPDOM/public_html" "$PUB/app" "$DOM/govibepay-app"; do
            if [ -f "$c/artisan" ]; then LROOT="$c"; break; fi
            if [ -f "$c/../artisan" ]; then LROOT="$(cd "$c/.." && pwd)"; break; fi
          done
          [ -n "$LROOT" ] || { echo "ERREUR: script introuvable — lancer 'inspect'."; exit 1; }
          [ -d "$LROOT/public" ] || { echo "ERREUR: $LROOT/public absent — structure inattendue, abandon."; exit 1; }
          [ -f "$LROOT/vendor/autoload.php" ] || { echo "ERREUR: vendor/ absent dans $LROOT — abandon."; exit 1; }
          echo "Script : $LROOT"

          mkdir -p "$BK"

          # 2) La home ACTUELLE de govibepay.com est conservée telle quelle.
          #    Elle reste DANS le docroot pour que ses assets relatifs marchent,
          #    et le script la servira sur '/'.
          HOMEFILE=""
          if [ -f "$PUB/index.php" ]; then
            cp -a "$PUB/index.php" "$BK/index.php"
            mv "$PUB/index.php" "$PUB/govibepay-home.php"
            HOMEFILE="$PUB/govibepay-home.php"
            echo "→ home actuelle conservée : $HOMEFILE ($(wc -c < "$HOMEFILE") octets)"
          elif [ -f "$PUB/index.html" ]; then
            cp -a "$PUB/index.html" "$BK/index.html"
            mv "$PUB/index.html" "$PUB/govibepay-home.php"
            HOMEFILE="$PUB/govibepay-home.php"
            echo "→ home actuelle conservée : $HOMEFILE"
          else
            echo "→ aucune home existante trouvée (le script servira sa propre page d'accueil)"
          fi

          # 3) Assets publics du script copiés dans le docroot SANS écraser
          #    l'existant (les fichiers de la home actuelle sont préservés).
          [ -f "$PUB/.htaccess" ] && cp -a "$PUB/.htaccess" "$BK/.htaccess"
          cp -an "$LROOT/public/." "$PUB/" 2>/dev/null || true
          echo "→ assets du script copiés (sans écraser l'existant)"

          # 4) Front controller pointé en ABSOLU sur la racine du script
          cat > "$PUB/index.php" <<EOPHP
          <?php
          // GOVIBEPAY — front controller genere (fusion app.govibepay.com -> govibepay.com)
          define('LARAVEL_START', microtime(true));
          if (file_exists(\$maintenance = '$LROOT/storage/framework/maintenance.php')) {
              require \$maintenance;
          }
          require '$LROOT/vendor/autoload.php';
          \$app = require_once '$LROOT/bootstrap/app.php';
          \$kernel = \$app->make(Illuminate\Contracts\Http\Kernel::class);
          \$response = \$kernel->handle(\$request = Illuminate\Http\Request::capture());
          \$response->send();
          \$kernel->terminate(\$request, \$response);
          EOPHP
          php -l "$PUB/index.php" || { echo "ERREUR: front controller invalide"; exit 1; }

          # 5) storage public + APP_URL
          [ -L "$PUB/storage" ] && rm -f "$PUB/storage"
          [ -d "$LROOT/storage/app/public" ] && ln -s "$LROOT/storage/app/public" "$PUB/storage" 2>/dev/null || true
          ENVF="$LROOT/.env"
          if [ -f "$ENVF" ]; then
            cp -a "$ENVF" "$BK/.env"
            if grep -q '^APP_URL=' "$ENVF"; then
              sed -i 's#^APP_URL=.*#APP_URL=https://govibepay.com#' "$ENVF"
            else
              echo 'APP_URL=https://govibepay.com' >> "$ENVF"
            fi
            grep -E '^APP_URL=' "$ENVF"
          fi

          # 6) app.govibepay.com → redirection 301. Le docroot du sous-domaine EST
          #    la racine du script : on n'y écrit QUE le .htaccess de redirection
          #    (conditionné sur l'hôte) et on laisse les fichiers du script intacts.
          VDIR="$APPDOM/public_html"
          if [ -d "$VDIR" ]; then
            [ -f "$VDIR/.htaccess" ] && cp -a "$VDIR/.htaccess" "$BK/subdomain.htaccess"
            cat > "$VDIR/.htaccess" <<'EOHT'
          # GOVIBEPAY-REDIRECT — app.govibepay.com est fusionné dans govibepay.com.
          RewriteEngine On
          RewriteCond %{HTTP_HOST} ^app\.govibepay\.com$ [NC]
          RewriteRule ^(.*)$ https://govibepay.com/$1 [R=301,L]
          EOHT
            echo "→ app.govibepay.com : redirection 301 installée (fichiers du script intacts)"
          fi

          # 7) Marqueur
          {
            echo "ts=$TS"
            echo "lroot=$LROOT"
            echo "pub=$PUB"
            echo "homefile=${HOMEFILE:-}"
            echo "vacated=$VDIR"
            echo "backup=$BK"
          } > "$MARK"
          ( cd "$LROOT" && php artisan config:clear >/dev/null 2>&1; php artisan cache:clear >/dev/null 2>&1 ) || true
          echo ""; echo "=== Fusion OK ==="; cat "$MARK"
          EOSSH

      # ------------------------------------------------------------------
      # LANDING — installe la route '/' dans le script pour servir la home
      # conservée. Aucune réécriture de design : c'est le fichier existant.
      # ------------------------------------------------------------------
      - name: Install home route (page d'accueil dans le script)
        if: ${{ inputs.mode == 'merge' || inputs.mode == 'landing' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          [ -f "$MARK" ] || { echo "ERREUR: fusion pas encore faite — lancer le mode merge d'abord."; exit 1; }
          LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          HOMEFILE=$(grep '^homefile=' "$MARK" | cut -d= -f2-)
          [ -n "$LROOT" ] && [ -f "$LROOT/routes/web.php" ] || { echo "ERREUR: routes/web.php introuvable"; exit 1; }
          if [ -z "$HOMEFILE" ] || [ ! -f "$HOMEFILE" ]; then
            echo "Aucune home conservée à servir — le script garde sa page d'accueil. Rien à faire."; exit 0
          fi

          WEB="$LROOT/routes/web.php"
          [ -f "$WEB.bak-govibepay" ] || cp -a "$WEB" "$WEB.bak-govibepay"
          if grep -q 'GOVIBEPAY-LANDING-ROUTE' "$WEB"; then
            echo "Route déjà présente — mise à jour du chemin."
            sed -i "s#^// GOVIBEPAY-HOME-FILE=.*#// GOVIBEPAY-HOME-FILE=$HOMEFILE#" "$WEB"
          else
            cat >> "$WEB" <<EOPHP

          // GOVIBEPAY-LANDING-ROUTE — home publique de govibepay.com.
          // Sert la page d'accueil existante du domaine (design conservé tel quel).
          // Enregistrée en dernier : elle prend le pas sur la home d'origine du script.
          // GOVIBEPAY-HOME-FILE=$HOMEFILE
          Route::get('/', function () {
              \$f = '$HOMEFILE';
              if (! is_file(\$f)) {
                  abort(404);
              }
              ob_start();
              include \$f;

              return response(ob_get_clean());
          });
          EOPHP
          fi

          if ! php -l "$WEB" >/dev/null 2>&1; then
            echo "ERREUR: routes/web.php invalide — restauration immédiate"
            cp -a "$WEB.bak-govibepay" "$WEB"
            php -l "$WEB" && echo "(restauré)"
            exit 1
          fi
          ( cd "$LROOT" && php artisan route:clear >/dev/null 2>&1; php artisan view:clear >/dev/null 2>&1; php artisan config:clear >/dev/null 2>&1 ) || true
          echo "→ route '/' installée dans le script, servant : $HOMEFILE"
          curl -skS -m 12 -o /dev/null -w "  https://govibepay.com/ -> code=%{http_code}\n" -H "Host: govibepay.com" "https://127.0.0.1/" || true
          EOSSH

      # ------------------------------------------------------------------
      # BRAND — met le script à la marque GOVIBEPay.
      # ⚠️ Ne touche JAMAIS aux URLs (appdevs.net / appdevs.cloud / appdevsx /
      # qrpay.appdevs.net) : les réécrire casserait le chargement des assets.
      # Seules les mentions de marque VISIBLES sont remplacées.
      # ------------------------------------------------------------------
      - name: Brand (marque GOVIBEPay)
        if: ${{ inputs.mode == 'merge' || inputs.mode == 'brand' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          TS=$(date +%Y%m%d-%H%M%S)
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          BRAND="GOVIBEPay"

          LROOT=""
          [ -f "$MARK" ] && LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          if [ -z "$LROOT" ] || [ ! -d "$LROOT" ]; then
            for c in "$HOME/domains/app.govibepay.com/public_html" "$DOM/public_html/app" "$DOM/govibepay-app"; do
              if [ -f "$c/artisan" ]; then LROOT="$c"; break; fi
            done
          fi
          [ -n "$LROOT" ] && [ -d "$LROOT" ] || { echo "ERREUR: script introuvable."; exit 1; }
          echo "Script : $LROOT"

          # 1) .env — nom applicatif
          ENVF="$LROOT/.env"
          if [ -f "$ENVF" ]; then
            CUR=$(grep -E '^APP_NAME=' "$ENVF" | head -1)
            echo "APP_NAME actuel : ${CUR:-(absent)}"
            if echo "$CUR" | grep -qiE 'appdev'; then
              cp -a "$ENVF" "$ENVF.bak-brand-$TS"
              sed -i "s#^APP_NAME=.*#APP_NAME=\"$BRAND\"#" "$ENVF"
              echo "→ APP_NAME mis à $BRAND"
            else
              echo "→ APP_NAME ne contient pas « appdev » : laissé tel quel (pas de casse inutile)."
            fi
          fi

          # 2) Mentions VISIBLES de la marque éditeur, hors URLs et hors dossiers
          #    de sauvegarde (resourcesBBBB, resources.bak…).
          BK="$DOM/brand-backup-$TS"
          COUNT=0
          for zone in resources/views lang resources/lang; do
            Z="$LROOT/$zone"
            [ -d "$Z" ] || continue
            while IFS= read -r f; do
              case "$f" in *"/resources"[A-Z]*|*".bak/"*|*"/vendor/"*|*"/node_modules/"*) continue;; esac
              # lignes contenant une URL du fournisseur : on les saute entièrement
              grep -qiE 'appdevs\.(net|cloud)|appdevsx|cdn\.appdevs' "$f" && HASURL=1 || HASURL=0
              rel="${f#$LROOT/}"
              mkdir -p "$BK/$(dirname "$rel")"
              cp -a "$f" "$BK/$rel"
              if [ "$HASURL" = "1" ]; then
                # remplacement ligne par ligne en épargnant les lignes à URL
                awk -v b="$BRAND" '
                  /appdevs\.(net|cloud)|appdevsx|cdn\.appdevs/ { print; next }
                  { gsub(/AppDevs\.?/, b); gsub(/Appdevs/, b); gsub(/appdev/, b); print }
                ' "$f" > "$f.brandtmp" && mv "$f.brandtmp" "$f"
              else
                sed -i -e "s/AppDevs\./$BRAND/g" -e "s/AppDevs/$BRAND/g" -e "s/Appdevs/$BRAND/g" -e "s/appdev/$BRAND/g" "$f"
              fi
              case "$f" in
                *.php)
                  if ! php -l "$f" >/dev/null 2>&1; then
                    echo "!! $rel cassé — restauré"; cp -a "$BK/$rel" "$f"
                  fi
                  ;;
              esac
              COUNT=$((COUNT+1))
            done < <(grep -rIli --exclude-dir=node_modules --exclude-dir=vendor -e 'appdev' "$Z" 2>/dev/null)
          done
          echo "→ $COUNT fichier(s) modifié(s) ; sauvegarde : $BK"
          echo "   (les URLs appdevs.net / appdevs.cloud sont volontairement INTACTES :"
          echo "    les réécrire casserait le CSS/JS du script.)"

          ( cd "$LROOT" && php artisan view:clear >/dev/null 2>&1; php artisan config:clear >/dev/null 2>&1 ) || true
          echo ""
          echo "NOTE: le nom affiché du site vient souvent des Réglages en BASE DE DONNÉES"
          echo "(panneau admin → Settings / Site Name). S'il reste « appdev » quelque part,"
          echo "c'est là qu'il faut le changer."
          EOSSH

      # ------------------------------------------------------------------
      # ROLLBACK — remet tout dans l'état d'avant la fusion.
      # ------------------------------------------------------------------
      - name: Rollback
        if: ${{ inputs.mode == 'rollback' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOSSH'
          set -uo pipefail
          DOM="$HOME/domains/govibepay.com"
          MARK="$DOM/.govibepay-merge.meta"
          [ -f "$MARK" ] || { echo "ERREUR: aucun marqueur de fusion — rien à restaurer."; exit 1; }
          echo "=== Marqueur ==="; cat "$MARK"
          LROOT=$(grep '^lroot=' "$MARK" | cut -d= -f2-)
          PUB=$(grep '^pub=' "$MARK" | cut -d= -f2-)
          HOMEFILE=$(grep '^homefile=' "$MARK" | cut -d= -f2-)
          VDIR=$(grep '^vacated=' "$MARK" | cut -d= -f2-)
          BK=$(grep '^backup=' "$MARK" | cut -d= -f2-)

          # 1) home d'origine remise en index.php
          if [ -n "$BK" ] && [ -f "$BK/index.php" ]; then
            [ -n "$HOMEFILE" ] && [ -f "$HOMEFILE" ] && rm -f "$HOMEFILE"
            cp -a "$BK/index.php" "$PUB/index.php"
            echo "→ page d'accueil d'origine restaurée"
          elif [ -n "$BK" ] && [ -f "$BK/index.html" ]; then
            [ -n "$HOMEFILE" ] && [ -f "$HOMEFILE" ] && rm -f "$HOMEFILE"
            cp -a "$BK/index.html" "$PUB/index.html"
            rm -f "$PUB/index.php"
            echo "→ page d'accueil d'origine restaurée (index.html)"
          fi
          # 2) .htaccess racine
          if [ -n "$BK" ] && [ -f "$BK/.htaccess" ]; then cp -a "$BK/.htaccess" "$PUB/.htaccess"; echo "→ .htaccess racine restauré"; fi
          # 3) sous-domaine
          if [ -n "$VDIR" ] && [ -d "$VDIR" ]; then
            if [ -n "$BK" ] && [ -f "$BK/subdomain.htaccess" ]; then
              cp -a "$BK/subdomain.htaccess" "$VDIR/.htaccess"; echo "→ .htaccess du sous-domaine restauré"
            else
              rm -f "$VDIR/.htaccess"; echo "→ redirection du sous-domaine retirée"
            fi
          fi
          # 4) route '/' + marque dans le script
          if [ -n "$LROOT" ] && [ -d "$LROOT" ]; then
            if [ -f "$LROOT/routes/web.php.bak-govibepay" ]; then
              cp -a "$LROOT/routes/web.php.bak-govibepay" "$LROOT/routes/web.php"; echo "→ routes/web.php restauré"
            fi
            B=$(ls -dt "$DOM"/brand-backup-* 2>/dev/null | head -1)
            if [ -n "$B" ] && [ -d "$B" ]; then cp -a "$B/." "$LROOT/"; echo "→ marque restaurée depuis $B"; fi
            if [ -n "$BK" ] && [ -f "$BK/.env" ]; then cp -a "$BK/.env" "$LROOT/.env"; echo "→ .env restauré"; fi
            ( cd "$LROOT" && php artisan config:clear >/dev/null 2>&1; php artisan route:clear >/dev/null 2>&1; php artisan view:clear >/dev/null 2>&1 ) || true
          fi
          rm -f "$MARK"
          echo "=== Rollback OK ==="
          for H in govibepay.com app.govibepay.com; do
            curl -skS -m 12 -o /dev/null -w "  https://$H -> code=%{http_code}\n" -H "Host: $H" "https://127.0.0.1/" || true
          done
          EOSSH
