name: Diagnose TAGTOA VPS

# Bouton manuel SÛR (lecture + vidage de cache uniquement) :
#  - montre la vraie cause d'un 500 (tail du laravel.log, redacté) ;
#  - vide les caches config/routes/vues obsolètes (cause n°1 d'un 500 après
#    déplacement de l'app) ;
#  - NE touche JAMAIS la base de données, ne fait ni migrate ni rsync.
on:
  workflow_dispatch:
    inputs:
      clear_cache:
        description: "Vider les caches (config/routes/vues) + corriger les permissions storage"
        type: boolean
        default: true

concurrency:
  group: diagnose-tagtoa
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read log + clear cache (safe)
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Diagnose + clear cache
        env:
          CLEAR: ${{ inputs.clear_cache }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "CLEAR='$CLEAR' bash -s" <<'EOSSH'
          set -uo pipefail

          # 0) QUI/OÙ suis-je ? (le chemin domaine attendu était introuvable)
          echo "::group::Contexte SSH"
          echo "whoami : $(whoami)"; echo "HOME : $HOME"; echo "pwd : $(pwd)"
          echo "--- \$HOME ---"; ls -la "$HOME" 2>&1 | head -40
          echo "--- /home ---"; ls -la /home 2>&1 | head -40
          echo "::endgroup::"

          # 1) EXPLORER sous $HOME (/home global n'est pas lisible : le glob
          #    /home/*/domains échoue → c'est LA cause de « INTROUVABLE »).
          echo "::group::Domaines du compte ($HOME/domains)"
          ls -la "$HOME/domains" 2>&1 | head -40
          echo "::endgroup::"

          echo "::group::Structure de tagtoa.com"
          T="$HOME/domains/tagtoa.com"
          echo "== $T =="; ls -la "$T" 2>&1 | head -50
          echo "== $T/public_html =="; ls -la "$T/public_html" 2>&1 | head -60
          echo "== $T/laravel (si existe) =="; ls -la "$T/laravel" 2>&1 | head -50
          echo "== $T/public_html/laravel (si existe) =="; ls -la "$T/public_html/laravel" 2>&1 | head -50
          echo "::endgroup::"

          echo "::group::Recherche des fichiers ESSENTIELS sous tagtoa.com"
          echo "== artisan =="; ART=$(find "$T" -maxdepth 4 -type f -name artisan 2>/dev/null | head -10); echo "${ART:-aucun}"
          echo "== .env =="; find "$T" -maxdepth 4 -type f -name '.env' 2>/dev/null | head
          echo "== dossiers storage / bootstrap / vendor / Modules / public =="
          for dir in storage bootstrap vendor Modules public; do
            r=$(find "$T" -maxdepth 4 -type d -name "$dir" 2>/dev/null | head); echo "$dir: ${r:-ABSENT}"
          done
          echo "== index.php (docroot) =="; find "$T" -maxdepth 3 -name index.php 2>/dev/null | head
          echo "::endgroup::"

          # 2) Choisir l'app : artisan sous tagtoa.com en priorité.
          D="$T"
          L=""
          for c in "$D/laravel" "$D/public_html/laravel" "$D/public_html"; do
            [ -f "$c/artisan" ] && { L="$c"; break; }
          done
          if [ -z "$L" ]; then
            L=$(printf '%s\n' "$ART" | head -1 | xargs -r dirname)
          fi
          if [ -n "$L" ] && [ -d "$L" ]; then
            echo "::group::Arborescence de l'app trouvée : $L"
            ls -la "$L" 2>&1 | head -50
            echo "::endgroup::"
          fi
          if [ -z "$L" ] || [ ! -f "$L/artisan" ]; then
            echo "::warning::artisan introuvable — l'app Laravel n'est pas déployée correctement. Voir l'arborescence ci-dessus."
            echo "Diagnostic structurel terminé (pas d'app à inspecter plus loin)."
            exit 0
          fi
          echo "App Laravel : $L"

          echo "::group::Présence des clés .env (valeurs masquées)"
          ENVF="$L/.env"
          if [ -f "$ENVF" ]; then
            for k in APP_ENV APP_DEBUG APP_KEY APP_URL DB_CONNECTION DB_HOST DB_DATABASE DB_USERNAME DB_PASSWORD SESSION_DRIVER CACHE_DRIVER; do
              if grep -q "^$k=" "$ENVF"; then
                v=$(grep "^$k=" "$ENVF" | head -1 | cut -d= -f2-)
                case "$k" in
                  APP_KEY|DB_PASSWORD) [ -n "$v" ] && echo "$k = [présent]" || echo "$k = [VIDE ⚠]";;
                  *) echo "$k = $v";;
                esac
              else
                echo "$k = [absent ⚠]"
              fi
            done
          else
            echo "⚠ .env ABSENT à $ENVF"
          fi
          echo "::endgroup::"

          echo "::group::Permissions (storage / bootstrap/cache)"
          ls -ld "$L/storage" "$L/storage/logs" "$L/storage/framework/views" "$L/bootstrap/cache" 2>&1 || true
          echo "::endgroup::"

          echo "::group::Contenu bootstrap/cache (config/routes en cache = souvent la cause)"
          ls -la "$L/bootstrap/cache/" 2>&1 || true
          echo "::endgroup::"

          echo "::group::Menu sadmin (pour insérer un lien TAGTOA)"
          MENUF=$(grep -rilE 'Sell NFC Cards|WhatsApp Stores' "$L/resources/views" 2>/dev/null | head -1)
          echo "fichier menu: ${MENUF:-introuvable}"
          if [ -n "$MENUF" ]; then
            echo "-- extrait (lignes autour de 'Dashboard' / 'vCards') --"
            grep -nE "Dashboard|vCards|Sell NFC|route\(|href=|menu-item|<li|nav-link" "$MENUF" | head -40
          fi
          echo "::endgroup::"

          echo "::group::Vues login / marque (rebranding TAGTOA)"
          echo "== fichiers de vues login/auth =="
          find "$L/resources/views" -maxdepth 3 -iregex '.*\(login\|auth\).*\.blade\.php' 2>/dev/null | head -20
          echo "== vues contenant l'ancienne marque (biztap) =="
          grep -rilo 'biztap' "$L/resources/views" 2>/dev/null | head -30
          echo "== route(s) login (web.php) =="
          grep -nE "login|Login" "$L/routes/web.php" 2>/dev/null | head -10
          echo "== auth/login.blade.php (COMPLET) =="
          cat "$L/resources/views/auth/login.blade.php" 2>/dev/null || echo "absent"
          echo "::endgroup::"

          echo "::group::INSCRIPTION (register) — champs attendus"
          echo "== fichiers register (vues) =="
          find "$L/resources/views" -maxdepth 4 -iname 'register*.blade.php' 2>/dev/null | head
          echo "== champs name= dans register.blade.php =="
          RV=$(find "$L/resources/views" -maxdepth 4 -iname 'register.blade.php' 2>/dev/null | head -1)
          echo "fichier: ${RV:-introuvable}"
          [ -n "$RV" ] && grep -oE 'name="[^"]+"' "$RV" | sort -u
          echo "== register.blade.php (COMPLET, pour override fidèle) =="
          [ -n "$RV" ] && cat "$RV" 2>/dev/null || echo "absent"
          echo "== route(s) register (web.php) =="
          grep -nE "register|Register" "$L/routes/web.php" 2>/dev/null | head -10
          echo "== RegisterController (règles de validation) =="
          RC=$(find "$L/app" -iname 'RegisterController.php' 2>/dev/null | head -1)
          echo "fichier: ${RC:-introuvable}"
          [ -n "$RC" ] && sed -n '1,140p' "$RC" | grep -nE "required|rules|validator|redirectTo|create\(|'name'|'email'|'first_name'|'last_name'|'username'|'phone'|'mobile'|'password'" | head -40
          echo "::endgroup::"

          echo "::group::vCARD — tableau de bord & routes (pour lien sidebar)"
          echo "== routes contenant vcard/dashboard/create (web.php) =="
          grep -nE "vcard|Vcard|VCard|dashboard|create-vcard|user/dashboard" "$L/routes/web.php" 2>/dev/null | head -30
          echo "== RouteServiceProvider HOME =="
          grep -rnE "const HOME|public const HOME|protected \\\$redirectTo|redirectTo =" "$L/app/Providers" 2>/dev/null | head
          echo "::endgroup::"

          echo "::group::INSPECTION Biztap core — heroicons + HomeController (lecture seule)"
          echo "== config/blade-icons.php (app) =="
          if [ -f "$L/config/blade-icons.php" ]; then
            cat "$L/config/blade-icons.php"
          else
            echo "absent (pas publié — config par défaut du vendor utilisée)"
          fi
          echo "== vendor blade-ui-kit/blade-icons — config par défaut =="
          find "$L/vendor/blade-ui-kit" -maxdepth 3 -iname "blade-icons.php" 2>/dev/null | while read -r f; do
            echo "-- $f --"; cat "$f"
          done
          echo "== versions installées (composer.lock) =="
          php -r '
            $j=json_decode(file_get_contents("'"$L"'/composer.lock"),true);
            foreach (($j["packages"] ?? []) as $p) {
              if (in_array($p["name"], ["blade-ui-kit/blade-icons","livewire/livewire","livewire/flux","livewire/flux-pro"])) {
                echo $p["name"]." => ".$p["version"]."\n";
              }
            }
          ' 2>&1
          echo "== où heroicons est référencé (config app + Modules) =="
          grep -rniE "heroicon" "$L/config" "$L/app" 2>/dev/null | grep -v "vendor/" | head -20
          echo "== HomeController.php autour de la ligne 298 =="
          if [ -f "$L/app/Http/Controllers/HomeController.php" ]; then
            sed -n '270,320p' "$L/app/Http/Controllers/HomeController.php"
          else
            echo "absent"
          fi
          echo "::endgroup::"

          echo "::group::PERFORMANCE — charge serveur, timing HTTP, drivers, taille des logs"
          echo "== uptime / charge / mémoire =="
          uptime 2>&1 || true
          free -h 2>&1 || true
          echo "== espace disque =="
          df -h "$L" 2>&1 || true
          echo "== TOP processus par %CPU (visibles par cet utilisateur) =="
          ps -u "$(whoami)" -o pid,pcpu,pmem,etime,cmd --sort=-pcpu 2>&1 | head -20 || ps aux --sort=-%cpu 2>&1 | head -20
          echo "== TOP processus par %CPU (tout le système, si visible) =="
          ps aux --sort=-%cpu 2>&1 | head -15 || echo "non lisible (permissions)"
          echo "== crontab utilisateur (tâches planifiées) =="
          crontab -l 2>&1 || echo "aucun crontab / non lisible"
          echo "== requêtes MySQL actives (si permission) =="
          ( cd "$L" && timeout 10 php artisan tinker --execute="print_r(DB::select('SHOW PROCESSLIST'));" 2>&1 | head -40 ) || echo "processlist non accessible"
          echo "== timing HTTP réel (depuis le VPS, boucle locale) =="
          for u in "https://tagtoa.com/login" "https://tagtoa.com/"; do
            echo "-- $u --"
            curl -s -o /dev/null -w "  http_code=%{http_code}  time_connect=%{time_connect}s  time_starttransfer=%{time_starttransfer}s  time_total=%{time_total}s\n" \
              --max-time 30 "$u" 2>&1 || echo "  curl a échoué"
          done
          echo "== drivers session/cache/queue (config app) =="
          grep -nE "SESSION_DRIVER|CACHE_STORE|CACHE_DRIVER|QUEUE_CONNECTION|DB_CONNECTION" "$L/.env" 2>/dev/null \
            | sed -E 's/(PASSWORD|SECRET)([=][^ ]*)?//gi'
          echo "== taille laravel.log =="
          du -sh "$L/storage/logs/laravel.log" 2>&1 || echo "absent"
          echo "== fichier de maintenance actif ? (artisan down) =="
          [ -f "$L/storage/framework/down" ] && echo "⚠ SITE EN MAINTENANCE (storage/framework/down présent)" || echo "pas en maintenance"
          echo "== processus PHP-FPM (nombre) =="
          pgrep -c php-fpm 2>/dev/null || pgrep -c php 2>/dev/null || echo "n/a (non lisible depuis cet utilisateur)"
          echo "== test connexion DB (sans exposer credentials) =="
          ( cd "$L" && timeout 15 php artisan db:show 2>&1 | head -20 ) || echo "échec/timeout db:show"
          echo "::endgroup::"

          echo "::group::RECHERCHE — appel réseau sortant sans timeout sur CHAQUE requête (middleware global / providers / licence)"
          echo "== middleware global (app/Http/Kernel.php) — tableau \$middleware (appliqué à TOUTE requête) =="
          if [ -f "$L/app/Http/Kernel.php" ]; then
            awk '/protected \$middleware *=/{p=1} p{print} p && /\];/{exit}' "$L/app/Http/Kernel.php"
          else
            echo "app/Http/Kernel.php absent (Laravel 11+ ? vérifier bootstrap/app.php)"
            [ -f "$L/bootstrap/app.php" ] && grep -n "middleware" "$L/bootstrap/app.php" | head -20
          fi
          echo "== recherche mots-clés licence/activation/purchase/envato dans app/ (hors vendor) =="
          grep -rniE "purchase[_ ]?code|envato|license|licence|activation" "$L/app" --include="*.php" -l 2>/dev/null | head -20 || echo "aucun fichier"
          echo "== détail des correspondances (contexte) =="
          grep -rniE "purchase[_ ]?code|envato|license|licence|activation" "$L/app" --include="*.php" -B1 -A3 2>/dev/null | head -150 || true
          echo "== appels Http::/curl_exec/file_get_contents(http) dans app/Providers et app/Http/Middleware SANS 'timeout' visible à proximité =="
          for f in "$L"/app/Providers/*.php "$L"/app/Http/Middleware/*.php; do
            [ -f "$f" ] || continue
            if grep -qE "Http::|curl_exec|file_get_contents\(['\"]https?:" "$f"; then
              echo "-- $f --"
              grep -nE "Http::|curl_exec|file_get_contents\(['\"]https?:|timeout" "$f"
            fi
          done
          echo "::endgroup::"

          echo "::group::CHARGE RÉELLE — cœurs CPU, opcache, volume de trafic (bug en boucle vs simple surcharge)"
          echo "== nombre de cœurs CPU (VPS) =="
          nproc 2>&1 || echo "n/a"
          echo "== opcache activé ? (recompiler PHP à chaque requête = très coûteux si non) =="
          php -i 2>/dev/null | grep -iE "^opcache.enable|^opcache.enable_cli" || echo "opcache: info non disponible via php -i"
          echo "== connexions actives sur le port 443 (nombre) =="
          ( command -v ss >/dev/null && ss -tn state established '( dport = :443 or sport = :443 )' 2>&1 | wc -l ) \
            || ( command -v netstat >/dev/null && netstat -tn 2>&1 | grep -c ':443' ) \
            || echo "ss/netstat non disponibles"
          echo "== pool PHP-FPM : pm.max_children (combien de travailleurs simultanés autorisés) =="
          for pc in "$HOME/etc/php83/php-fpm.d/"*.conf "$HOME/etc/php"*/php-fpm.d/*.conf /etc/php*/fpm/pool.d/*.conf /usr/local/php*/etc/php-fpm.d/*.conf; do
            [ -f "$pc" ] || continue
            if grep -q "^pm.max_children\|^pm =" "$pc" 2>/dev/null; then
              echo "-- $pc --"
              grep -E "^pm( |\.|=)" "$pc" 2>/dev/null
            fi
          done
          echo "== caches Laravel (config/route/view) — évite de recompiler à chaque requête =="
          for c in bootstrap/cache/config.php bootstrap/cache/routes-v7.php bootstrap/cache/packages.php bootstrap/cache/services.php; do
            if [ -f "$L/$c" ]; then
              echo "  $c : présent ($(stat -c '%y' "$L/$c" 2>/dev/null || echo '?'))"
            else
              echo "  $c : ABSENT (pas caché — recompile à chaque requête)"
            fi
          done
          ( cd "$L" && ls storage/framework/views/*.php 2>/dev/null | wc -l | xargs -I{} echo "  vues Blade compilées en cache: {}" ) || true
          echo "== log d'accès webserver le plus récent (taille + dernières lignes, si lisible) =="
          for cand in "$HOME/domains/tagtoa.com/logs/access.log" "$HOME/domains/tagtoa.com/logs/"*.log "$HOME/access-logs/tagtoa.com"* /var/log/httpd/access_log /var/log/apache2/access.log /var/log/nginx/access.log; do
            [ -f "$cand" ] || continue
            echo "-- $cand --"
            ls -la "$cand" 2>&1
            wc -l "$cand" 2>&1
            echo "  dernières requêtes :"
            tail -20 "$cand" 2>&1
            echo "  volume par minute (dernières lignes horodatées, top 5 minutes) :"
            tail -2000 "$cand" 2>/dev/null | grep -oE '\[[0-9]{2}/[A-Za-z]{3}/[0-9]{4}:[0-9]{2}:[0-9]{2}' | sort | uniq -c | sort -rn | head -5
            echo "  top 10 IP (dernières 2000 lignes) :"
            tail -2000 "$cand" 2>/dev/null | awk '{print $1}' | sort | uniq -c | sort -rn | head -10
            echo "  top 10 routes demandées (dernières 2000 lignes) :"
            tail -2000 "$cand" 2>/dev/null | awk -F'"' '{print $2}' | awk '{print $2}' | sort | uniq -c | sort -rn | head -10
            break
          done
          echo "::endgroup::"

          echo "::group::laravel.log — messages d'ERREUR (secrets redactés)"
          LOG="$L/storage/logs/laravel.log"
          if [ -f "$LOG" ]; then
            echo "--- 8 derniers messages ERROR/CRITICAL (classe + message + fichier:ligne) ---"
            grep -aE '\.(ERROR|CRITICAL|EMERGENCY):' "$LOG" | tail -8 | cut -c1-500 \
              | sed -E 's/(password|pwd|secret|token|DB_PASSWORD)([=" :]+)[^ "]+/\1\2[REDACTED]/gi'
            echo "--- 12 dernières lignes brutes ---"
            tail -12 "$LOG" | cut -c1-400 \
              | sed -E 's/(password|pwd|secret|token|DB_PASSWORD)([=" :]+)[^ "]+/\1\2[REDACTED]/gi'
          else
            echo "pas de laravel.log"
          fi
          echo "::endgroup::"

          if [ "${CLEAR:-false}" = "true" ]; then
            echo "::group::Réparations (sûr, sans DB)"

            # URGENCE : libère les workers PHP-FPM bloqués depuis > 180s (une requête
            # web normale finit en quelques secondes ; un worker qui tourne des minutes
            # est bloqué — probablement un appel HTTP sortant sans timeout, ex. Twilio).
            # Ne tue QUE les processus php-fpm APPARTENANT à cet utilisateur, avec
            # SIGTERM (arrêt propre) ; PHP-FPM respawn automatiquement un worker neuf.
            echo "-- nettoyage workers PHP-FPM bloqués (running > 180s) --"
            ps -u "$(whoami)" -o pid=,etimes=,cmd= 2>/dev/null | while read -r pid etimes cmd; do
              case "$cmd" in
                *php-fpm*)
                  if [ "${etimes:-0}" -gt 180 ] 2>/dev/null; then
                    echo "  kill -TERM $pid (bloqué depuis ${etimes}s)"
                    kill -TERM "$pid" 2>/dev/null || true
                  fi
                  ;;
              esac
            done
            sleep 2
            echo "-- workers PHP-FPM restants (après nettoyage) --"
            ps -u "$(whoami)" -o pid,etimes,stat,cmd 2>/dev/null | grep php-fpm | head -20 || true

            # FIX « Attempt to read property "status" on null » (HomeController.php:298,
            # ForntBlogShow) : Blog::where('slug',...)->first() retourne null pour un
            # slug inconnu, puis $blog->status plante avant le abort(404). Patch d'UNE
            # LIGNE, versionné par backup .bak, validé par `php -l` AVANT application
            # (jamais de fichier cassé) — pas de composer/artisan, redéployable à volonté.
            HC="$L/app/Http/Controllers/HomeController.php"
            if [ -f "$HC" ] && grep -qF 'if (!$blog->status) {' "$HC"; then
              cp "$HC" "$HC.bak.$(date +%Y%m%d%H%M%S)"
              sed -i 's/if (!\$blog->status) {/if (!\$blog || !\$blog->status) {/' "$HC"
              if php -l "$HC" >/dev/null 2>&1; then
                echo "FIX_OK: HomeController.php:ForntBlogShow — garde null ajoutée"
              else
                echo "FIX_FAIL: syntaxe invalide après patch — restauration du .bak"
                cp "$HC.bak."* "$HC" 2>/dev/null || true
              fi
            else
              echo "HomeController.php : ligne cible absente (déjà patché ou code différent) — rien à faire"
            fi

            # FIX 500 « Mix manifest not found » : mix() cherche le manifeste dans
            # laravel/public/ mais les assets buildés sont dans public_html/ (docroot).
            # On relie le manifeste ET les dossiers d'assets manquants vers public_html.
            PH="$(dirname "$L")/public_html"
            if [ -d "$PH" ]; then
              [ -d "$L/public" ] || mkdir -p "$L/public"
              if [ ! -e "$L/public/mix-manifest.json" ] && [ -f "$PH/mix-manifest.json" ]; then
                ln -s "$PH/mix-manifest.json" "$L/public/mix-manifest.json" 2>/dev/null \
                  && echo "mix-manifest.json relié → public_html" \
                  || { cp "$PH/mix-manifest.json" "$L/public/" && echo "mix-manifest.json copié"; }
              else
                echo "mix-manifest.json : déjà présent ou source absente"
              fi
              # Relie les dossiers d'assets référencés par mix() (au cas où mix() vérifie le fichier).
              for a in css js fonts img images assets build web front vendor; do
                if [ -e "$PH/$a" ] && [ ! -e "$L/public/$a" ]; then
                  ln -s "$PH/$a" "$L/public/$a" 2>/dev/null && echo "lien public/$a → public_html/$a" || true
                fi
              done
            else
              echo "public_html introuvable à $PH"
            fi

            echo "-- vidage cache --"
            rm -f "$L/bootstrap/cache/"*.php 2>/dev/null && echo "bootstrap/cache/*.php supprimés" || true
            rm -f "$L/storage/framework/views/"*.php 2>/dev/null && echo "vues compilées supprimées" || true
            ( cd "$L" && php artisan optimize:clear 2>&1 ) || true
            chmod -R ug+rwX "$L/storage" "$L/bootstrap/cache" 2>/dev/null && echo "permissions storage/bootstrap corrigées" || true
            # Accélération prod : met le config + vues en cache (évite de relire
            # ~30 fichiers config + .env à CHAQUE requête → dashboard plus rapide).
            # (pas de route:cache : Biztap peut avoir des routes en closure.)
            echo "-- optimisation (config + vues en cache) --"
            ( cd "$L" && php artisan config:cache 2>&1 ) || true
            ( cd "$L" && php artisan view:cache 2>&1 ) || true
            echo "::endgroup::"
            echo "→ Rechargez https://tagtoa.com/login"
          fi
          EOSSH
