name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tagtoa:
    name: TAGTOA module — lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          # 8.3 : les dépendances de l'app (PHPUnit 12, Laravel récent) l'exigent.
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: PHP syntax lint (all module files)
        run: |
          set -e
          find Modules/Tagtoa -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          echo "✓ Aucun erreur de syntaxe PHP."

      - name: Validate module composer.json
        run: composer validate Modules/Tagtoa/composer.json --no-check-publish

      - name: Install dev tools (phpunit)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Unit tests (pure logic TAGTOA)
        # La racine appartient à l'app GOVIBE (phpunit.xml + tests/Unit à elle).
        # On cible explicitement la suite TAGTOA avec son bootstrap pur, en
        # ignorant la configuration racine (--no-configuration).
        run: vendor/bin/phpunit --no-configuration --bootstrap tests/bootstrap.php --testdox Modules/Tagtoa/tests/Unit

  tagtoa-integration:
    name: TAGTOA module — tests d'intégration (DB réelle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
          extensions: sqlite3, pdo_sqlite

      - name: Install module deps (Orchestra Testbench — hôte Laravel isolé)
        working-directory: Modules/Tagtoa
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: "Integration tests (DB SQLite réelle : wallet ledger, POS, loyalty)"
        # tests/TestCase.php boot un hôte Laravel minimal (Orchestra Testbench)
        # et charge SEULEMENT les migrations TAGTOA (autonomes, aucune FK vers
        # le cœur Biztap absent de ce dépôt). Vérifie l'intégration DB réelle :
        # double-entry, idempotence, verrous, soldes — pas seulement la logique pure.
        working-directory: Modules/Tagtoa
        run: vendor/bin/phpunit --testdox tests/Feature

  # ── GOVIBE ────────────────────────────────────────────────────────────────
  # Jusqu'ici, « CI » ne contenait que les deux travaux TAGTOA : la suite de
  # l'application GOVIBE — vitrine, ERP, portail, paiements, abonnements — n'a
  # jamais été exécutée ici. Une coche verte disait donc « TAGTOA va bien »
  # pendant qu'une régression GOVIBE passait sans être vue.
  #
  # phpunit.xml porte déjà tout ce qu'il faut (APP_KEY de test, SQLite en
  # mémoire) : rien à configurer ici, et aucune base à monter.
  govibe:
    name: GOVIBE — tests + style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
          extensions: sqlite3, pdo_sqlite

      - name: Install deps
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Tests (vitrine, ERP, portail, paiements, abonnements)
        run: php artisan test

      # Seuls les fichiers de CETTE modification sont contrôlés : le dépôt porte
      # un historique de styles différents, et exiger le dépôt entier rendrait ce
      # travail rouge en permanence pour des fichiers que personne n'a touchés.
      #
      # Et non « pint --dirty », qui compare l'arbre de travail à HEAD : dans CI
      # l'arbre est propre, donc --dirty ne contrôlerait jamais rien tout en
      # affichant du vert. La comparaison se fait contre la branche de base.
      - name: Style des fichiers de cette modification
        run: |
          set -uo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Aucune base de comparaison (premier envoi de la branche) — rien à contrôler."
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || git fetch --no-tags origin
          FICHIERS=$(git diff --name-only --diff-filter=d "$BASE"...HEAD -- '*.php' \
                     | grep -v '^Modules/Tagtoa/' || true)

          if [ -z "$FICHIERS" ]; then
            echo "Aucun fichier PHP GOVIBE modifié."
            exit 0
          fi

          echo "$FICHIERS" | sed 's/^/  /'
          # shellcheck disable=SC2086
          vendor/bin/pint --test $FICHIERS
