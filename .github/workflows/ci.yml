name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tagtoa:
    name: TAGTOA module — lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          # 8.3 : les dépendances de l'app (PHPUnit 12, Laravel récent) l'exigent.
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: PHP syntax lint (all module files)
        run: |
          set -e
          find Modules/Tagtoa -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          echo "✓ Aucun erreur de syntaxe PHP."

      - name: Validate module composer.json
        run: composer validate Modules/Tagtoa/composer.json --no-check-publish

      - name: Install dev tools (phpunit)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Unit tests (pure logic TAGTOA)
        # La racine appartient à l'app GOVIBE (phpunit.xml + tests/Unit à elle).
        # On cible explicitement la suite TAGTOA avec son bootstrap pur, en
        # ignorant la configuration racine (--no-configuration).
        run: vendor/bin/phpunit --no-configuration --bootstrap tests/bootstrap.php --testdox Modules/Tagtoa/tests/Unit

  tagtoa-integration:
    name: TAGTOA module — tests d'intégration (DB réelle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
          extensions: sqlite3, pdo_sqlite

      - name: Install module deps (Orchestra Testbench — hôte Laravel isolé)
        working-directory: Modules/Tagtoa
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: "Integration tests (DB SQLite réelle : wallet ledger, POS, loyalty)"
        # tests/TestCase.php boot un hôte Laravel minimal (Orchestra Testbench)
        # et charge SEULEMENT les migrations TAGTOA (autonomes, aucune FK vers
        # le cœur Biztap absent de ce dépôt). Vérifie l'intégration DB réelle :
        # double-entry, idempotence, verrous, soldes — pas seulement la logique pure.
        working-directory: Modules/Tagtoa
        run: vendor/bin/phpunit --testdox tests/Feature
