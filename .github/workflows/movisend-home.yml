name: MoviSend — Diagnostic & déploiement (demomovisend.govibeht.com)

# demomovisend.govibeht.com vit sur le MÊME VPS que tagtoa.com et govibeht.com,
# juste un autre dossier de domaine. On réutilise les secrets SSH déjà en place
# (VPS_HOST/VPS_USER/VPS_SSH_KEY/VPS_PORT) — aucun nouveau secret requis.
#
# L'app déployée est un produit Laravel (CodeCanyon "Remito — Online Money
# Transfer Solution") qu'on rebrande en MoviSend. Ce workflow est LECTURE
# SEULE sauf pour mode=deploy_file.
#
# mode=diagnose      : localise le docroot, liste son contenu.
# mode=explore       : arborescence resources/views (2 niveaux), routes/web.php,
#                       occurrences de "Remito"/"remito" (CHEMINS seulement),
#                       ligne 'name' de config/app.php.
# mode=fetch_file     : récupère UN fichier (chemin relatif au docroot, via
#                       relative_path) comme artefact — jamais affiché dans le
#                       log (évite la corruption par le masquage de secrets).
# mode=deploy_file    : publie un fichier local du dépôt (deploy_local_path)
#                       vers un chemin relatif distant (deploy_remote_path),
#                       avec sauvegarde horodatée de l'ancien fichier.
# mode=snapshot        : PAS de SSH — le runner GitHub (qui a un accès internet
#                       normal, contrairement à cette session Claude dont le
#                       proxy réseau bloque demomovisend.govibeht.com) télécharge
#                       la page d'accueil PUBLIQUE en direct et l'imprime en
#                       base64 dans le log, pour voir le HTML réellement rendu
#                       (contenu dynamique du page-builder déjà résolu).
# mode=fix_cta_links   : corrige EXACTEMENT deux boutons (hero "Open an Account"
#                       et cta "Register Now") qui pointent vers le domaine du
#                       vendeur CodeCanyon (remit.bugfinder.app /
#                       remito.bugfinder.app) au lieu du site lui-même. Déploie
#                       tools/movisend/FixCtaLinks.php comme commande artisan
#                       temporaire, l'exécute (Eloquent, jamais de SQL brut ;
#                       n'écrit QUE si la valeur contient "bugfinder.app",
#                       affiche avant/après), puis la retire du serveur.
#                       (v1 utilisait `php artisan tinker fichier.php` — PsySH
#                       ne digère pas ce mode d'exécution sans TTY ; d'où la
#                       vraie commande artisan à la place.)
# mode=rebrand         : remplace les mentions restantes de "Remito"/"Remitta"
#                       par "MoviSend". BasicControl.site_title (un seul
#                       champ, mis en cache sous 'ConfigureSetting') alimente
#                       le <title>, meta author, og:site_name, l'alt du logo
#                       et le copyright du footer — tous corrigés d'un coup.
#                       Page (slug '/').page_title/meta_title/
#                       meta_description/og_description/meta_keywords sont
#                       aussi corrigés. Même mécanique que fix_cta_links :
#                       déploie tools/movisend/RebrandToMovisend.php comme
#                       commande artisan temporaire, l'exécute (Eloquent,
#                       jamais de SQL brut ; n'écrit QUE si "Remito"/"Remitta"
#                       est trouvé, affiche avant/après), puis la retire.
# mode=repair_overcorrection : la 1ère exécution de mode=rebrand avait un bug
#                       (str_ireplace au lieu d'un remplacement à limite de
#                       mot) : "Remitta" matchait aussi comme SOUS-CHAÎNE du
#                       mot générique "remittance" ("Remitta"+"nce"), donc
#                       "remittance"/"Remittance" est devenu "MoviSendnce"
#                       dans les champs SEO de la Page d'accueil. Ce mode
#                       déploie tools/movisend/RepairMetaOvercorrection.php,
#                       qui restaure le texte exact d'origine (seul "Remito"
#                       remplacé, "remittance" intact), puis se retire.
#                       movisend:rebrand est corrigé (limite de mot) pour que
#                       ça ne puisse plus se reproduire.
# mode=mobile_check    : PAS de SSH — comme mode=snapshot, mais au lieu de lire
#                       le HTML brut, ouvre la page publique dans un vrai
#                       Chromium (Playwright, installé sur le runner) à une
#                       largeur de téléphone (375x812), après le chargement
#                       COMPLET de la cascade CSS (tous les @import résolus).
#                       Mesure la taille de police RÉELLEMENT calculée
#                       (getComputedStyle) de .hero-title, .common-title h3,
#                       h1/h2/h3 et .breadcrumbs-content h4, et prend une
#                       capture d'écran — pour vérifier que les media queries
#                       ajoutées dans 01-global.css (PR #179) ne sont pas
#                       neutralisées par une règle plus tardive dans la
#                       cascade (ex. responsive.css, importé après
#                       01-global.css dans style.css).
# mode=rebrand_content : étend le même rebrand à limite de mot (voir
#                       RebrandToMovisend::rebrand()) au reste du contenu
#                       piloté par la base : Content.media, ContentDetails
#                       .description (sections "Why People Choose Remitta",
#                       "Business Already Running on Remitta", etc.), et
#                       Blog.title/slug/meta_title/meta_description/
#                       meta_keywords + le corps des articles (BlogDetails,
#                       parcouru génériquement colonne par colonne — le nom
#                       exact de la colonne n'est pas supposé). Déploie
#                       tools/movisend/RebrandContentAndBlog.php comme
#                       commande artisan temporaire, l'exécute (Eloquent,
#                       jamais de SQL brut ; n'écrit QUE si "Remito"/
#                       "Remitta" est trouvé À LIMITE DE MOT — ne touche
#                       jamais "remittance" —, affiche avant/après), puis
#                       la retire.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnose | explore | fetch_file | deploy_file | snapshot | mobile_check | fix_cta_links | rebrand | repair_overcorrection | rebrand_content"
        type: choice
        options: [diagnose, explore, fetch_file, deploy_file, snapshot, mobile_check, fix_cta_links, rebrand, repair_overcorrection, rebrand_content]
        default: diagnose
      relative_path:
        description: "fetch_file : chemin relatif au docroot du fichier à récupérer"
        type: string
        default: ""
      deploy_local_path:
        description: "deploy_file : chemin LOCAL (dans ce dépôt) du fichier à publier"
        type: string
        default: ""
      deploy_remote_path:
        description: "deploy_file : chemin RELATIF au docroot où publier le fichier"
        type: string
        default: ""

concurrency:
  group: movisend-home
  cancel-in-progress: false

jobs:
  run:
    name: SSH VPS — ${{ inputs.mode }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        if: ${{ inputs.mode != 'snapshot' && inputs.mode != 'mobile_check' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Resolve docroot
        id: docroot
        if: ${{ inputs.mode != 'snapshot' && inputs.mode != 'mobile_check' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          D=$(ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'ls -d /home/*/domains/demomovisend.govibeht.com "$HOME"/domains/demomovisend.govibeht.com 2>/dev/null | head -1')
          [ -n "$D" ] || { echo "::error::Dossier de domaine introuvable."; exit 1; }
          PUB=$(ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "[ -d '$D/public_html' ] && echo '$D/public_html' || echo '$D'")
          echo "docroot résolu: $PUB"
          echo "path=$PUB" >> "$GITHUB_OUTPUT"

      - name: Diagnose (lecture seule)
        if: ${{ inputs.mode == 'diagnose' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          PUB="${{ steps.docroot.outputs.path }}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "PUB='$PUB' bash -s" <<'EOSSH'
          set -uo pipefail
          echo "::group::Contenu docroot ($PUB)"
          ls -la "$PUB" 2>/dev/null
          echo "::endgroup::"
          for f in index.html index.php home.html home.php; do
            if [ -f "$PUB/$f" ]; then
              echo "::group::Contenu de $PUB/$f"
              cat "$PUB/$f"
              echo "::endgroup::"
            fi
          done
          EOSSH

      - name: Explore (lecture seule — structure de l'app)
        if: ${{ inputs.mode == 'explore' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          PUB="${{ steps.docroot.outputs.path }}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "PUB='$PUB' bash -s" <<'EOSSH'
          set -uo pipefail
          echo "::group::config/app.php — 'name' (branding actuel)"
          grep -n "'name'" "$PUB/config/app.php" 2>/dev/null | head -3
          echo "::endgroup::"

          echo "::group::.env — APP_NAME (valeur non sensible)"
          grep -E "^APP_NAME=" "$PUB/.env" 2>/dev/null
          echo "::endgroup::"

          echo "::group::routes/web.php (routes publiques)"
          cat "$PUB/routes/web.php" 2>/dev/null | head -200
          echo "::endgroup::"

          echo "::group::Arborescence resources/views/themes/light (6 niveaux — thème public)"
          find "$PUB/resources/views/themes/light" -maxdepth 6 2>/dev/null | sed "s|^$PUB/||" | sort
          echo "::endgroup::"

          echo "::group::Arborescence assets/ (CSS/JS/images du thème, 3 niveaux, sans vendor/node_modules)"
          find "$PUB/assets" -maxdepth 3 -not -path "*/vendor/*" -not -path "*/node_modules/*" 2>/dev/null | sed "s|^$PUB/||" | sort
          echo "::endgroup::"

          echo "::group::Occurrences de 'remito' (CHEMINS seulement, jamais le contenu)"
          grep -rli "remito" "$PUB/resources" "$PUB/config" "$PUB/assets" "$PUB/routes" "$PUB/README.md" "$PUB/composer.json" 2>/dev/null \
            | grep -v "/vendor/" | sed "s|^$PUB/||" | sort
          echo "::endgroup::"

          echo "::group::Modèles/contrôleurs touchant 'button_url' ou 'hero' (code source, pas de données)"
          grep -rn "button_url" "$PUB/app" 2>/dev/null | sed "s|^$PUB/||"
          echo "--"
          find "$PUB/app/Models" -iname "*hero*" -o -iname "*content*" -o -iname "*media*" 2>/dev/null | sed "s|^$PUB/||" | sort
          echo "--"
          grep -rln "hero" "$PUB/app/Http/Controllers" 2>/dev/null | sed "s|^$PUB/||" | sort
          echo "::endgroup::"

          echo "::group::Fichiers contenant \$hero = ou compact('hero' dans app/ (chemins + ligne)"
          grep -rn "hero *=\|compact([^)]*hero\|'hero'\]" "$PUB/app" --include=*.php 2>/dev/null | sed "s|^$PUB/||" | head -60
          echo "::endgroup::"

          echo "::group::Fonctions/traits/helpers mentionnant Content:: n'importe où dans app/"
          grep -rln "Content::" "$PUB/app" --include=*.php 2>/dev/null | sed "s|^$PUB/||" | sort
          echo "::endgroup::"

          echo "::group::composer.json — fichiers 'files' autoload (helpers globaux)"
          grep -n -A5 '"files"' "$PUB/composer.json" 2>/dev/null
          echo "::endgroup::"
          EOSSH

      - name: Fetch file (artefact — jamais affiché dans le log)
        if: ${{ inputs.mode == 'fetch_file' && inputs.relative_path != '' }}
        env:
          RELATIVE_PATH: ${{ inputs.relative_path }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          PUB="${{ steps.docroot.outputs.path }}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "PUB='$PUB' RP='$RELATIVE_PATH' bash -s" <<'EOSSH' > fetched-file
          cat "$PUB/$RP"
          EOSSH

      - name: Upload fetched file as artifact
        if: ${{ inputs.mode == 'fetch_file' && inputs.relative_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fetched-file
          path: fetched-file
          retention-days: 1

      - name: Print fetched file to log (base64 — évite toute corruption par le masquage de secrets)
        if: ${{ inputs.mode == 'fetch_file' && inputs.relative_path != '' }}
        run: |
          echo "::group::fetched-file (base64)"
          base64 -w0 fetched-file
          echo ""
          echo "::endgroup::"

      - name: Deploy file (publie + sauvegarde l'ancien)
        if: ${{ inputs.mode == 'deploy_file' && inputs.deploy_local_path != '' && inputs.deploy_remote_path != '' }}
        env:
          REMOTE_PATH: ${{ inputs.deploy_remote_path }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          PUB="${{ steps.docroot.outputs.path }}"
          scp -i ~/.ssh/id_deploy -P "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ inputs.deploy_local_path }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/movisend-deploy-upload"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "PUB='$PUB' RP='$REMOTE_PATH' bash -s" <<'EOSSH'
          set -uo pipefail
          TARGET="$PUB/$RP"
          mkdir -p "$(dirname "$TARGET")"
          [ -f "$TARGET" ] && cp "$TARGET" "$TARGET.bak.$(date +%Y%m%d%H%M%S)" || true
          mv /tmp/movisend-deploy-upload "$TARGET"
          echo "Déployé: $TARGET"
          EOSSH

      - name: Snapshot (page publique en direct — aucun SSH, aucun secret)
        if: ${{ inputs.mode == 'snapshot' }}
        run: |
          set -uo pipefail
          echo "::group::HTTP headers"
          curl -sS -D - -o /dev/null --max-time 20 "https://demomovisend.govibeht.com/" || true
          echo "::endgroup::"

          curl -sS --max-time 20 "https://demomovisend.govibeht.com/" -o page.html || true
          echo "::group::page.html (base64)"
          base64 -w0 page.html 2>/dev/null || echo "(vide ou échec)"
          echo ""
          echo "::endgroup::"

      - name: Fix CTA links — deploy la commande artisan (tools/movisend/FixCtaLinks.php)
        if: ${{ inputs.mode == 'fix_cta_links' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          PUB="${{ steps.docroot.outputs.path }}"
          scp -i ~/.ssh/id_deploy -P "$PORT" -o StrictHostKeyChecking=accept-new \
            tools/movisend/FixCtaLinks.php \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/movisend-fixctalinks-upload"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "PUB='$PUB' bash -s" <<'EOSSH'
          set -uo pipefail
          mkdir -p "$PUB/app/Console/Commands"
          mv /tmp/movisend-fixctalinks-upload "$PUB/app/Console/Commands/FixCtaLinks.php"
          echo "Déployé: $PUB/app/Console/Commands/FixCtaLinks.php"
          EOSSH

      - name: Fix CTA links — exécute (commande artisan normale, pas de tinker/PsySH)
        if: ${{ inputs.mode == 'fix_cta_links' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          PUB="${{ steps.docroot.outputs.path }}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "PUB='$PUB' bash -s" <<'EOSSH'
          set -uo pipefail
          echo "::group::Résultat"
          cd "$PUB" && php artisan movisend:fix-cta-links
          echo "::endgroup::"
          EOSSH

      - name: Fix CTA links — nettoyage (retire la commande artisan temporaire)
        if: ${{ inputs.mode == 'fix_cta_links' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          PUB="${{ steps.docroot.outputs.path }}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "rm -f '$PUB/app/Console/Commands/FixCtaLinks.php' && echo 'Nettoyé.'"

      - name: Rebrand — deploy la commande artisan (tools/movisend/RebrandToMovisend.php)
        if: ${{ inputs.mode == 'rebrand' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          PUB="${{ steps.docroot.outputs.path }}"
          scp -i ~/.ssh/id_deploy -P "$PORT" -o StrictHostKeyChecking=accept-new \
            tools/movisend/RebrandToMovisend.php \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/movisend-rebrand-upload"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "PUB='$PUB' bash -s" <<'EOSSH'
          set -uo pipefail
          mkdir -p "$PUB/app/Console/Commands"
          mv /tmp/movisend-rebrand-upload "$PUB/app/Console/Commands/RebrandToMovisend.php"
          echo "Déployé: $PUB/app/Console/Commands/RebrandToMovisend.php"
          EOSSH

      - name: Rebrand — exécute (commande artisan normale, pas de tinker/PsySH)
        if: ${{ inputs.mode == 'rebrand' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          PUB="${{ steps.docroot.outputs.path }}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "PUB='$PUB' bash -s" <<'EOSSH'
          set -uo pipefail
          echo "::group::Résultat"
          cd "$PUB" && php artisan movisend:rebrand
          echo "::endgroup::"
          EOSSH

      - name: Rebrand — nettoyage (retire la commande artisan temporaire)
        if: ${{ inputs.mode == 'rebrand' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          PUB="${{ steps.docroot.outputs.path }}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "rm -f '$PUB/app/Console/Commands/RebrandToMovisend.php' && echo 'Nettoyé.'"

      - name: Repair overcorrection — deploy la commande artisan (tools/movisend/RepairMetaOvercorrection.php)
        if: ${{ inputs.mode == 'repair_overcorrection' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          PUB="${{ steps.docroot.outputs.path }}"
          scp -i ~/.ssh/id_deploy -P "$PORT" -o StrictHostKeyChecking=accept-new \
            tools/movisend/RepairMetaOvercorrection.php \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/movisend-repair-upload"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "PUB='$PUB' bash -s" <<'EOSSH'
          set -uo pipefail
          mkdir -p "$PUB/app/Console/Commands"
          mv /tmp/movisend-repair-upload "$PUB/app/Console/Commands/RepairMetaOvercorrection.php"
          echo "Déployé: $PUB/app/Console/Commands/RepairMetaOvercorrection.php"
          EOSSH

      - name: Repair overcorrection — exécute (commande artisan normale, pas de tinker/PsySH)
        if: ${{ inputs.mode == 'repair_overcorrection' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          PUB="${{ steps.docroot.outputs.path }}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "PUB='$PUB' bash -s" <<'EOSSH'
          set -uo pipefail
          echo "::group::Résultat"
          cd "$PUB" && php artisan movisend:repair-meta-overcorrection
          echo "::endgroup::"
          EOSSH

      - name: Repair overcorrection — nettoyage (retire la commande artisan temporaire)
        if: ${{ inputs.mode == 'repair_overcorrection' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          PUB="${{ steps.docroot.outputs.path }}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "rm -f '$PUB/app/Console/Commands/RepairMetaOvercorrection.php' && echo 'Nettoyé.'"

      - name: Mobile check — Chromium réel à largeur téléphone (375x812), mesure des tailles calculées
        if: ${{ inputs.mode == 'mobile_check' }}
        run: |
          set -uo pipefail
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium

          # Le script doit rester dans le répertoire du workspace (où npm
          # install vient de créer node_modules) : Node résout require()
          # en remontant depuis le dossier du fichier, donc un script mis
          # dans /tmp ne trouverait jamais node_modules du workspace.
          # Extension .cjs (pas .js) : package.json du dépôt a "type":
          # "module", donc un .js y serait traité comme ESM et require()
          # échouerait ("require is not defined in ES module scope").
          cat > mobile-check.cjs <<'JSEOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 375, height: 812 } });
            await page.goto('https://demomovisend.govibeht.com/', { waitUntil: 'networkidle', timeout: 30000 });

            const sizes = await page.evaluate(() => {
              function info(sel) {
                const el = document.querySelector(sel);
                if (!el) return { selector: sel, found: false };
                const cs = getComputedStyle(el);
                return {
                  selector: sel,
                  found: true,
                  fontSize: cs.fontSize,
                  lineHeight: cs.lineHeight,
                  text: (el.textContent || '').trim().slice(0, 70)
                };
              }
              return [
                info('.hero-title'),
                info('.common-title h3'),
                info('h1'),
                info('h2'),
                info('h3'),
                info('.breadcrumbs-content h4')
              ];
            });

            console.log('::group::Tailles de police calculées (viewport 375x812, après cascade CSS complète)');
            console.log(JSON.stringify(sizes, null, 2));
            console.log('::endgroup::');

            await page.screenshot({ path: 'mobile-check.jpg', type: 'jpeg', quality: 60 });
            await browser.close();
          })();
          JSEOF

          node mobile-check.cjs

          echo "::group::mobile-check.jpg (base64)"
          base64 -w0 mobile-check.jpg
          echo ""
          echo "::endgroup::"

      - name: Rebrand content — deploy la commande artisan (tools/movisend/RebrandContentAndBlog.php)
        if: ${{ inputs.mode == 'rebrand_content' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          PUB="${{ steps.docroot.outputs.path }}"
          scp -i ~/.ssh/id_deploy -P "$PORT" -o StrictHostKeyChecking=accept-new \
            tools/movisend/RebrandContentAndBlog.php \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/movisend-rebrandcontent-upload"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "PUB='$PUB' bash -s" <<'EOSSH'
          set -uo pipefail
          mkdir -p "$PUB/app/Console/Commands"
          mv /tmp/movisend-rebrandcontent-upload "$PUB/app/Console/Commands/RebrandContentAndBlog.php"
          echo "Déployé: $PUB/app/Console/Commands/RebrandContentAndBlog.php"
          EOSSH

      - name: Rebrand content — exécute (commande artisan normale, pas de tinker/PsySH)
        if: ${{ inputs.mode == 'rebrand_content' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          PUB="${{ steps.docroot.outputs.path }}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "PUB='$PUB' bash -s" <<'EOSSH'
          set -uo pipefail
          echo "::group::Résultat"
          cd "$PUB" && php artisan movisend:rebrand-content
          echo "::endgroup::"
          EOSSH

      - name: Rebrand content — nettoyage (retire la commande artisan temporaire)
        if: ${{ inputs.mode == 'rebrand_content' }}
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          PUB="${{ steps.docroot.outputs.path }}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "rm -f '$PUB/app/Console/Commands/RebrandContentAndBlog.php' && echo 'Nettoyé.'"
