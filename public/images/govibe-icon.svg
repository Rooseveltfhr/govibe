<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Outer red filled circle -->
  <circle cx="100" cy="100" r="98" fill="#DC2626"/>
  <!-- White ring gap (creates ring effect) -->
  <circle cx="100" cy="100" r="72" fill="white"/>
  <!-- Inner red filled circle -->
  <circle cx="100" cy="100" r="52" fill="#DC2626"/>
  <!-- Power button top notch (pill) - white, sitting at top of ring -->
  <rect x="91" y="4" width="18" height="36" rx="9" fill="#DC2626"/>
  <rect x="95" y="6" width="10" height="32" rx="5" fill="white"/>
  <!-- Lightning bolt - white -->
  <path d="M114 42 L80 108 H102 L86 158 L132 88 H108 Z" fill="white"/>
</svg>
