<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="DJOUNES">
  <title>DJOUNES — monogramme</title>
  <!-- Monogramme carré : favicon, avatar social, étiquette produit.
       Lisible à 32 px. Même construction que le mot-symbole. -->
  <rect width="256" height="256" rx="44" fill="#0B3B2E"/>
  <rect x="14" y="14" width="228" height="228" rx="32" fill="none"
        stroke="#D4AF37" stroke-width="3"/>

  <text x="128" y="152" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="118" fill="#D4AF37">D</text>

  <path d="M64 186 H108 l10 -16 l9 30 l10 -14 H192"
        fill="none" stroke="#E8C87A" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
